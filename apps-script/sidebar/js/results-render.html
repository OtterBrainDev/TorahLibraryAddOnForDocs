<script>
// A search's results (raw, then filtered and sorted). Each search run owns one
// (sidebar/js/search-tabs); the shown tab's is the global queryState.
function emptySearchQueryState() {
  return { rawLibraryMatches: [], rawSearchResults: [], libraryMatches: [], searchResults: [] };
}

// A search's corpus filter state; each search run owns one, and the shown
// tab's is the global resultPostProcessState.
// removedCorpora: hidden this search via a group's ❌ button (or a chip).
// restoredExcluded: hidden by the tab's excluded-corpora preference but
// brought back for this search via the Restore Corpus menu (or a chip).
// nonInsertableRefs: refs this search found to be a whole book or section
// heading (no text of their own). They are dropped from the results so the
// reader isn't offered the same dead end twice.
function newResultPostProcessState() {
  return { availableCorpora: [], removedCorpora: [], restoredExcluded: [], nonInsertableRefs: [] };
}

function resetResultPostProcessState() {
  resultPostProcessState = newResultPostProcessState();
}

function normalizeResultRefKey(ref) {
  return String(ref || '').trim().replace(/\s+/g, ' ').toLowerCase();
}

// `state` is a search run's post-process state; the shown one by default.
function markResultRefNonInsertable(ref, state) {
  state = state || resultPostProcessState;
  var key = normalizeResultRefKey(ref);
  if (!key) return;
  var refs = state.nonInsertableRefs || (state.nonInsertableRefs = []);
  if (refs.indexOf(key) < 0) refs.push(key);
}

function isNonInsertableResultRef(ref, state) {
  return ((state || resultPostProcessState).nonInsertableRefs || []).indexOf(normalizeResultRefKey(ref)) >= 0;
}

/* ── Corpus order / exclusion preferences ───────────────────────────────── */
//
// Each tab has its "corpora": Texts' corpora, Voices' topic categories
// (sidebar/js/voices) and the Lexicon's dictionaries (sidebar/js/lexicon),
// each with a saved order and a saved list to leave out (Preferences →
// Search). `mode` is the tab, the shown one by default: a search running in a
// tab that isn't shown is filtered by that tab's preferences.

function getPreferenceCorpusOrder(mode) {
  var prefs = effectivePreferences || {};
  if ((mode || appMode) === 'voices') return normalizeVoicesTopicOrder(prefs.voices_topic_order);
  return normalizeSearchCorpusOrder(prefs.search_corpus_order);
}

function getPreferenceExcludedCorpora(mode) {
  var prefs = effectivePreferences || {};
  mode = mode || appMode;
  if (mode === 'texts') return normalizeSearchCorpusExcluded(prefs.search_corpus_excluded);
  if (mode === 'voices') return normalizeVoicesTopicExcluded(prefs.voices_topic_excluded);
  if (mode === 'lexicon') return normalizeLexiconDictionaryExcluded(prefs.lexicon_dictionary_excluded);
  return [];
}

function isPreferenceExcludedCorpus(corpusKey, mode) {
  return getPreferenceExcludedCorpora(mode).indexOf(corpusKey) >= 0;
}

// Corpus keys currently hidden by the preference (i.e. not restored for
// this search).
function getActivePreferenceExcludedCorpora(mode, state) {
  var restored = (state || resultPostProcessState).restoredExcluded || [];
  return getPreferenceExcludedCorpora(mode).filter(function (key) {
    return restored.indexOf(key) < 0;
  });
}

// Every hidden corpus that has results in the current search, most recently
// hidden first: ❌-removed corpora, then preference-excluded ones.
function getRestorableCorpora() {
  var available = resultPostProcessState.availableCorpora || [];
  var removed = (resultPostProcessState.removedCorpora || []).slice().reverse().map(function (key) {
    return { key: key, fromPreference: false };
  });
  var excluded = getActivePreferenceExcludedCorpora().filter(function (key) {
    return available.some(function (entry) { return entry.key === key; });
  }).map(function (key) {
    return { key: key, fromPreference: true };
  });
  return removed.concat(excluded);
}

// Reorder cluster labels so "Library" stays first and the rest follow
// the user's corpus order. Corpora missing from the order keep their
// incoming (relevance) order after every ordered corpus.
function sortClustersByCorpusPreference(clusterOrder, clusterBuckets, groupName) {
  var order = getPreferenceCorpusOrder();
  return clusterOrder.map(function (cluster, index) {
    var key = getResultCorpusKey(clusterBuckets[cluster][0], groupName);
    var rank = order.indexOf(key);
    if (key === DIRECT_MATCH_CORPUS_KEY) rank = -1;
    else if (rank < 0) rank = order.length + index;
    return { cluster: cluster, rank: rank };
  }).sort(function (a, b) {
    return a.rank - b.rank;
  }).map(function (entry) {
    return entry.cluster;
  });
}

// `qs` is a search run's results; the shown tab's by default.
function getAllProcessedResults(qs) {
  qs = qs || queryState;
  return qs.libraryMatches.concat(qs.searchResults).filter(function (item) { return item && item.ref; });
}

function getAllRawResults(qs) {
  qs = qs || queryState;
  return qs.rawLibraryMatches.concat(qs.rawSearchResults).filter(function (item) { return item && item.ref; });
}

function getResultCorpusLabel(item, fallbackLabel) {
  return String((item && (item.clusterLabel || item.typeLabel || fallbackLabel)) || 'Other').trim() || 'Other';
}

// A result that names its corpus (a Voices sheet's topic category) is filed
// under that key; any other under its cluster label, slugged.
function getResultCorpusKey(item, fallbackLabel) {
  if (item && item.corpusKey) return String(item.corpusKey);
  return getResultCorpusLabel(item, fallbackLabel)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'other';
}

function syncAvailableCorpusFilters(mode, qs, ps) {
  mode = mode || appMode;
  ps = ps || resultPostProcessState;
  var byKey = {};
  var raw = getAllRawResults(qs);
  // Lexicon: the "corpora" are the dictionaries the words' entries come from
  // (sidebar/js/lexicon). Hiding one takes its entries out of every word.
  // Elsewhere each corpus counts its results (the Voices topic chips show it).
  ps.availableCorpora = mode === 'lexicon' ? lexiconDictionaryCorpora(raw) : raw.map(function (item) {
    return {
      key: getResultCorpusKey(item, 'Results'),
      label: getResultCorpusLabel(item, 'Results'),
      count: 1
    };
  }).filter(function (entry) {
    if (!entry.key) return false;
    if (byKey[entry.key]) { byKey[entry.key].count++; return false; }
    byKey[entry.key] = entry;
    return true;
  });
  if (mode === 'voices') ps.availableCorpora = sortVoicesTopicCorpora(ps.availableCorpora);
  ps.removedCorpora = ps.removedCorpora.filter(function (key) {
    return ps.availableCorpora.some(function (entry) { return entry.key === key; });
  });
}

function ensureResultFilterUI() {
  if ($('.result-filter-strip').length) {
    return;
  }
  $('.results-header').after("<div class='result-filter-strip' style='display:none;'></div>");
}

function renderResultFilterStrip() {
  ensureResultFilterUI();
  var $strip = $('.result-filter-strip');
  $strip.hide().empty();
  syncRestoreCorpusButton();

  if (appMode === 'lexicon') {
    renderCorpusChipStrip($strip, { label: 'Dictionaries:', one: 'entry', many: 'entries', chipClass: 'lexicon-dict-chip' });
    return;
  }
  if (appMode === 'voices') {
    renderCorpusChipStrip($strip, { label: 'Topics:', one: 'sheet', many: 'sheets', chipClass: 'voices-topic-chip' });
    return;
  }
  if (appMode !== 'texts') return;

  var params = getSearchParameters();
  var activeLangs = params.translationLanguages;
  if (!activeLangs || !activeLangs.length) return;

  // Build label lookup from the existing checkbox DOM
  var langLabels = {};
  $('.translation-language-option').each(function () {
    var code = $(this).val();
    var label = $(this).closest('label').find('span').text() || code;
    langLabels[code] = label;
  });

  var html = "<span class='lang-filter-strip-label'>Language:</span>";
  activeLangs.forEach(function (code) {
    var label = langLabels[code] || code;
    html += "<button type='button' class='result-filter-chip lang-filter-chip'" +
      " data-lang-filter='" + escapeHTML(code) + "'" +
      " title='Remove " + escapeHTML(label) + " filter'>" +
      escapeHTML(label) + " <span aria-hidden='true'>\u00d7</span></button>";
  });
  if (activeLangs.length > 1) {
    html += "<button type='button' class='result-filter-chip lang-filter-clear-chip'" +
      " title='Clear all language filters'>Clear all \u00d7</button>";
  }
  $strip.html(html).show();
}

// Nothing selected in the shown tab. The Texts preview (the fetched text,
// its versions, the source card) is cleared only in Texts: another tab's
// reset must leave it as it was, since switching back to Texts shows it
// again (sidebar/js/search-tabs).
// The shown tab's corpora as chips over its results (the Lexicon's
// dictionaries, Voices' topic categories): one per corpus with its count; a
// click hides or shows it for this search (toggleCorpusVisibility, bound in
// event-bindings), and one left out in Preferences says so, as Restore Corpus
// does in Texts.
function getHiddenCorpora() {
  var removed = resultPostProcessState.removedCorpora || [];
  var saved = getActivePreferenceExcludedCorpora();
  return removed.concat(saved.filter(function (key) { return removed.indexOf(key) < 0; }));
}

function renderCorpusChipStrip($strip, options) {
  var corpora = resultPostProcessState.availableCorpora || [];
  if (!corpora.length) return;
  var hidden = getHiddenCorpora();
  var saved = getActivePreferenceExcludedCorpora();
  var html = "<span class='lang-filter-strip-label'>" + escapeHTML(options.label) + "</span>";
  corpora.forEach(function (corpus) {
    var isHidden = hidden.indexOf(corpus.key) >= 0;
    var count = ' (' + corpus.count + ' ' + (corpus.count === 1 ? options.one : options.many) + ')';
    var action = saved.indexOf(corpus.key) >= 0
      ? 'Hidden in Preferences. Show ' + corpus.label + count + ' for this search'
      : (isHidden ? 'Show ' : 'Hide ') + corpus.label + count;
    html += "<button type='button' class='result-filter-chip corpus-chip " + options.chipClass + (isHidden ? ' removed' : '') + "'" +
      " data-corpus-key='" + escapeHTML(corpus.key) + "'" +
      " aria-pressed='" + (isHidden ? 'false' : 'true') + "'" +
      " title='" + escapeHTML(action) + "' aria-label='" + escapeHTML(action) + "'>" +
      escapeHTML(corpus.label) + " <span class='corpus-chip-count' aria-hidden='true'>" + corpus.count + "</span></button>";
  });
  // Every interpolated label goes through escapeHTML; counts are numbers.
  $strip.html(html).show();
}

function resetSelectedResultView() {
  selectedResultKey = null;
  selectedResultSummary = null;
  selectedRefValue = null;
  resultsCollapsed = false;
  hasResolvedReference = false;
  setInsertButtonState(false);
  $('#open-on-sefaria').prop('disabled', true);
  $('.result-item').removeClass('selected').attr('aria-pressed', 'false');
  if (appMode === 'voices') selectedVoiceItem = null;
  if (appMode !== 'texts') return;
  data = {};
  clearVersionSelectors();
  $('.suggestions').html("<b>Select a result to preview it.</b>");
  updateActionabilityUI({ isInsertable: false });
  $('.source-card').hide();
  if (typeof updateSourceCardSefariaState === 'function') updateSourceCardSefariaState();
  if (typeof renderRecentSources === 'function') renderRecentSources();
}

function ensureSelectedResultStillVisible() {
  if (!selectedResultKey) {
    return;
  }
  var stillVisible = getAllProcessedResults().some(function (item) { return item.key === selectedResultKey; });
  if (!stillVisible) {
    resetSelectedResultView();
  }
}

// A search's raw results → the lists shown: the tab's hidden corpora and the
// refs found to be dead ends left out, duplicates dropped, then sorted. No
// DOM: a search running in a tab that isn't shown is processed the same way
// (sidebar/js/search-tabs), with that tab's preferences.
function computeResultPostProcessing(mode, qs, ps) {
  syncAvailableCorpusFilters(mode, qs, ps);
  var removedLookup = {};
  ps.removedCorpora.concat(getActivePreferenceExcludedCorpora(mode, ps)).forEach(function (key) {
    removedLookup[key] = true;
  });
  var searchParameters = getSearchParameters();
  // The sort menu is a Texts tool; the other tabs keep their own order.
  var sortMode = mode === 'texts' ? searchParameters.sortMode : 'relevance';
  var filterItems = function (items, fallbackLabel) {
    return applyClientSideSearchFilters(items, searchParameters, mode).filter(function (item) {
      if (item && isNonInsertableResultRef(item.ref, ps)) return false;
      return !removedLookup[getResultCorpusKey(item, fallbackLabel)];
    });
  };

  qs.libraryMatches = sortLibraryItems(
    dedupeResultItems(filterItems(qs.rawLibraryMatches, 'Library matches')),
    sortMode
  );
  qs.searchResults = sortSearchItems(
    dedupeResultItems(filterItems(qs.rawSearchResults, 'Search results')),
    sortMode
  );
  if (mode === 'lexicon') qs.searchResults = arrangeLexiconWords(qs.searchResults, removedLookup);
  if (mode === 'voices') qs.searchResults = arrangeVoicesSheets(qs.searchResults);
  return qs;
}

function applyResultPostProcessing() {
  computeResultPostProcessing(appMode, queryState, resultPostProcessState);
  ensureSelectedResultStillVisible();
  renderResultFilterStrip();
  setResultsLoading(false);
  if (appMode === 'lexicon') syncLexiconAfterFiltering();
  if (typeof noteShownSearchRunCount === 'function') noteShownSearchRunCount();
}


function reprocessAndRenderResults() {
  applyResultPostProcessing();
  renderResults();
}

function toggleCorpusVisibility(corpusKey) {
  var removedIndex = resultPostProcessState.removedCorpora.indexOf(corpusKey);
  var restoredIndex = resultPostProcessState.restoredExcluded.indexOf(corpusKey);
  if (removedIndex >= 0) {
    resultPostProcessState.removedCorpora.splice(removedIndex, 1);
  } else if (isPreferenceExcludedCorpus(corpusKey, appMode)) {
    // Excluded in Preferences: restore (or re-hide) for this search only.
    if (restoredIndex >= 0) {
      resultPostProcessState.restoredExcluded.splice(restoredIndex, 1);
    } else {
      resultPostProcessState.restoredExcluded.push(corpusKey);
    }
  } else {
    resultPostProcessState.removedCorpora.push(corpusKey);
  }
  reprocessAndRenderResults();
}

function renderResultGroup(selector, items, groupName) {
  var $list = $(selector);
  if (!items.length && resultsLoading) return;
  $list.empty();
  if (!items.length) {
    if (selector === '.search-results') return;
    if (selector === '.library-results' && appMode !== 'texts') return;
    $list.append("<li class='result-subtitle'>No " + groupName.toLowerCase() + ".</li>");
    return;
  }

  // Lexicon mode: words, under Matches / Related words (sidebar/js/lexicon).
  if (appMode === 'lexicon') {
    renderLexiconWordList($list, items);
    return;
  }

  // Pre-group items by cluster, preserving within-cluster order and the order
  // clusters first appear. This prevents the same label (e.g. "Library") from
  // being emitted as multiple disconnected headers when the incoming sort
  // interleaves clusters.
  var clusterOrder = [];
  var clusterBuckets = {};
  items.forEach(function (item) {
    var cluster = getResultCorpusLabel(item, groupName);
    if (!clusterBuckets.hasOwnProperty(cluster)) {
      clusterBuckets[cluster] = [];
      clusterOrder.push(cluster);
    }
    clusterBuckets[cluster].push(item);
  });

  if (appMode === 'texts' || appMode === 'voices') {
    clusterOrder = sortClustersByCorpusPreference(clusterOrder, clusterBuckets, groupName);
  }

  clusterOrder.forEach(function (cluster) {
    var corpusKey = getResultCorpusKey(clusterBuckets[cluster][0], groupName);
    var accentClass = getCorpusAccentClass(corpusKey);
    if (cluster) {
      $list.append("<li class='result-group-header " + accentClass + "'><button type='button' class='result-group-remove' data-corpus-key='" + escapeHTML(corpusKey) + "' title='Hide corpus'>❌</button><span class='result-cluster-label'>" + escapeHTML(cluster) + "</span></li>");
    }
    clusterBuckets[cluster].forEach(function (item) {
      var selectedClass = item.key === selectedResultKey ? 'selected' : '';
      // A sheet's group is its header: its row says who made it and its own
      // topics (every sheet is in English and Hebrew alike).
      var metaParts = appMode === 'voices'
        ? [item.owner ? 'By ' + item.owner : '', (Array.isArray(item.topics) ? item.topics : []).filter(function (t) { return typeof t === 'string'; }).slice(0, 3).join(', ')]
        : [cluster, describeResultLanguages(item)];
      var metaLine = "<div class='result-meta'>" + metaParts.filter(Boolean).map(function (part) {
        return "<span>" + escapeHTML(part) + "</span>";
      }).join("<span> • </span>") + "</div>";
      var subtitle = item.subtitle ? "<div class='result-subtitle'>" + escapeHTML(item.subtitle) + "</div>" : '';
      // Highlight fragments come back as Sefaria HTML (<b> around the match),
      // so they are rendered rather than escaped — after the same strip the
      // preview uses.
      var snippet = item.snippet ? "<div class='result-snippet'>" + sanitizeSourceHtml(item.snippet) + "</div>" : subtitle;
      var titleText = (appMode === 'voices') ? (item.label || item.ref) : (groupName === 'Search results' && item.ref ? item.ref : (item.label || item.ref));
      var sefariaBtn = appMode !== 'voices' ? "<button type='button' class='result-sefaria-btn' data-ref='" + escapeHTML(item.ref) + "' aria-label='Open on Sefaria' title='Open on Sefaria'><span class='open-sefaria-icon' aria-hidden='true'></span></button>" : '';
      $list.append("<li class='result-item result-row " + accentClass + " " + selectedClass + "' data-key='" + escapeHTML(item.key) + "' data-ref='" + escapeHTML(item.ref) + "' role='button' tabindex='0' aria-pressed='" + (item.key === selectedResultKey ? 'true' : 'false') + "'><div class='result-row-main'><button type='button' class='result-pin-button" + (isPinnedRef(item.ref) ? " is-pinned" : "") + "' data-ref='" + escapeHTML(item.ref) + "' data-label='" + escapeHTML(item.label || item.ref) + "' aria-label='" + (isPinnedRef(item.ref) ? "Unpin result" : "Pin result") + "' title='" + (isPinnedRef(item.ref) ? "Unpin result" : "Pin result") + "'>📌</button><div class='result-title'>" + escapeHTML(item.label || item.ref) + "</div>" + sefariaBtn + "</div>" + metaLine + snippet + "</li>");
    });
  });
}

function positionRestoreCorpusMenu() {
  var menu = document.getElementById('restore-corpus-menu');
  var wrap = document.getElementById('restore-corpus-menu-wrap');
  if (!menu || !wrap) return;

  menu.style.left = '';
  menu.style.right = '0';

  var menuRect = menu.getBoundingClientRect();
  var viewportPadding = 8;

  if (menuRect.left < viewportPadding) {
    menu.style.right = 'auto';
    menu.style.left = '0';
  }
}

function closeRestoreCorpusMenu() {
  $('#restore-corpus-menu').addClass('hidden');
  $('#restore-corpus-button').attr('aria-expanded', 'false');
}

function openRestoreCorpusMenu() {
  if (!getRestorableCorpora().length) return;
  $('#restore-corpus-menu').removeClass('hidden');
  $('#restore-corpus-button').attr('aria-expanded', 'true');
  positionRestoreCorpusMenu()
}

function renderRestoreCorpusMenu() {
  var $items = $('#restore-corpus-menu-items');
  var restorable = getRestorableCorpora();

  if (!$items.length) return;

  if (!restorable.length) {
    $items.empty();
    closeRestoreCorpusMenu();
    return;
  }

  var html = restorable.map(function (hidden) {
    var entry = (resultPostProcessState.availableCorpora || []).find(function (item) {
      return item.key === hidden.key;
    });
    var label = entry ? entry.label : hidden.key;
    var title = hidden.fromPreference ? ' title="Hidden in Preferences — show for this search"' : '';
    var note = hidden.fromPreference ? ' <span class="restore-corpus-menu-note">(Preferences)</span>' : '';
    return (
      '<button type="button" class="restore-corpus-menu-item" role="menuitem" ' +
      'data-corpus-key="' + escapeHTML(hidden.key) + '"' + title + '>' +
      escapeHTML(label) + note +
      '</button>'
    );
  }).join('');

  $items.html(html);
}

function syncRestoreCorpusButton() {
  var $button = $('#restore-corpus-button');
  var restorable = getRestorableCorpora();

  if (!$button.length) return;

  var hasRemoved = restorable.length > 0;

  $button.prop('disabled', !hasRemoved);
  $button.attr('aria-disabled', hasRemoved ? 'false' : 'true');
  $button.toggleClass('is-active', hasRemoved);

  if (!hasRemoved) {
    $button.attr('title', 'Restore Corpus').attr('aria-label', 'Restore Corpus');
    closeRestoreCorpusMenu();
  } else {
    var latestKey = restorable[0].key;
    var latestEntry = (resultPostProcessState.availableCorpora || []).find(function (item) {
      return item.key === latestKey;
    });
    var tooltip = latestEntry ? 'Restore ' + latestEntry.label : 'Restore Corpus';
    $button.attr('title', tooltip).attr('aria-label', 'Restore Corpus');
  }

  renderRestoreCorpusMenu();
}


function renderResults() {
  renderResultGroup('.library-results', queryState.libraryMatches, 'Library matches');
  renderResultGroup('.search-results', queryState.searchResults, 'Search results');

  var hasLibraryMatches = queryState.libraryMatches.length > 0;
  var hasSearchResults = queryState.searchResults.length > 0;

  $('.library-results-heading-row').toggle(appMode !== 'voices' && hasLibraryMatches);
  // Lexicon labels its own groups (Matches / Related words).
  $('.search-results-label').toggle(appMode === 'texts' && hasSearchResults);
  $('.search-results').toggle(appMode === 'voices' || hasSearchResults);

  syncRestoreCorpusButton();
  if (typeof renderSearchTabPrompt === 'function') renderSearchTabPrompt();
  updateResultsVisibility();
}

function updateResultsVisibility() {
  var shouldCollapse = resultsCollapsed && !!selectedResultSummary;
  $('.results-lists').toggle(!shouldCollapse);
  $('.results-toggle-button').toggle(!!selectedResultSummary).text(shouldCollapse ? 'Show results' : 'Hide results');
  // selected-result-summary is suppressed via CSS (display:none !important);
  // source card is the canonical display of the selected result.
  $('.selected-result-summary').hide().empty();
  // Populate new source card
  updateSourceCard();
}

function updateSourceCard() {
  if (!selectedResultSummary) {
    $('.source-card').hide();
    return;
  }
  $('.source-card-title').text(selectedResultSummary.label || '');
  var status = selectedResultSummary.status || 'Resolving…';
  $('.source-card-status-text').text(status);
  var dot = $('.source-card-status-dot');
  dot.removeClass('dot-ready dot-pending dot-error');
  if (!selectedResultSummary.status || status === 'Resolving…') {
    dot.addClass('dot-pending');
  } else if (status.indexOf('Ready') >= 0 || status.indexOf('ready') >= 0) {
    dot.addClass('dot-ready');
  } else if (status.indexOf('more specific') >= 0 || status.indexOf('not found') >= 0) {
    dot.addClass('dot-error');
  } else {
    dot.addClass('dot-ready');
  }
  // Show card immediately when a texts result is selected (don't wait for async)
  if (typeof appMode !== 'undefined' && appMode === 'texts' && !!selectedResultKey) {
    $('.source-card').show();
  }
  if (typeof updateSourceCardSefariaState === 'function') updateSourceCardSefariaState();
}

function clearSelectedResult() {
  resetResultPostProcessState();
  queryState = emptySearchQueryState();
  resetSelectedResultView();
  updateResultsVisibility();
  renderResultFilterStrip();
}

function compareResultsAlphabetically(a, b, direction) {
  var left = normalizeOptionText((a && (a.label || a.ref)) || '').toLowerCase();
  var right = normalizeOptionText((b && (b.label || b.ref)) || '').toLowerCase();
  return direction === 'desc' ? right.localeCompare(left) : left.localeCompare(right);
}

function isDirectReferenceItem(item) {
  if (!item) return false;
  var subtitle = String(item.subtitle || '').toLowerCase();
  var key = String(item.key || '').toLowerCase();
  return subtitle.indexOf('direct reference lookup') >= 0 || key.indexOf('library-ref-') === 0;
}

function compareByCategory(a, b) {
  var catA = String((a && a.clusterLabel) || '').toLowerCase();
  var catB = String((b && b.clusterLabel) || '').toLowerCase();
  if (catA !== catB) return catA.localeCompare(catB);
  var labelA = normalizeOptionText((a && (a.label || a.ref)) || '').toLowerCase();
  var labelB = normalizeOptionText((b && (b.label || b.ref)) || '').toLowerCase();
  return labelA.localeCompare(labelB);
}

function sortByRecentSession(items) {
  var list = (typeof sessionLibrary !== 'undefined' && sessionLibrary && Array.isArray(sessionLibrary.inserted)) ? sessionLibrary.inserted : [];
  var refIndexMap = {};
  list.forEach(function(entry, i) { if (entry && entry.ref) refIndexMap[entry.ref] = i; });
  var recent = [];
  var other = [];
  items.forEach(function(item) {
    if (item && item.ref && refIndexMap.hasOwnProperty(item.ref)) {
      recent.push(item);
    } else {
      other.push(item);
    }
  });
  recent.sort(function(a, b) { return refIndexMap[a.ref] - refIndexMap[b.ref]; });
  return recent.concat(other);
}

function sortLibraryItems(items, sortMode) {
  var direct = [];
  var rest = [];
  var fuzzy = [];
  (items || []).forEach(function(item) {
    (isDirectReferenceItem(item) ? direct : (item && item.isFuzzy ? fuzzy : rest)).push(item);
  });
  if (sortMode === 'alphabetical-asc') {
    rest.sort(function(a, b) { return compareResultsAlphabetically(a, b, 'asc'); });
  } else if (sortMode === 'alphabetical-desc') {
    rest.sort(function(a, b) { return compareResultsAlphabetically(a, b, 'desc'); });
  } else if (sortMode === 'category') {
    rest.sort(compareByCategory);
  } else if (sortMode === 'recent') {
    rest = sortByRecentSession(rest);
  }
  // 'relevance': preserve existing order. Close matches stay last in every
  // sort mode; they are the fallback, not peers of the exact results.
  return direct.concat(rest, fuzzy);
}

function sortSearchItems(items, sortMode) {
  var out = (items || []).slice();
  if (sortMode === 'alphabetical-asc') {
    out.sort(function(a, b) { return compareResultsAlphabetically(a, b, 'asc'); });
  } else if (sortMode === 'alphabetical-desc') {
    out.sort(function(a, b) { return compareResultsAlphabetically(a, b, 'desc'); });
  } else if (sortMode === 'category') {
    out.sort(compareByCategory);
  } else if (sortMode === 'recent') {
    out = sortByRecentSession(out);
  }
  // 'relevance': preserve existing order
  return out;
}

function itemMatchesTranslationLanguages(item, languages) {
  if (!item || item.hasTranslation === false) return false;
  var selected = Array.isArray(languages) ? languages.filter(Boolean) : [];
  if (!selected.length) return item.hasTranslation !== false;
  var available = Array.isArray(item.availableLangs) ? item.availableLangs.map(function (lang) { return String(lang || '').toLowerCase(); }) : [];
  if (!available.length) return item.hasTranslation !== false;
  return selected.some(function (lang) { return available.indexOf(String(lang || '').toLowerCase()) >= 0; });
}

function dedupeResultItems(items) {
  var seen = {};
  var out = [];
  (items || []).forEach(function(item) {
    if (!item || !item.ref) return;
    var key = String(item.ref).trim().toLowerCase();
    if (seen[key]) return;
    seen[key] = true;
    out.push(item);
  });
  return out;
}

// The translation-language filter is a Texts tool. `mode` is the tab the
// results are for; the shown one by default.
function applyClientSideSearchFilters(items, searchParameters, mode) {
  var filtered = Array.isArray(items) ? items.slice() : [];
  if ((mode || appMode) !== 'texts') return filtered;
  if (searchParameters && searchParameters.translationOnly) {
    filtered = filtered.filter(function (item) { return itemMatchesTranslationLanguages(item, searchParameters.translationLanguages); });
  }
  return filtered;
}

function maybeAutoSelectSingleResult() {
  // Close matches never count: they are guesses, offered for a click. One exact
  // result beside them still auto-selects, as it did before they were listed.
  var allResults = queryState.libraryMatches.concat(queryState.searchResults).filter(function (item) { return item && item.ref && !item.isFuzzy; });
  if (allResults.length !== 1) return;
  var only = allResults[0];
  if (!only || !only.key || selectedResultKey === only.key) return;
  selectResultItem(only);
}

// Select a result of the shown tab, as a click on its row does: the row is
// marked, the list folds away, and the tab opens it (resolveSelectedResult).
function selectResultItem(item) {
  if (!item || !item.key) return;
  selectedResultKey = item.key;
  selectedResultSummary = { label: item.headWord || item.label || item.ref, subtitle: item.subtitle || '' };
  resultsCollapsed = true;
  $('.result-item').each(function () {
    var on = $(this).attr('data-key') === item.key;
    $(this).toggleClass('selected', on).attr($(this).attr('role') === 'option' ? 'aria-selected' : 'aria-pressed', on ? 'true' : 'false');
  });
  updateResultsVisibility();
  resolveSelectedResult(item.ref, item.label || item.ref);
}

function formatRefForResult(ref) {
  var clean = String(ref || '').trim();
  var chunks = clean.split(',').map(function (part) { return part.trim(); }).filter(Boolean);
  if (chunks.length <= 1) return { label: clean, subtitle: '' };
  return { label: chunks[0], subtitle: chunks.slice(1).join(' › ') };
}

function buildResultFromSource(source, fallbackRef, keyPrefix, index, snippet, typeLabel) {
  var ref = source.ref || fallbackRef || '';
  var display = formatRefForResult(ref);
  var sourcePath = Array.isArray(source.path) ? source.path.filter(Boolean) : (typeof source.path === 'string' ? source.path.split('/').map(function (part) { return part.trim(); }).filter(Boolean) : []);
  var breadcrumb = sourcePath.length > 1 ? sourcePath.slice(0, -1).join(' › ') : (display.subtitle || source.heRef || '');
  var availableLangs = Array.isArray(source && source.availableLangs) ? source.availableLangs.map(function (lang) { return String(lang || '').toLowerCase(); }).filter(Boolean) : (Array.isArray(source && source.versions) ? source.versions.map(function (version) { return String((version && version.language) || '').toLowerCase(); }).filter(Boolean) : []);
  var clusterLabel = source.primary_category || (Array.isArray(source.categories) ? source.categories[0] : '') || typeLabel;

  return {
    key: keyPrefix + "-" + index + "-" + (ref || index),
    ref: ref,
    label: sourcePath[sourcePath.length - 1] || display.label || ref || 'Result',
    subtitle: breadcrumb,
    snippet: snippet,
    typeLabel: typeLabel,
    clusterLabel: clusterLabel,
    availableLangs: availableLangs,
    hasTranslation: source && (Array.isArray(source.availableLangs) ? source.availableLangs.length > 0 : (Array.isArray(source.versions) ? source.versions.some(function (version) { return version && String(version.language || '').trim(); }) : true))
  };
}
