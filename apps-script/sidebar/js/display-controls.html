<script>
// Sidebar adapter for the shared Display & Layout pickers
// (shared/insertion-options). The sidebar's state lives in the hidden
// .output-mode-selection / .bilingual-layout-selection selects; their change
// handlers (event-bindings) save it.
initInsertionOptions({
  root: '#layout-tray',
  getState: function () {
    return {
      outputMode: $('.output-mode-selection').val(),
      layout: $('.bilingual-layout-selection').val()
    };
  },
  onSelectDisplay: function (mode) {
    $('.output-mode-selection').val(mode).trigger('change');
    if (typeof applyMultiSelectMode === 'function') applyMultiSelectMode();
  },
  onSelectLayout: function (layout) {
    $('.bilingual-layout-selection').val(layout);
    saveSidebarPreference({ bilingual_layout_default: layout });
    if (hasResolvedReference && data && data.ref) {
      updateSuggestion(data, selectedResultSummary ? selectedResultSummary.label : data.ref);
    }
    if (typeof applyMultiSelectMode === 'function') applyMultiSelectMode();
  }
});

function updateBilingualLayoutVisibility() {
  updateInsertionOptions();
}

function updateTranslationDetailsVisibility() {
  var outputMode = $('.output-mode-selection').val();
  $('.translation-details-row, .translation-details-help').toggle(outputMode === 'both' || outputMode === 'en');
}

function updateHebrewOptionsVisibility() {
  var outputMode = $('.output-mode-selection').val();
  var isTranslationOnly = outputMode === 'en';
  $('.hebrew-options-row').toggle(!isTranslationOnly);
  // The composition card's Hebrew-only parts: see updateInsertionOptions.
  updateInsertionOptions();
}

function updateVersionControlsVisibility() {
  var outputMode = $('.output-mode-selection').val();
  var hideTranslations = $('.translation-version-select option:not(:disabled)').length <= 1;
  $('.translation-version-control').toggle(outputMode !== 'he' && appMode !== 'voices' && !hideTranslations);
  $('.advanced-version-details').toggle(outputMode !== 'en' && appMode === 'texts');
  $('.versions-section').toggleClass('single-translation', hideTranslations);
  if (appMode !== 'voices' && !!selectedResultKey) {
    $('.versions-section').toggle(!hideTranslations);
  }
}

function updateTransliterationVisibility() {
  var outputMode = $('.output-mode-selection').val();
  $('.transliteration-row, .transliteration-help, .transliteration-options-row').toggle(outputMode !== 'en');
}


// Kept for the bootstrap and preference-sync callers.
function syncDisplayModeCards() {
  updateInsertionOptions();
}

function syncLayoutCards() {
  updateInsertionOptions();
}
</script>
