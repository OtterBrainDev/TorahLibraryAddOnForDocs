<script>
function focusResultByIndex(index) {
  var $items = $('.result-item');
  var count = $items.length;
  if (count === 0) return;
  var clamped = Math.max(0, Math.min(index, count - 1));
  keyboardResultIndex = clamped;
  $items.removeClass('is-nav-target');
  var $target = $items.eq(clamped);
  $target.addClass('is-nav-target');
  var title = $target.find('.result-title').text() || $target.text().trim();
  $('#keyboard-result-status').text(title + ', result ' + (clamped + 1) + ' of ' + count);
  if ($target[0] && $target[0].scrollIntoView) {
    $target[0].scrollIntoView({ block: 'nearest' });
  }
}

function showSidebarNotice(message, onConfirm) {
  var $notice = $('#sidebar-notice');
  if (!$notice.length) return;
  var background = document.querySelector('.unified-sidebar');
  var returnFocus = document.activeElement;
  var previouslyInert = background.inert;
  function dismiss() {
    $notice.attr('hidden', true);
    background.inert = previouslyInert;
    if (returnFocus && returnFocus.isConnected) returnFocus.focus();
  }
  $('#sidebar-notice-message').text(String(message || ''));
  $notice.removeAttr('hidden');
  background.inert = true;
  var $ok = $('#sidebar-notice-ok');
  var $cancel = $('#sidebar-notice-cancel');
  $ok.off('click.sidebarNotice').on('click.sidebarNotice', function () {
    dismiss();
    if (typeof onConfirm === 'function') onConfirm();
  });
  $cancel.off('click.sidebarNotice').on('click.sidebarNotice', dismiss);
  $notice.off('keydown.sidebarNotice').on('keydown.sidebarNotice', function (event) {
    if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();
      dismiss();
    } else if (event.key === 'Tab') {
      event.preventDefault();
      var first = event.shiftKey ? $cancel[0] : $ok[0];
      var next = event.shiftKey ? $ok[0] : $cancel[0];
      (document.activeElement === first ? next : first).focus();
    }
  });
  $ok[0].focus();
}

var sidebarToastTimer = null;
function showSidebarToast(message, durationMs) {
  var $toast = $('#sidebar-toast');
  if (!$toast.length) return;
  $toast.text(message || '');
  $('#sidebar-toast-status').text(message || '');
  // `.is-visible` carries the opacity; without it the toast was shown fully
  // transparent, so every toast message went unseen.
  $toast.removeAttr('hidden');
  if (sidebarToastTimer) clearTimeout(sidebarToastTimer);
  requestAnimationFrame(function () { $toast.addClass('is-visible'); });
  sidebarToastTimer = setTimeout(function () {
    $toast.removeClass('is-visible');
    $toast.attr('hidden', true);
  }, durationMs || 3000);
}

// A server insert that went somewhere other than the cursor (below a table)
// returns a notice; show it long enough to read.
function showInsertNotice(result) {
  if (result && result.notice) showSidebarToast(result.notice, 8000);
}

// Preferences takes a few seconds to open. Until the server answers (the
// dialog is then on its way), the busy overlay says so and covers the sidebar,
// so a second click can't open a second dialog. The timer is a backstop for an
// answer that never comes.
var PREFERENCES_OPEN_TIMEOUT_MS = 20000;
var preferencesOpening = false;

function openPreferencesDialog() {
  if (preferencesOpening) return;
  preferencesOpening = true;
  $('.open-preferences-tool').prop('disabled', true).attr('aria-busy', 'true');
  showBusyOverlay('preferences');
  var backstop = setTimeout(done, PREFERENCES_OPEN_TIMEOUT_MS);
  function done() {
    clearTimeout(backstop);
    if (!preferencesOpening) return;
    preferencesOpening = false;
    $('.open-preferences-tool').prop('disabled', false).removeAttr('aria-busy');
    hideBusyOverlay();
  }
  google.script.run
    .withSuccessHandler(function () {
      done();
      // The dialog is modal: the sidebar's next use comes after it closes.
      preferencesMayHaveChanged = true;
    })
    .withFailureHandler(function () {
      done();
      showSidebarToast('Preferences could not be opened. Try again.');
    })
    .preferencesPopup();
}

// Preferences saved in the Preferences dialog reach an open sidebar. The
// dialog marks each save in localStorage (PREFERENCES_SAVED_STORAGE_KEY;
// every page of the add-on shares one origin), which fires a storage event
// here; after the sidebar itself opened Preferences, the first pointer or
// keyboard use of the sidebar re-reads them too, in case the event never
// came. Without this the switches, the Insertion Options card and the preview
// kept the old settings while an insert used the new ones. A setting this
// session overrides in Insertion Options keeps the session's value.
var PREFERENCES_SAVED_STORAGE_KEY = 'sefariaPreferencesSavedAt';
var preferencesMayHaveChanged = false;

function reloadAccountPreferences() {
  preferencesMayHaveChanged = false;
  // A profile made, renamed or switched in Preferences (preferences-state).
  loadSettingsProfiles();
  google.script.run.withSuccessHandler(function (stored) {
    var updated = clonePlainObject(stored || {});
    if (JSON.stringify(updated) === JSON.stringify(accountPreferences)) return;
    accountPreferences = updated;
    effectivePreferences = isAdvancedSessionMode()
      ? mergePreferenceLayers(accountPreferences, sessionPreferences)
      : mergePreferenceLayers(accountPreferences, {});
    applyEffectivePreferencesToUI();
    if (appMode !== 'texts' || selectedRefValue) scheduleSelectedResultRefresh();
  }).getPreferences();
}

function applyPreferencesToCurrentPreview(event) {
  var channel = sidebarPreferenceChannel();
  if (!channel || event.key !== channel || !event.newValue) return;
  var request;
  try { request = JSON.parse(event.newValue); } catch (error) { return; }
  if (!request || typeof request.id !== 'string' || !request.values) return;

  function respond(message) {
    try {
      localStorage.setItem(channel + ':ack', JSON.stringify({ id: request.id, message: message }));
      localStorage.removeItem(channel + ':ack');
    } catch (error) { /* Preferences will report the missing acknowledgement. */ }
  }
  if (appMode !== 'texts' || !hasResolvedReference || !sidebarSessionId) {
    respond('Preview a source in the open Texts sidebar before applying these settings.');
    return;
  }
  var profile = activeSettingsProfile();
  if (request.profile !== (profile ? profile.id : 'p1')) {
    respond('The sidebar is using a different profile. Reopen Preferences and try again.');
    return;
  }
  if (sessionSaveQueue.action) {
    respond('The sidebar is changing its settings. Try again when it is ready.');
    return;
  }
  var changes = {};
  (getAppConfig().sidebarPreferenceKeys || []).forEach(function (key) {
    var value = request.values[key];
    if (typeof value === 'boolean' || typeof value === 'number' ||
        (typeof value === 'string' && value.length <= 9000)) changes[key] = value;
  });
  saveSessionPreference(changes, function () {
    respond('Applied for this sidebar session. The preview will refresh.');
  });
  scheduleSelectedResultRefresh();
}

window.addEventListener('storage', function (event) {
  if (event.key === PREFERENCES_SAVED_STORAGE_KEY) reloadAccountPreferences();
  if (event.key === UI_MODE_STORAGE_KEY) applyUiModeFromStorage(event.newValue);
  applyPreferencesToCurrentPreview(event);
});

// Preferences' Interface switch (Simple / Everything) reaches an open sidebar
// at once, through UI_MODE_STORAGE_KEY (preferences/js.html). Simple mode is
// CSS only (css/components/simple-mode), so the attribute is all that
// changes. The sidebar used to say "Refresh the sidebar to see the change",
// and the refresh cleared this session's Insertion Options.
var UI_MODE_STORAGE_KEY = 'sefariaUiMode';

function applyUiModeFromStorage(raw) {
  if (!raw) return;
  var mode = null;
  try { mode = JSON.parse(raw).mode; } catch (e) { return; }
  if (mode !== 'simple' && mode !== 'full') return;
  $('.unified-sidebar').attr('data-ui-mode', mode);
}

function reloadAccountPreferencesIfStale_() {
  if (preferencesMayHaveChanged) reloadAccountPreferences();
}
document.documentElement.addEventListener('mouseenter', reloadAccountPreferencesIfStale_);
$(document).on('pointerdown focusin keydown', reloadAccountPreferencesIfStale_);

function openPreferencesWithHint(sectionHint) {
  if (sectionHint === 'experimental-features') {
    sessionStorage.setItem('PREF_NAVIGATE_TAB', 'experimental');
  }
  openPreferencesDialog();
}

var appMode = window.INITIAL_SIDEBAR_MODE || 'texts';
var selectedVoiceItem = null;
var selectedLexiconItem = null;

function normalizeSidebarMode(mode) {
  return (mode === 'voices' || mode === 'experimental' || mode === 'lexicon') ? mode : 'texts';
}

function hasExperimentalFeaturesEnabled() {
  var prefs = effectivePreferences || {};
  if (String(prefs.experimental_features_enabled) !== 'true' &&
      prefs.experimental_features_enabled !== true) {
    return false;
  }
  return String(prefs.surprise_me_enabled) === 'true' ||
    prefs.surprise_me_enabled === true;
}

function isSurpriseEnabled() {
  return String((effectivePreferences || {}).surprise_me_enabled) === 'true' ||
    (effectivePreferences || {}).surprise_me_enabled === true;
}

function syncExperimentalAvailability() {
  var hasExperimental = hasExperimentalFeaturesEnabled();
  var surpriseEnabled = isSurpriseEnabled();
  $('.experimental-menu-button').toggle(hasExperimental);
  // Keep the tab bar when 🧪 is all that sits beside Texts, and the 🏃 button
  // when Surprise Me is all that is in it (css/components/sidebar-controls).
  $('.unified-sidebar')
    .toggleClass('has-experimental-tab', hasExperimental)
    .toggleClass('has-surprise-action', surpriseEnabled);
  $('#exp-card-surprise').toggle(surpriseEnabled);
  $('#footer-actions-panel .open-surprise-tool').toggle(surpriseEnabled);
  if (!hasExperimental && appMode === 'experimental') {
    appMode = 'texts';
  }
}

// Preferences → Sidebar: the result tabs that are on, and the Quick Actions
// buttons and Insertion Options controls the person hid. The server prints
// the sidebar root's data-sidebar-tabs, data-quick-actions-hidden and
// data-options-hidden for the first paint (openSharedSidebar_, by the same
// rules: sidebarControlsFromPreferences_ in server/preferences.gs); this keeps
// them in step when Preferences saves while the sidebar is open, without a
// refresh. CSS does the hiding (css/components/sidebar-controls) and keeps a
// switched-off tab shown while it is the open one, so nobody is moved out of a
// search they are in.
var SIDEBAR_TAB_SWITCHES = { voices: 'show_voices_tab', lexicon: 'show_lexicon_tab' };
var SIDEBAR_QUICK_ACTIONS = ['insert_from_selection', 'transform_divine_names', 'link_texts'];
var SIDEBAR_OPTION_CONTROLS = [
  'display', 'arrangement', 'citation', 'line_by_line', 'line_numbers',
  'source_link', 'vowels', 'cantillation', 'hebrew_punctuation', 'transliteration',
  'translation_link', 'translation_punctuation', 'commentary',
  'title_fonts', 'text_fonts'
];
var SIDEBAR_CONTROL_KEYS = ['show_voices_tab', 'show_lexicon_tab', 'sidebar_quick_actions_hidden', 'sidebar_options_hidden'];

function sidebarTabsFromPreferences(prefs) {
  var p = prefs || {};
  var tabs = ['texts'];
  Object.keys(SIDEBAR_TAB_SWITCHES).forEach(function (tab) {
    if (String(p[SIDEBAR_TAB_SWITCHES[tab]]) !== 'false') tabs.push(tab);
  });
  return tabs;
}

function sidebarHiddenIds(raw, known) {
  var list = [];
  try { list = JSON.parse(String(raw == null || raw === '' ? '[]' : raw)); } catch (e) { list = []; }
  if (!Array.isArray(list)) list = [];
  return known.filter(function (id) { return list.indexOf(id) >= 0; });
}

function sidebarControlsFromPreferences(prefs) {
  var p = prefs || {};
  return {
    tabs: sidebarTabsFromPreferences(p),
    quickActionsHidden: sidebarHiddenIds(p.sidebar_quick_actions_hidden, SIDEBAR_QUICK_ACTIONS),
    optionsHidden: sidebarHiddenIds(p.sidebar_options_hidden, SIDEBAR_OPTION_CONTROLS)
  };
}

// Whether a result tab is switched on, as the sidebar root says (the server
// printed it; syncSidebarControls keeps it). Texts always is; so is every tab
// on a page without the attribute.
function sidebarTabIsOn(mode) {
  if (mode === 'texts') return true;
  var tabs = $('.unified-sidebar').attr('data-sidebar-tabs');
  if (tabs == null) return true;
  return String(tabs).split(/\s+/).indexOf(mode) >= 0;
}

function syncSidebarControls() {
  var prefs = effectivePreferences || {};
  var loaded = SIDEBAR_CONTROL_KEYS.some(function (key) {
    return Object.prototype.hasOwnProperty.call(prefs, key);
  });
  // Before the settings arrive, keep what the server printed.
  if (!loaded) return;
  var controls = sidebarControlsFromPreferences(prefs);
  $('.unified-sidebar')
    .attr('data-sidebar-tabs', controls.tabs.join(' '))
    .attr('data-quick-actions-hidden', controls.quickActionsHidden.join(' '))
    .attr('data-options-hidden', controls.optionsHidden.join(' '));
}

function updateQuickActionsForMode() {
  var experimentalMode = appMode === 'experimental';
  $('#footer-actions-panel .open-linker-tool').toggle(!experimentalMode);
  if (experimentalMode) { $('#footer-actions-panel').hide(); }
}

// Switching tabs never searches: the tab left keeps its results and its
// selection, and the tab shown gets its own back (search-tabs).
function setSidebarMode(mode, skipPreferenceSave) {
  var previousMode = appMode;
  var nextMode = normalizeSidebarMode(mode);
  if (nextMode === 'experimental' && !hasExperimentalFeaturesEnabled()) {
    nextMode = 'texts';
  }
  var changing = nextMode !== previousMode;
  if (changing) stashSearchTab(previousMode);
  appMode = nextMode;

  $('body').removeClass('mode-texts mode-voices mode-experimental mode-lexicon')
    .addClass('mode-' + appMode);
  $('.unified-sidebar').attr('data-mode', appMode);
  $('.mode-switch-button').removeClass('is-active').attr('aria-checked', 'false').attr('tabindex', '-1');
  $('.mode-switch-button[data-sidebar-mode="' + appMode + '"]')
    .addClass('is-active').attr('aria-checked', 'true').attr('tabindex', '0');

  $('.voices-only').toggle(appMode === 'voices');
  $('.lexicon-only').toggle(appMode === 'lexicon');
  $('.text-mode-only').toggle(appMode === 'texts');
  $('.experimental-section').toggle(appMode === 'experimental');

  if (appMode !== 'texts' && typeof closeLayoutTray === 'function') closeLayoutTray();

  $('.reference-row .search-submit, .reference-row .history-submit').show();
  var placeholders = { texts: 'Search texts…', voices: 'Search voices…', lexicon: 'Search dictionary…' };
  $('.input').attr('placeholder', placeholders[appMode] || 'Search texts…');
  var searchLabels = { voices: 'Source Sheets' };
  $('.search-results-label').text(searchLabels[appMode] || 'Search results');
  var insertLabels = { voices: 'Add Sheet', lexicon: 'Add Entry' };
  $('#insert-source').text(insertLabels[appMode] || 'Add Source');
  var openLabels = { voices: 'Open Sheet' };
  $('.open-label-text').text(openLabels[appMode] || 'Open');
  if (changing) showSearchTab(appMode);

  if (!skipPreferenceSave && appMode !== 'experimental') {
    saveAccountPreference({ search_mode: appMode });
  }

  syncSessionOverrideButtons();
  updateModeDependentSections();
  syncExperimentalAvailability();
  updateQuickActionsForMode();
  setFooterButtonStates();
}

function updateModeDependentSections() {
  var hasSearch = !!(($('.input').val() || '').trim()) || getAllRawResults().length > 0;
  var hasSelectedTextResult = appMode === 'texts' && !!selectedResultKey;
  var hasSelectedVoiceResult = appMode === 'voices' && !!selectedVoiceItem;
  var hasSelectedLexiconResult = appMode === 'lexicon' && !!selectedLexiconItem;

  if (appMode === 'experimental') {
    $('.results-panel, .versions-section, .preview-section, .inline-session-settings').hide();
    $('.experimental-section').show();
    renderSessionLibrary();
    return;
  }

  $('.experimental-section').hide();
  $('.results-panel').toggle(hasSearch);
  updateVersionControlsVisibility();
  // Show source card when a text result is selected
  $('.preview-section').toggle(hasSelectedTextResult);
  $('.voices-preview-section').toggle(hasSelectedVoiceResult);
  // New redesign sections
  $('.source-card').toggle(hasSelectedTextResult);
  $('.unified-sidebar').toggleClass('has-selected-result', hasSelectedTextResult);
  if (typeof renderRecentSources === 'function') renderRecentSources();
  $('.inline-session-settings').toggle(hasSelectedTextResult);
  // Show Voices insert-mode selector only when a source sheet has been selected.
  $('.voices-insert-options').toggle(hasSelectedVoiceResult);
  // A word's entries, What to insert and the preview, while a word is selected.
  $('.lexicon-word-section').toggle(hasSelectedLexiconResult);
  renderSessionLibrary();

  // The Lexicon's recent searches, in the Lexicon.
  if (appMode === 'lexicon' && typeof renderLexiconHistory === 'function') renderLexiconHistory();
}


// A tab: its own results for the text in the box, or the offer to search
// them; never a search of its own. A search still running in the tab left
// fills that tab only, and its hint or count stays there (BUG-005).
$('.mode-switch-button, .experimental-menu-button').off('click').on('click', function () {
  setSidebarMode($(this).attr('data-sidebar-mode'));
});

$('.mode-switch-button').on('keydown', function (event) {
  var keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (!Object.prototype.hasOwnProperty.call(keys, event.key)) return;
  var buttons = $('.mode-switch-button:visible').get();
  var index = buttons.indexOf(this);
  if (index < 0) return;
  event.preventDefault();
  event.stopPropagation();
  var next = buttons[(index + keys[event.key] + buttons.length) % buttons.length];
  next.click();
  next.focus();
});

$('#open-session-library').off('click').on('click', function (event) {
  if (event) event.preventDefault();
  // openSessionLibraryModal() is defined in event-bindings.html which loads after
  // this file; call it if available, otherwise fall back to a direct render+show.
  if (typeof openSessionLibraryModal === 'function') {
    openSessionLibraryModal();
  } else {
    renderSessionLibrary();
    $('#session-library-modal').removeAttr('hidden');
  }
});

$('#close-session-library').on('click', function () {
  if (typeof closeSessionLibraryModal === 'function') {
    closeSessionLibraryModal();
  } else {
    $('#session-library-modal').attr('hidden', true);
  }
});

$('#open-session-library-experimental').on('click', function () {
  setSidebarMode('texts');
  $('#open-session-library').trigger('click');
});

$('.open-surprise-tool').off('click').on('click', function (event) {
  if (event) event.preventDefault();
  if (!isSurpriseEnabled()) {
    showSidebarNotice('Surprise Me is an experimental feature. Click OK to open Preferences and enable it.', function () {
      openPreferencesWithHint('experimental-features');
    });
    return;
  }
  google.script.run
    .withSuccessHandler(function () { showSidebarToast('Launching Surprise Me…'); })
    .withFailureHandler(function () { showSidebarNotice('Surprise Me is enabled, but its workflow is not yet wired in this build.'); })
    .surpriseMeHTML();
});

$('#open-preferences-experimental').off('click').on('click', function (event) {
  if (event) event.preventDefault();
  openPreferencesWithHint('experimental-features');
});

</script>
