<script>
function extractTextFromHtml_(html) {
  // Parse into an inert document rather than assigning to a detached div's
  // innerHTML. Scripts do not run either way, but a detached div DOES still
  // cause the browser to fetch any <img src> in the markup — so the old
  // "harmless scratch element" made a network request to whatever host the
  // text named, just to read its plain text.
  var doc = parseInertHtml(html);
  if (doc && doc.body) {
    return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
  }
  return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}

// A fetched text is a string or (nested) arrays of segments.
function flattenSegments_(value) {
  if (Array.isArray(value)) return value.map(flattenSegments_).join(' ');
  return value == null ? '' : String(value);
}

function renderPreviewTransliteration(sources) {
  if (!sources.length) return;
  // Capture this render's nodes. If a new layout, selection or loading state
  // replaces them, a late response can only update the detached nodes.
  var $targets = $('.preview-section .preview-transliteration');
  if (!$targets.length) return;
  var plain = sources.map(function (source) {
    // Read pointed Hebrew and omit source note markers and bodies, just as
    // insertion does. Keep blanks in the batch to preserve row coordinates.
    var html = processSourceText_(flattenSegments_(source), { commentaryProfile: 'none', notesMode: 'omit' }).html;
    return extractTextFromHtml_(html.replace(/<br\s*\/?>/gi, ' '));
  });
  if (!plain.some(Boolean)) return;
  google.script.run.withSuccessHandler(function (text) {
    if (!Array.isArray(text)) return;
    $targets.each(function (index) {
      $(this).text(text[index] || '');
    });
  }).previewTransliterationWithOverrides(plain, getSidebarTransliterationScheme(), typeof sidebarSessionId === 'undefined' ? null : sidebarSessionId);
}

function refreshSidebarLivePreview() {
  if (appMode !== 'texts' || !hasResolvedReference || !data || !data.ref || typeof updateSuggestion !== 'function') return;
  updateSuggestion(data, selectedResultSummary ? selectedResultSummary.label : data.ref);
}

</script>
