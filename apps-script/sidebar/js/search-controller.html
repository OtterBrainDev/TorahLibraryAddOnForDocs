<script>
function updateActionabilityUI(state) {
  var isActionable = !!(state && state.isInsertable);
  $('.display-layout-shell, .display-layout-section, .options-panel, .versions-section').toggleClass('section-muted', !isActionable);
  // Update source card status dot
  var dot = $('.source-card-status-dot');
  dot.removeClass('dot-ready dot-pending dot-error');
  if (isActionable) {
    dot.addClass('dot-ready');
    if (selectedResultSummary) selectedResultSummary.status = 'Ready to insert';
  } else if (state && state.isStructural) {
    dot.addClass('dot-error');
    if (selectedResultSummary) selectedResultSummary.status = 'Choose a more specific ref';
  } else {
    dot.addClass('dot-pending');
  }
  if (selectedResultSummary && typeof updateSourceCard === 'function') updateSourceCard();
}

function setResultsLoading(isLoading) {
  resultsLoading = !!isLoading;
  $('.results-panel').toggleClass('is-loading', resultsLoading);
  if (isLoading) {
    var skeletonHtml = "<li class='search-busy-row' role='status' aria-live='polite'>" +
      "<span class='search-busy-lens' aria-hidden='true'></span><span>Searching Sefaria…</span></li>";
    for (var i = 0; i < 4; i++) {
      skeletonHtml += "<li class='skeleton-result-item' aria-hidden='true'>" +
        "<div class='skeleton-bar skeleton-title'></div>" +
        "<div class='skeleton-bar skeleton-subtitle'></div>" +
        "<div class='skeleton-bar skeleton-meta'></div>" +
        "</li>";
    }
    // Static skeleton markup; nothing interpolated.
    $('.library-results').html(skeletonHtml);
    $('.search-results').empty();
  } else {
    $('.skeleton-result-item, .search-busy-row').remove();
  }
}







// Session library and results rendering extracted to sidebar_session_library and sidebar_results_render.

// The Texts tab's search (SEARCH_TABS.texts in search-tabs): a direct
// reference lookup, Sefaria's search and its title completions, merged into
// the run's results as each answers. The run may be for a tab that isn't
// shown (Enter in Voices searches Texts too), so it writes only to its own
// results and hint; searchRunChanged draws them if Texts is shown.
function searchTextsRun(run) {
  var qs = run.queryState;
  var input = run.query;
  var inputExpanded = expandShevaApostrophe(input);
  // Canonicalize traditional abbreviations before the title lookup: Sefaria's
  // autocompleter indexes "Hilchot Shabbat", never "Hil. Shabbat".
  // The title lookup is tried with the reader's own spelling first, and only
  // falls back to the voweled form. applyConsonantClusterVoweling turns
  // "Bshalach" into "Beshalach", which is the point — but it also turns
  // "Psalms" into "Pesalms" and "Stone Edition" into "Setone Edition", because
  // nothing distinguishes a transliterated sheva from an ordinary English onset
  // cluster by shape. Used as a FALLBACK it can only add matches; used as the
  // query it silently loses one of the most-searched titles in the library.
  var inputForNameApi = canonicalizeCitationAbbreviation(inputExpanded);
  var inputForNameApiFallback = applyConsonantClusterVoweling(inputForNameApi);
  var useNameApi = isLikelyTitleQuery(inputExpanded);

  if (!input) {
    searchRunChanged(run);
    if (isShownSearchRun(run)) {
      updateActionabilityUI({ isInsertable: false });
      $('.suggestions').html("<b>Please enter a reference, title, or phrase.</b>");
    }
    finishSearchRun(run);
    return;
  }

  var sefariaUrlInput = parseSefariaUrlInput(input);
  if (sefariaUrlInput) {
    qs.rawLibraryMatches = [{
      key: "library-ref-" + sefariaUrlInput.ref,
      ref: sefariaUrlInput.ref,
      label: sefariaUrlInput.ref,
      subtitle: 'Parsed from Sefaria URL',
      typeLabel: 'Library',
      hasTranslation: true,
      availableLangs: []
    }];
    qs.rawSearchResults = [];
    // The URL's display mode and versions apply when Texts shows it.
    run.afterSearch = function () {
      $('.output-mode-selection').val(sefariaUrlInput.outputMode);
      syncDisplayModeCards();
      updateBilingualLayoutVisibility();
      updateTranslationDetailsVisibility();
      updateVersionControlsVisibility();
      pendingPreferredVersions = sefariaUrlInput.preferredVersions;
      var parsed = queryState.libraryMatches[0];
      if (!parsed) return;
      selectedResultKey = parsed.key;
      selectedResultSummary = { label: sefariaUrlInput.ref, subtitle: 'Parsed from Sefaria URL' };
      resultsCollapsed = true;
      updateResultsVisibility();
      resolveSelectedResult(sefariaUrlInput.ref, sefariaUrlInput.ref);
    };
    searchRunChanged(run);
    finishSearchRun(run);
    return;
  }

  // Punctuation-blind: "The Torah A Women" lists "The Torah; A Women's ...".
  var prefixTitles = getLoosePrefixTitleMatches([inputExpanded, inputForNameApi], 6)
    .map(function (title, index) {
      return {
        key: "library-title-" + index + "-" + title,
        ref: title,
        label: title,
        subtitle: 'Title match',
        typeLabel: 'Library',
        hasTranslation: true,
        availableLangs: []
      };
    });

  // Rewrites the title to the catalogue's spelling ("The Torah, A Womens
  // Commentary, ..." → "The Torah; A Women's Commentary, ..."). The row shows
  // that canonical form, so the reader sees what will actually be inserted.
  var directLookupInput = normalizeLatinLookupTitleCase(inputExpanded);
  var directRefMatch = {
    key: "library-ref-" + directLookupInput,
    ref: directLookupInput,
    label: directLookupInput,
    subtitle: 'Direct reference lookup',
    typeLabel: 'Library',
    hasTranslation: true,
    availableLangs: []
  };

  var fuzzyMatches = buildFuzzyLibraryMatches(inputExpanded);
  function setLibraryMatches(matches) {
    qs.rawLibraryMatches = mergeLibraryMatchesWithFuzzy(matches, fuzzyMatches, 10);
  }

  var isHebrewScript = isLikelyHebrewScriptInput(input);
  setLibraryMatches(prefixTitles);
  qs.rawSearchResults = [];
  searchRunChanged(run);

  var pendingAsyncResultGroups = useNameApi ? 3 : 2;
  function finishResultGroup() {
    if (!isCurrentSearchRun(run)) return;
    pendingAsyncResultGroups = Math.max(0, pendingAsyncResultGroups - 1);
    if (pendingAsyncResultGroups === 0) finishSearchRun(run);
  }

  google.script.run.withSuccessHandler(function (response) {
    if (!isCurrentSearchRun(run)) return;
    var directRefState = getResolvedNodeState(response);
    if (directRefState.isStructural) {
      // A real ref with no text of its own (a book or section heading). Listing
      // it would offer a row that can only end in "Choose a more specific ref",
      // so leave it out — along with any title match for the same ref — and
      // say what to add instead.
      markResultRefNonInsertable(directLookupInput, run.postState);
      if (response && response.ref) markResultRefNonInsertable(response.ref, run.postState);
      setSearchRunHint(run, buildNonInsertableHint(directLookupInput, directRefState.prompt));
    } else if (directRefState.isInsertable) {
      var resolvedLangs = Array.isArray(response && response.availableLangs)
        ? response.availableLangs.map(function(l) { return String(l || '').toLowerCase(); }).filter(Boolean)
        : (Array.isArray(response && response.versions)
            ? response.versions.map(function(v) { return String((v && v.language) || '').toLowerCase(); }).filter(Boolean)
            : []);
      directRefMatch.availableLangs = resolvedLangs;
      directRefMatch.hasTranslation = resolvedLangs.length > 0;
      setLibraryMatches([directRefMatch].concat(qs.rawLibraryMatches));
      setSearchRunHint(run, '');
    } else if (isHebrewScript) {
      setSearchRunHint(run, 'No direct library match for this Hebrew ref. Check spelling and try again.');
    }
    searchRunChanged(run);
    finishResultGroup();
  }).withFailureHandler(function (error) {
    if (!isCurrentSearchRun(run)) return;
    // findReference throws only when Sefaria can't be reached; say that
    // rather than implying the reference doesn't exist.
    if (error && error.message) setSearchRunHint(run, error.message);
    else if (isHebrewScript) setSearchRunHint(run, 'No direct library match for this Hebrew ref. Check spelling and try again.');
    finishResultGroup();
  }).findReferenceForSidebar(directLookupInput, null, sidebarSessionId);

  var searchParameters = getSearchParameters();
  google.script.run.withSuccessHandler(function (response) {
    if (!isCurrentSearchRun(run)) return;
    var hits = (Array.isArray(response) ? response : (((response || {}).hits || {}).hits || [])).slice(0, 24);
    var libraryPathHits = [];
    var contentHits = [];
    hits.forEach(function (hit, index) {
      var source = (hit && hit._source) ? hit._source : {};
      var snippet = hit && hit.highlight && hit.highlight.naive_lemmatizer && hit.highlight.naive_lemmatizer[0] ? hit.highlight.naive_lemmatizer[0] : '';
      var pathDepth = Array.isArray(source.path) ? source.path.filter(Boolean).length : (typeof source.path === 'string' ? source.path.split('/').filter(Boolean).length : 0);
      if (pathDepth > 1) {
        libraryPathHits.push(buildResultFromSource(source, source.ref, 'library-search', index, snippet, 'Library path'));
        return;
      }
      contentHits.push(buildResultFromSource(source, source.ref, 'search', index, snippet, 'Content hit'));
    });
    var filteredLibraryPathHits = applyClientSideSearchFilters(libraryPathHits, searchParameters, 'texts').slice(0, 10);
    var filteredContentHits = applyClientSideSearchFilters(contentHits, searchParameters, 'texts').slice(0, 12);
    setLibraryMatches(qs.rawLibraryMatches.concat(filteredLibraryPathHits));
    qs.rawSearchResults = filteredContentHits;
    searchRunChanged(run);
    if (searchParameters.translationOnly && !qs.libraryMatches.length && !qs.searchResults.length) {
      setSearchRunHint(run, 'No results matched the selected translation language filter.');
    }
    finishResultGroup();
  }).withFailureHandler(function (error) {
    if (!isCurrentSearchRun(run)) return;
    qs.rawSearchResults = [];
    if (error && error.message) setSearchRunHint(run, error.message);
    searchRunChanged(run);
    finishResultGroup();
  }).findSearchAdvanced(inputExpanded, searchParameters);

  if (useNameApi) {
    requestNameCandidates(inputForNameApi, function (candidates) {
      if (candidates.length || inputForNameApiFallback === inputForNameApi) {
        applyNameCandidates(candidates);
        return;
      }
      // Nothing matched the reader's spelling; try the voweled form before
      // giving up. Two calls only in the miss case, one in the hit case.
      requestNameCandidates(inputForNameApiFallback, applyNameCandidates);
    });
  }

  function requestNameCandidates(query, done) {
    google.script.run
      .withSuccessHandler(function (candidates) {
        if (!isCurrentSearchRun(run)) return;
        done(Array.isArray(candidates) ? candidates : []);
      })
      .withFailureHandler(function () {
        if (!isCurrentSearchRun(run)) return;
        finishResultGroup();
      })
      .getNameCandidates(query);
  }

  function applyNameCandidates(candidates) {
    if (!isCurrentSearchRun(run)) return;
    var nameMatches = candidates
      .filter(function(c) { return nameCandidatePassesFullQueryGuard(c, inputExpanded); })
      .map(function(c, idx) {
        return {
          key: 'name-candidate-' + idx + '-' + c,
          ref: c,
          label: c,
          subtitle: 'Title match',
          typeLabel: 'Library',
          hasTranslation: true,
          availableLangs: []
        };
      });
    setLibraryMatches(nameMatches.concat(qs.rawLibraryMatches));
    searchRunChanged(run);
    finishResultGroup();
  }
}

function resolveSelectedResult(selectedRef, inputLabel) {
  if (appMode === 'voices') {
    var item = queryState.searchResults.concat(queryState.libraryMatches).find(function(result){ return result && result.ref === selectedRef; }) || null;
    selectedVoiceItem = item;
    selectedRefValue = selectedRef;
    hasResolvedReference = false;
    if (selectedResultSummary) {
      selectedResultSummary.status = item ? 'Ready to insert' : '';
      updateResultsVisibility();
    }
    setInsertButtonState(!!item);
    $('#open-on-sefaria').prop('disabled', !(item && item.url));
    if (item) {
      renderVoicesCard(item);
      var currentMode = $('#voices-insert-mode .icon-mode-card[aria-checked="true"]').data('value') || 'reference';
      $('.voices-insertion-summary').text('Will insert: ' + (VOICE_MODE_SUMMARY_LABELS[currentMode] || 'Citation only'));
    }
    updateModeDependentSections();
    return;
  }

  if (appMode === 'lexicon') {
    // A word: its entries are listed to pick from, and the picked ones
    // previewed (sidebar/js/lexicon).
    var lexItem = queryState.searchResults.concat(queryState.libraryMatches).find(function(result){ return result && result.ref === selectedRef; }) || null;
    selectedRefValue = selectedRef;
    hasResolvedReference = false;
    if (selectedResultSummary) {
      selectedResultSummary.status = lexItem ? 'Ready to insert' : '';
      updateResultsVisibility();
    }
    selectLexiconWord(lexItem);
    setInsertButtonState(!!lexItem);
    $('#open-on-sefaria').prop('disabled', true);
    updateModeDependentSections();
    return;
  }
  selectedRefValue = selectedRef;
  textsPreviewStale = false;
  var requestId = ++latestResolveRequestId;
  hasResolvedReference = false;
  setInsertButtonState(false);
  $('#open-on-sefaria').prop('disabled', true);
  updatePesukimAvailability(null);
  // buildPreviewLoadingHTML escapes its message.
  $('.suggestions').html(buildPreviewLoadingHTML('Loading preview…'));

  google.script.run.withSuccessHandler(function (response) {
    if (requestId !== latestResolveRequestId) return;
    // Another tab is shown: its preview and Add Source are not this one's.
    // Texts fetches it again when it is shown (search-tabs).
    if (appMode !== 'texts') { textsPreviewStale = true; return; }
    var nodeState = getResolvedNodeState(response);
    if (nodeState.isInsertable) {
      if (selectedResultSummary) {
        selectedResultSummary.status = 'Ready to insert';
        updateResultsVisibility();
      }
      updateSuggestion(response, inputLabel);
      updatePesukimAvailability(response);
      updateActionabilityUI(nodeState);
      data = response;
      hasResolvedReference = true;
      setInsertButtonState(true);
      $('#open-on-sefaria').prop('disabled', false);
      return;
    }

    hasResolvedReference = false;
    setInsertButtonState(false);
    $('#open-on-sefaria').prop('disabled', true);
    if (selectedResultSummary) {
      selectedResultSummary.status = 'Choose a more specific ref';
      updateResultsVisibility();
    }
    clearVersionSelectors();
    updatePesukimAvailability(null);
    updateActionabilityUI(nodeState);
    // buildNonInsertableMessage escapes the ref (buildPreviewMeta) and the prompt.
    $('.suggestions').html("<br>" + buildNonInsertableMessage(response, true));
    scheduleReturnToResults(requestId, selectedRef, inputLabel, nodeState.prompt);
  }).withFailureHandler(function (error) {
    if (requestId !== latestResolveRequestId) return;
    if (appMode !== 'texts') { textsPreviewStale = true; return; }
    hasResolvedReference = false;
    setInsertButtonState(false);
    $('#open-on-sefaria').prop('disabled', true);
    clearVersionSelectors();
    updatePesukimAvailability(null);
    updateActionabilityUI({ isInsertable: false });
    // Static markup; the only interpolated value is the server's error
    // message, escaped with escapeHTML.
    $('.suggestions').html("<br><b>" + escapeHTML((error && error.message) || 'Enter a valid reference to insert.') + "</b>");
  }).findReferenceForSidebar(selectedRef, null, sidebarSessionId);
}

// How long the "not directly insertable" notice stays up before the sidebar
// goes back to the result list by itself.
var NON_INSERTABLE_RETURN_DELAY_MS = 2500;

function buildNonInsertableHint(label, prompt) {
  return '\u201c' + String(label || '').trim() + '\u201d is a whole book or section, so it can\u2019t be inserted on its own. ' +
    String(prompt || '').trim();
}

function scheduleReturnToResults(requestId, ref, label, prompt) {
  setTimeout(function () {
    // The reader has already moved on (another result, a new search, another
    // tab): leave their new state alone.
    if (requestId !== latestResolveRequestId || selectedRefValue !== ref || appMode !== 'texts') return;
    returnToResultsFromDeadEnd(ref, label, prompt);
  }, NON_INSERTABLE_RETURN_DELAY_MS);
}

// Undo the selection of a result that turned out to have no text of its own:
// drop it from the list, select nothing, reopen the results, and put the
// cursor back in the search box so the reader can add a chapter or verse.
function returnToResultsFromDeadEnd(ref, label, prompt) {
  markResultRefNonInsertable(ref);
  resetSelectedResultView();
  reprocessAndRenderResults();
  setResultsHint(buildNonInsertableHint(label || ref, prompt));
  var $input = $('.input');
  $input.trigger('focus');
  var inputEl = $input.get(0);
  if (inputEl && typeof inputEl.setSelectionRange === 'function') {
    var end = String($input.val() || '').length;
    inputEl.setSelectionRange(end, end);
  }
}

function refreshSelectedResult() {
  if (appMode === 'voices' || appMode === 'lexicon') {
    updateModeDependentSections();
    return;
  }
  if (!selectedRefValue) return;
  var fallbackLabel = selectedResultSummary && selectedResultSummary.label ? selectedResultSummary.label : selectedRefValue;
  resolveSelectedResult(selectedRefValue, fallbackLabel);
}

// The Voices tab's own code is in sidebar/js/voices, the Lexicon's in
// sidebar/js/lexicon, the workflow they share in sidebar/js/search-tabs.


/* Tab badges: syncSearchTabBadges in sidebar/js/search-tabs. */

/* ── RTL input detection for the search box ─────────────────────────────────── */

var HEBREW_RANGE_RE = /[֐-׿יִ-ﭏ]/;

$(document).on('input', '.input', function () {
  var val = $(this).val() || '';
  $(this).attr('dir', HEBREW_RANGE_RE.test(val) ? 'rtl' : 'ltr');
});

</script>
