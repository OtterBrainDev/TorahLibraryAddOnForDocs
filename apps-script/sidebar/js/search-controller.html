<script>
function updateActionabilityUI(state) {
  var isActionable = !!(state && state.isInsertable);
  $('.display-layout-shell, .display-layout-section, .options-panel, .versions-section').toggleClass('section-muted', !isActionable);
  // Update source card status dot
  var dot = $('.source-card-status-dot');
  dot.removeClass('dot-ready dot-pending dot-error');
  if (isActionable) {
    dot.addClass('dot-ready');
    if (selectedResultSummary) selectedResultSummary.status = 'Ready to insert';
  } else if (state && state.isStructural) {
    dot.addClass('dot-error');
    if (selectedResultSummary) selectedResultSummary.status = 'Choose a more specific ref';
  } else {
    dot.addClass('dot-pending');
  }
  if (selectedResultSummary && typeof updateSourceCard === 'function') updateSourceCard();
}

function setResultsLoading(isLoading) {
  resultsLoading = !!isLoading;
  $('.results-panel').toggleClass('is-loading', resultsLoading);
  if (isLoading) {
    var skeletonHtml = "<li class='search-busy-row' role='status' aria-live='polite'>" +
      "<span class='search-busy-lens' aria-hidden='true'></span><span>Searching Sefaria…</span></li>";
    for (var i = 0; i < 4; i++) {
      skeletonHtml += "<li class='skeleton-result-item' aria-hidden='true'>" +
        "<div class='skeleton-bar skeleton-title'></div>" +
        "<div class='skeleton-bar skeleton-subtitle'></div>" +
        "<div class='skeleton-bar skeleton-meta'></div>" +
        "</li>";
    }
    // Static skeleton markup; nothing interpolated.
    $('.library-results').html(skeletonHtml);
    $('.search-results').empty();
  } else {
    $('.skeleton-result-item, .search-busy-row').remove();
  }
}







// Session library and results rendering extracted to sidebar_session_library and sidebar_results_render.

function runUnifiedQuery(options) {
  // Also bound directly as a click handler, so `options` may be a jQuery event.
  var fromTyping = !!(options && options.fromTyping === true);
  if (appMode === 'voices') return runVoicesQuery(fromTyping);
  if (appMode === 'lexicon') return runLexiconQuery(fromTyping);
  updateModeDependentSections();
  var input = normalizeUnifiedReferenceInput(($('.input').val() || '').trim());
  // Write the tidied query back only on an explicit search (Enter, the search
  // button, a history or suggestion click). Doing it from the as-you-type
  // debounce fought the reader for the field: a pause after "Deuteronomy "
  // trimmed the space they had just typed, and any rewrite moved the caret to
  // the end mid-edit.
  if (!fromTyping) $('.input').val(input);
  var inputExpanded = expandShevaApostrophe(input);
  // Canonicalize traditional abbreviations before the title lookup: Sefaria's
  // autocompleter indexes "Hilchot Shabbat", never "Hil. Shabbat".
  // The title lookup is tried with the reader's own spelling first, and only
  // falls back to the voweled form. applyConsonantClusterVoweling turns
  // "Bshalach" into "Beshalach", which is the point — but it also turns
  // "Psalms" into "Pesalms" and "Stone Edition" into "Setone Edition", because
  // nothing distinguishes a transliterated sheva from an ordinary English onset
  // cluster by shape. Used as a FALLBACK it can only add matches; used as the
  // query it silently loses one of the most-searched titles in the library.
  var inputForNameApi = canonicalizeCitationAbbreviation(inputExpanded);
  var inputForNameApiFallback = applyConsonantClusterVoweling(inputForNameApi);
  var useNameApi = isLikelyTitleQuery(inputExpanded);
  clearSelectedResult();
  setResultsHint('');
  setResultsLoading(true);
  pendingPreferredVersions = null;

  if (!input) {
    queryState = { rawLibraryMatches: [], rawSearchResults: [], libraryMatches: [], searchResults: [] };
    resetResultPostProcessState();
    reprocessAndRenderResults();
    updateActionabilityUI({ isInsertable: false });
    $('.suggestions').html("<b>Please enter a reference, title, or phrase.</b>");
    setResultsLoading(false);
    updateTextsTabBadge(0);
    return;
  }

  var sefariaUrlInput = parseSefariaUrlInput(input);
  if (sefariaUrlInput) {
    $('.output-mode-selection').val(sefariaUrlInput.outputMode);
    syncDisplayModeCards();
    updateBilingualLayoutVisibility();
    updateTranslationDetailsVisibility();
    updateVersionControlsVisibility();

    pendingPreferredVersions = sefariaUrlInput.preferredVersions;
    resetResultPostProcessState();
    queryState.rawLibraryMatches = [{
      key: "library-ref-" + sefariaUrlInput.ref,
      ref: sefariaUrlInput.ref,
      label: sefariaUrlInput.ref,
      subtitle: 'Parsed from Sefaria URL',
      typeLabel: 'Library',
      hasTranslation: true,
      availableLangs: []
    }];
    queryState.rawSearchResults = [];
    reprocessAndRenderResults();

    selectedResultKey = queryState.libraryMatches[0].key;
    selectedResultSummary = { label: sefariaUrlInput.ref, subtitle: 'Parsed from Sefaria URL' };
    resultsCollapsed = true;
    updateResultsVisibility();
    setResultsLoading(false);
    resolveSelectedResult(sefariaUrlInput.ref, sefariaUrlInput.ref);
    return;
  }

  // Punctuation-blind: "The Torah A Women" lists "The Torah; A Women's ...".
  var prefixTitles = getLoosePrefixTitleMatches([inputExpanded, inputForNameApi], 6)
    .map(function (title, index) {
      return {
        key: "library-title-" + index + "-" + title,
        ref: title,
        label: title,
        subtitle: 'Title match',
        typeLabel: 'Library',
        hasTranslation: true,
        availableLangs: []
      };
    });

  // Rewrites the title to the catalogue's spelling ("The Torah, A Womens
  // Commentary, ..." → "The Torah; A Women's Commentary, ..."). The row shows
  // that canonical form, so the reader sees what will actually be inserted.
  var directLookupInput = normalizeLatinLookupTitleCase(inputExpanded);
  var directRefMatch = {
    key: "library-ref-" + directLookupInput,
    ref: directLookupInput,
    label: directLookupInput,
    subtitle: 'Direct reference lookup',
    typeLabel: 'Library',
    hasTranslation: true,
    availableLangs: []
  };

  var fuzzyMatches = buildFuzzyLibraryMatches(inputExpanded);
  function setLibraryMatches(matches) {
    queryState.rawLibraryMatches = mergeLibraryMatchesWithFuzzy(matches, fuzzyMatches, 10);
  }

  var isHebrewScript = isLikelyHebrewScriptInput(input);
  resetResultPostProcessState();
  setLibraryMatches(prefixTitles);
  queryState.rawSearchResults = [];
  reprocessAndRenderResults();

  var requestId = ++latestQueryRequestId;
  var validationRequestId = ++latestDirectRefValidationRequestId;
  var pendingAsyncResultGroups = useNameApi ? 3 : 2;
  function finishResultGroup() {
    if (requestId !== latestQueryRequestId) return;
    pendingAsyncResultGroups = Math.max(0, pendingAsyncResultGroups - 1);
    if (pendingAsyncResultGroups === 0) {
      setResultsLoading(false);
      maybeShowZeroResultsSuggestions(input);
      maybeAutoSelectSingleResult();
      updateTextsTabBadge(getAllProcessedResults().length);
    }
  }

  google.script.run.withSuccessHandler(function (response) {
    if (validationRequestId !== latestDirectRefValidationRequestId || requestId !== latestQueryRequestId) return;
    var directRefState = getResolvedNodeState(response);
    if (directRefState.isStructural) {
      // A real ref with no text of its own (a book or section heading). Listing
      // it would offer a row that can only end in "Choose a more specific ref",
      // so leave it out — along with any title match for the same ref — and
      // say what to add instead.
      markResultRefNonInsertable(directLookupInput);
      if (response && response.ref) markResultRefNonInsertable(response.ref);
      setResultsHint(buildNonInsertableHint(directLookupInput, directRefState.prompt));
    } else if (directRefState.isInsertable) {
      var resolvedLangs = Array.isArray(response && response.availableLangs)
        ? response.availableLangs.map(function(l) { return String(l || '').toLowerCase(); }).filter(Boolean)
        : (Array.isArray(response && response.versions)
            ? response.versions.map(function(v) { return String((v && v.language) || '').toLowerCase(); }).filter(Boolean)
            : []);
      directRefMatch.availableLangs = resolvedLangs;
      directRefMatch.hasTranslation = resolvedLangs.length > 0;
      setLibraryMatches([directRefMatch].concat(queryState.rawLibraryMatches));
      setResultsHint('');
    } else if (isHebrewScript) {
      setResultsHint('No direct library match for this Hebrew ref. Check spelling and try again.');
    }
    reprocessAndRenderResults();
    finishResultGroup();
  }).withFailureHandler(function (error) {
    if (validationRequestId !== latestDirectRefValidationRequestId || requestId !== latestQueryRequestId) return;
    // findReference throws only when Sefaria can't be reached; say that
    // rather than implying the reference doesn't exist.
    if (error && error.message) setResultsHint(error.message);
    else if (isHebrewScript) setResultsHint('No direct library match for this Hebrew ref. Check spelling and try again.');
    finishResultGroup();
  }).findReferenceForSidebar(directLookupInput, null, sidebarSessionId);

  var searchParameters = getSearchParameters();
  google.script.run.withSuccessHandler(function (response) {
    if (requestId !== latestQueryRequestId) return;
    var hits = (Array.isArray(response) ? response : (((response || {}).hits || {}).hits || [])).slice(0, 24);
    var libraryPathHits = [];
    var contentHits = [];
    hits.forEach(function (hit, index) {
      var source = (hit && hit._source) ? hit._source : {};
      var snippet = hit && hit.highlight && hit.highlight.naive_lemmatizer && hit.highlight.naive_lemmatizer[0] ? hit.highlight.naive_lemmatizer[0] : '';
      var pathDepth = Array.isArray(source.path) ? source.path.filter(Boolean).length : (typeof source.path === 'string' ? source.path.split('/').filter(Boolean).length : 0);
      if (pathDepth > 1) {
        libraryPathHits.push(buildResultFromSource(source, source.ref, 'library-search', index, snippet, 'Library path'));
        return;
      }
      contentHits.push(buildResultFromSource(source, source.ref, 'search', index, snippet, 'Content hit'));
    });
    var filteredLibraryPathHits = applyClientSideSearchFilters(libraryPathHits, searchParameters).slice(0, 10);
    var filteredContentHits = applyClientSideSearchFilters(contentHits, searchParameters).slice(0, 12);
    setLibraryMatches(queryState.rawLibraryMatches.concat(filteredLibraryPathHits));
    queryState.rawSearchResults = filteredContentHits;
    if (searchParameters.translationOnly && !queryState.libraryMatches.length && !queryState.searchResults.length) {
      setResultsHint('No results matched the selected translation language filter.');
    }
    reprocessAndRenderResults();
    finishResultGroup();
  }).withFailureHandler(function (error) {
    if (requestId !== latestQueryRequestId) return;
    queryState.rawSearchResults = [];
    if (error && error.message) setResultsHint(error.message);
    reprocessAndRenderResults();
    finishResultGroup();
  }).findSearchAdvanced(inputExpanded, searchParameters);

  if (useNameApi) {
    requestNameCandidates(inputForNameApi, function (candidates) {
      if (candidates.length || inputForNameApiFallback === inputForNameApi) {
        applyNameCandidates(candidates);
        return;
      }
      // Nothing matched the reader's spelling; try the voweled form before
      // giving up. Two calls only in the miss case, one in the hit case.
      requestNameCandidates(inputForNameApiFallback, applyNameCandidates);
    });
  }

  function requestNameCandidates(query, done) {
    google.script.run
      .withSuccessHandler(function (candidates) {
        if (requestId !== latestQueryRequestId) return;
        done(Array.isArray(candidates) ? candidates : []);
      })
      .withFailureHandler(function () {
        if (requestId !== latestQueryRequestId) return;
        finishResultGroup();
      })
      .getNameCandidates(query);
  }

  function applyNameCandidates(candidates) {
    if (requestId !== latestQueryRequestId) return;
    var nameMatches = candidates
      .filter(function(c) { return nameCandidatePassesFullQueryGuard(c, inputExpanded); })
      .map(function(c, idx) {
        return {
          key: 'name-candidate-' + idx + '-' + c,
          ref: c,
          label: c,
          subtitle: 'Title match',
          typeLabel: 'Library',
          hasTranslation: true,
          availableLangs: []
        };
      });
    setLibraryMatches(nameMatches.concat(queryState.rawLibraryMatches));
    reprocessAndRenderResults();
    finishResultGroup();
  }
}

function resolveSelectedResult(selectedRef, inputLabel) {
  if (appMode === 'voices') {
    var item = queryState.searchResults.concat(queryState.libraryMatches).find(function(result){ return result && result.ref === selectedRef; }) || null;
    selectedVoiceItem = item;
    selectedRefValue = selectedRef;
    hasResolvedReference = false;
    if (selectedResultSummary) {
      selectedResultSummary.status = item ? 'Ready to insert' : '';
      updateResultsVisibility();
    }
    setInsertButtonState(!!item);
    $('#open-on-sefaria').prop('disabled', !(item && item.url));
    if (item) {
      renderVoicesCard(item);
      var currentMode = $('#voices-insert-mode .icon-mode-card[aria-checked="true"]').data('value') || 'reference';
      $('.voices-insertion-summary').text('Will insert: ' + (VOICE_MODE_SUMMARY_LABELS[currentMode] || 'Citation only'));
    }
    updateModeDependentSections();
    return;
  }

  if (appMode === 'lexicon') {
    // A word: its entries are listed to pick from, and the picked ones
    // previewed (sidebar/js/lexicon).
    var lexItem = queryState.searchResults.concat(queryState.libraryMatches).find(function(result){ return result && result.ref === selectedRef; }) || null;
    selectedRefValue = selectedRef;
    hasResolvedReference = false;
    if (selectedResultSummary) {
      selectedResultSummary.status = lexItem ? 'Ready to insert' : '';
      updateResultsVisibility();
    }
    selectLexiconWord(lexItem);
    setInsertButtonState(!!lexItem);
    $('#open-on-sefaria').prop('disabled', true);
    updateModeDependentSections();
    return;
  }
  selectedVoiceItem = null;
  selectedRefValue = selectedRef;
  var requestId = ++latestResolveRequestId;
  hasResolvedReference = false;
  setInsertButtonState(false);
  $('#open-on-sefaria').prop('disabled', true);
  updatePesukimAvailability(null);
  // buildPreviewLoadingHTML escapes its message.
  $('.suggestions').html(buildPreviewLoadingHTML('Loading preview…'));

  google.script.run.withSuccessHandler(function (response) {
    if (requestId !== latestResolveRequestId) return;
    var nodeState = getResolvedNodeState(response);
    if (nodeState.isInsertable) {
      if (selectedResultSummary) {
        selectedResultSummary.status = 'Ready to insert';
        updateResultsVisibility();
      }
      updateSuggestion(response, inputLabel);
      updatePesukimAvailability(response);
      updateActionabilityUI(nodeState);
      data = response;
      hasResolvedReference = true;
      setInsertButtonState(true);
      $('#open-on-sefaria').prop('disabled', false);
      return;
    }

    hasResolvedReference = false;
    setInsertButtonState(false);
    $('#open-on-sefaria').prop('disabled', true);
    if (selectedResultSummary) {
      selectedResultSummary.status = 'Choose a more specific ref';
      updateResultsVisibility();
    }
    clearVersionSelectors();
    updatePesukimAvailability(null);
    updateActionabilityUI(nodeState);
    // buildNonInsertableMessage escapes the ref (buildPreviewMeta) and the prompt.
    $('.suggestions').html("<br>" + buildNonInsertableMessage(response, true));
    scheduleReturnToResults(requestId, selectedRef, inputLabel, nodeState.prompt);
  }).withFailureHandler(function (error) {
    if (requestId !== latestResolveRequestId) return;
    hasResolvedReference = false;
    setInsertButtonState(false);
    $('#open-on-sefaria').prop('disabled', true);
    clearVersionSelectors();
    updatePesukimAvailability(null);
    updateActionabilityUI({ isInsertable: false });
    // Static markup; the only interpolated value is the server's error
    // message, escaped with escapeHTML.
    $('.suggestions').html("<br><b>" + escapeHTML((error && error.message) || 'Enter a valid reference to insert.') + "</b>");
  }).findReferenceForSidebar(selectedRef, null, sidebarSessionId);
}

// How long the "not directly insertable" notice stays up before the sidebar
// goes back to the result list by itself.
var NON_INSERTABLE_RETURN_DELAY_MS = 2500;

function buildNonInsertableHint(label, prompt) {
  return '\u201c' + String(label || '').trim() + '\u201d is a whole book or section, so it can\u2019t be inserted on its own. ' +
    String(prompt || '').trim();
}

function scheduleReturnToResults(requestId, ref, label, prompt) {
  setTimeout(function () {
    // The reader has already moved on (another result, a new search, another
    // tab): leave their new state alone.
    if (requestId !== latestResolveRequestId || selectedRefValue !== ref || appMode !== 'texts') return;
    returnToResultsFromDeadEnd(ref, label, prompt);
  }, NON_INSERTABLE_RETURN_DELAY_MS);
}

// Undo the selection of a result that turned out to have no text of its own:
// drop it from the list, select nothing, reopen the results, and put the
// cursor back in the search box so the reader can add a chapter or verse.
function returnToResultsFromDeadEnd(ref, label, prompt) {
  markResultRefNonInsertable(ref);
  resetSelectedResultView();
  reprocessAndRenderResults();
  setResultsHint(buildNonInsertableHint(label || ref, prompt));
  var $input = $('.input');
  $input.trigger('focus');
  var inputEl = $input.get(0);
  if (inputEl && typeof inputEl.setSelectionRange === 'function') {
    var end = String($input.val() || '').length;
    inputEl.setSelectionRange(end, end);
  }
}

function refreshSelectedResult() {
  if (appMode === 'voices' || appMode === 'lexicon') {
    updateModeDependentSections();
    return;
  }
  if (!selectedRefValue) return;
  var fallbackLabel = selectedResultSummary && selectedResultSummary.label ? selectedResultSummary.label : selectedRefValue;
  resolveSelectedResult(selectedRefValue, fallbackLabel);
}

var VOICE_TOPIC_ACCENT_MAP = [
  { accent: 'tanakh',     keys: ['tanakh','torah','parsha','parshat','genesis','bereishit','exodus','leviticus','numbers','deuteronomy','prophets','writings','nevi','ketuvim','pentateuch'] },
  { accent: 'talmud',     keys: ['talmud','gemara','tractate','masekhet','bavli','yerushalmi','daf'] },
  { accent: 'mishnah',    keys: ['mishnah','mishneh','mishna'] },
  { accent: 'midrash',    keys: ['midrash','aggadah','aggada','midrashic'] },
  { accent: 'halakhah',   keys: ['halakha','halakhah','halacha','law','responsa','shulchan','aruch'] },
  { accent: 'kabbalah',   keys: ['kabbalah','zohar','mysticism','kabbalistic','sod'] },
  { accent: 'liturgy',    keys: ['liturgy','prayer','siddur','machzor','piyyut','tefillah'] },
  { accent: 'philosophy', keys: ['philosophy','rambam','maimonides','medieval','reason'] },
  { accent: 'chasidut',   keys: ['chasidut','hasidut','hasidism','chasidism','rebbe'] },
  { accent: 'musar',      keys: ['musar','ethics','mussar','character'] },
  { accent: 'commentary', keys: ['commentary','rashi','ramban','nachmanides','interpretation'] }
];

function getVoiceCardTopicAccent(topics) {
  if (!Array.isArray(topics) || !topics.length) return '';
  var joined = topics.join(' ').toLowerCase();
  for (var i = 0; i < VOICE_TOPIC_ACCENT_MAP.length; i++) {
    var entry = VOICE_TOPIC_ACCENT_MAP[i];
    for (var j = 0; j < entry.keys.length; j++) {
      if (joined.indexOf(entry.keys[j]) !== -1) return entry.accent;
    }
  }
  return '';
}

/**
 * Build the preview card HTML for a selected Voices / source sheet result.
 * The insertion mode summary is a separate persistent DOM element (.voices-insertion-summary)
 * and is NOT rendered here — it is updated in place by the insert mode click handler.
 */
function buildVoicesPreviewHtml(item) {
  if (!item) return '';

  var title   = escapeHTML(item.label || item.ref || 'Untitled sheet');
  var owner   = item.owner ? escapeHTML('By ' + item.owner) : '';
  var snippet = escapeHTML(normalizeOptionText(item.snippet || item.summary || ''));
  var accent  = getVoiceCardTopicAccent(item.topics);
  var accentAttr = accent ? " data-accent='" + accent + "'" : '';

  var openBtn = item.url
    ? "<a class='voice-preview-open-btn' href='" + escapeHTML(item.url) + "' target='_blank' rel='noopener' aria-label='Open " + title + " on Sefaria'><span class='open-sefaria-icon' aria-hidden='true'></span></a>"
    : '';
  var copyBtn = "<button type='button' class='voice-preview-copy-btn' aria-label='Copy citation to clipboard'>📋</button>";

  var html = "<div class='voice-preview voice-preview-card'" + accentAttr + " role='region' aria-label='Selected sheet preview'>";
  html += "<div class='voice-preview-header'>";
  html += "<div class='voice-preview-title'>" + title + "</div>";
  html += "<div class='voice-preview-header-actions'>" + copyBtn + (openBtn || '') + "</div>";
  html += "</div>";
  if (owner) html += "<div class='voice-preview-byline preview-meta'>" + owner + "</div>";

  if (snippet) {
    html += "<hr class='voice-preview-divider'>";
    html += "<div class='voice-preview-excerpt' dir='auto'>" + snippet + "</div>";
    html += "<button type='button' class='voice-preview-excerpt-toggle' aria-expanded='false'>See more ▾</button>";
  }

  if (Array.isArray(item.topics) && item.topics.length) {
    html += "<hr class='voice-preview-divider'>";
    html += "<div class='voice-preview-topics'>";
    item.topics.slice(0, 5).forEach(function(t) {
      html += "<span class='voice-preview-tag'>" + escapeHTML(t) + "</span>";
    });
    html += "</div>";
  }
  html += "</div>";
  return html;
}

function renderVoicesCard(item) {
  if (!item) return;
  var $target = appMode === 'voices' ? $('.voices-suggestions') : $('.suggestions');
  $target.html(buildVoicesPreviewHtml(item));
  // Show excerpt toggle if text is clamped
  setTimeout(function() {
    var el = document.querySelector('.voice-preview-excerpt');
    if (el && el.scrollHeight > el.offsetHeight) {
      var toggle = document.querySelector('.voice-preview-excerpt-toggle');
      if (toggle) toggle.style.display = 'block';
    }
  }, 0);
  // Sync nav button states
  updateVoiceNavButtons();
}

function runVoicesQuery(fromTyping) {
  // An answer to an earlier query (or another mode's) is dropped, as in Texts.
  var requestId = ++latestQueryRequestId;
  var input = normalizeUnifiedReferenceInput(($('.input').val() || '').trim());
  if (fromTyping !== true) $('.input').val(input);
  clearSelectedResult();
  selectedVoiceItem = null;
  setResultsHint('');
  updateModeDependentSections();
  if (!input) {
    queryState = { rawLibraryMatches: [], rawSearchResults: [], libraryMatches: [], searchResults: [] };
    reprocessAndRenderResults();
    setInsertButtonState(false);
    $('#open-on-sefaria').prop('disabled', true);
    updateVoicesTabBadge(0);
    return;
  }
  setResultsLoading(true);
  google.script.run.withSuccessHandler(function(response) {
    if (requestId !== latestQueryRequestId) return;
    var items = Array.isArray(response) ? response : [];
    queryState.rawLibraryMatches = [];
    queryState.rawSearchResults = items;
    reprocessAndRenderResults();
    if (!items.length) setResultsHint('No source sheets matched this search.');
    updateModeDependentSections();
    setResultsLoading(false);
    updateVoicesTabBadge(items.length);
  }).withFailureHandler(function(error) {
    if (requestId !== latestQueryRequestId) return;
    queryState.rawLibraryMatches = [];
    queryState.rawSearchResults = [];
    reprocessAndRenderResults();
    setResultsHint((error && error.message) || 'Voices search is temporarily unavailable.');
    setResultsLoading(false);
    updateVoicesTabBadge(0);
  }).searchVoices(input, {});
}

// Insert mode card: update summary line only; do not re-render the card.
var VOICE_MODE_SUMMARY_LABELS = { reference: 'Citation only', contents: 'Full text', both: 'Citation + text' };
$(document).on('click', '#voices-insert-mode .icon-mode-card', function () {
  var $group = $(this).closest('[role="radiogroup"]');
  $group.find('.icon-mode-card').removeClass('is-active').attr('aria-checked', 'false');
  $(this).addClass('is-active').attr('aria-checked', 'true');
  syncVoicesTransliterationUi(selectedVoicesTransliteration());
});

function selectedVoicesTransliteration() {
  return $('#voices-translit-menu .voices-translit-option.is-selected').attr('data-value') || 'none';
}

/**
 * Draw the Voices transliteration choice: the menu's selection, the button,
 * a sample in the form the insert uses (the Hebrew, then its transliteration
 * in parentheses: server/sheets.gs), and the "Will insert" line. A citation
 * alone has no Hebrew to transliterate, so the line says when it applies.
 */
function syncVoicesTransliterationUi(value) {
  var scheme = value && value !== 'none' ? value : 'none';
  var $options = $('#voices-translit-menu .voices-translit-option');
  $options.each(function () {
    var selected = $(this).attr('data-value') === scheme;
    $(this).toggleClass('is-selected', selected).attr('aria-selected', selected ? 'true' : 'false');
  });
  var label = $options.filter('[data-value="' + scheme + '"]').text() || 'None';
  $('#voices-translit-trigger').text(label + ' \u25BE').toggleClass('is-none', scheme === 'none');

  // The card's samples (shared/composition-card/shared, loaded after this file).
  var samples = typeof CC_TRANSLIT_LABELS === 'object' ? CC_TRANSLIT_LABELS : {};
  var sample = scheme === 'none' ? '' : (samples[scheme] || samples.simple_english || label);
  $('#voices-translit-sample-latin').text(sample ? '(' + sample + ')' : '');
  $('#voices-translit-sample').prop('hidden', !sample);

  var mode = $('#voices-insert-mode .icon-mode-card[aria-checked="true"]').data('value') || 'reference';
  var summary = 'Will insert: ' + (VOICE_MODE_SUMMARY_LABELS[mode] || 'Citation only');
  if (sample) {
    summary += mode === 'reference'
      ? '. Transliteration (' + label + ') applies to the sheet\u2019s text: choose Text or Both.'
      : ', each Hebrew passage followed by its transliteration (' + label + ') in parentheses.';
  }
  $('.voices-insertion-summary').text(summary);
}

// Transliteration dropdown: open/close trigger.
$(document).on('click', '#voices-translit-trigger', function (e) {
  e.stopPropagation();
  var $menu = $('#voices-translit-menu');
  var opening = $menu.hasClass('hidden');
  $menu.toggleClass('hidden', !opening);
  $(this).attr('aria-expanded', opening ? 'true' : 'false');
});

// Transliteration dropdown: an option chosen. It is the Voices default
// (voices_translit_default), so it is saved; the sample and the summary show
// the choice at once. Saved without redrawing the sidebar from the answer
// (saveAccountPreference does): that put "What to insert" back to its saved
// default, so Both turned into Citation as a transliteration was chosen.
$(document).on('click', '#voices-translit-menu .voices-translit-option', function () {
  var value = $(this).attr('data-value') || 'none';
  syncVoicesTransliterationUi(value);
  $('#voices-translit-menu').addClass('hidden');
  $('#voices-translit-trigger').attr('aria-expanded', 'false').trigger('focus');
  accountPreferences.voices_translit_default = value;
  effectivePreferences.voices_translit_default = value;
  google.script.run
    .withFailureHandler(function () {
      showSidebarToast('Your transliteration choice could not be saved; it applies to this insert only.');
    })
    .setAccountPreferences({ voices_translit_default: value });
});

// Dismiss voices translit menu when clicking outside the wrap.
$(document).on('click.voicesTranslitDismiss', function (e) {
  if ($(e.target).closest('#voices-translit-trigger, #voices-translit-menu').length) return;
  $('#voices-translit-menu').addClass('hidden');
  $('#voices-translit-trigger').attr('aria-expanded', 'false');
});

// Excerpt expand/collapse toggle.
$(document).on('click', '.voice-preview-excerpt-toggle', function () {
  var $btn = $(this);
  var expanded = $btn.attr('aria-expanded') === 'true';
  $btn.attr('aria-expanded', String(!expanded));
  $btn.text(expanded ? 'See more ▾' : 'See less ▴');
  $btn.prev('.voice-preview-excerpt').toggleClass('voice-preview-excerpt--expanded', !expanded);
});

// Copy citation to clipboard (Enhancement 9.5).
$(document).on('click', '.voice-preview-copy-btn', function () {
  if (!selectedVoiceItem) return;
  var title = selectedVoiceItem.label || selectedVoiceItem.ref || '';
  var url   = selectedVoiceItem.url || '';
  var text  = title + (url ? ' — ' + url : '');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function () { if (typeof showSidebarToast === 'function') showSidebarToast('Citation copied to clipboard.'); })
      .catch(function () { if (typeof showSidebarToast === 'function') showSidebarToast('Could not copy to clipboard.'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (typeof showSidebarToast === 'function') showSidebarToast('Citation copied to clipboard.');
  }
});

// Prev/next result navigation (Enhancement 9.2).
function updateVoiceNavButtons() {
  if (!selectedVoiceItem) { $('.voice-nav-btn').prop('disabled', true); return; }
  var all = (typeof getAllProcessedResults === 'function') ? getAllProcessedResults() : [];
  var idx = -1;
  for (var i = 0; i < all.length; i++) { if (all[i].ref === selectedVoiceItem.ref) { idx = i; break; } }
  $('.voice-nav-prev').prop('disabled', idx <= 0);
  $('.voice-nav-next').prop('disabled', idx < 0 || idx >= all.length - 1);
}

function navigateVoiceResult(delta) {
  var all = (typeof getAllProcessedResults === 'function') ? getAllProcessedResults() : [];
  if (!all.length || !selectedVoiceItem) return;
  var idx = -1;
  for (var i = 0; i < all.length; i++) { if (all[i].ref === selectedVoiceItem.ref) { idx = i; break; } }
  var next = idx + delta;
  if (next < 0 || next >= all.length) return;
  var item = all[next];
  resolveSelectedResult(item.ref, item.label || item.ref);
}

$(document).on('click', '.voice-nav-prev', function () { navigateVoiceResult(-1); });
$(document).on('click', '.voice-nav-next', function () { navigateVoiceResult(1); });
