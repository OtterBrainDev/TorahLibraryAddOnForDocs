<script>
// The Voices tab: Sefaria's source sheets (server/search.gs searchVoices).
//
// Its search is a run of the shared workflow (SEARCH_TABS.voices in
// search-tabs). A sheet is filed under a topic category (VOICES_TOPIC_CATALOG
// in shared/ui/state: the first of its topics that fits one), and the
// categories are its corpora: results are grouped by category in the order
// saved in Preferences → Search, a group's ❌ or its chip hides it for this
// search, and categories left out in Preferences stay out unless a chip
// shows them (voices_topic_order / voices_topic_excluded).

/* ── Search ─────────────────────────────────────────────────────────────── */

// Any text but a Sefaria link (Texts opens those).
function voicesSuitsQuery(query) {
  var text = String(query || '').trim();
  return text.length >= 2 && !/^https?:\/\//i.test(text) && !/sefaria\.org\//i.test(text);
}

// A sheet's topic category, as its group and its corpus key.
function fileVoicesSheet(item) {
  var category = voicesTopicCategoryOf(item);
  item.corpusKey = category.key;
  item.clusterLabel = category.label;
  return item;
}

function voicesTopicRanks() {
  var ranks = {};
  getPreferenceCorpusOrder('voices').forEach(function (key, index) { ranks[key] = index; });
  return ranks;
}

function sortByVoicesTopic(items, keyOf) {
  var ranks = voicesTopicRanks();
  var rank = function (item) {
    var key = keyOf(item);
    return Object.prototype.hasOwnProperty.call(ranks, key) ? ranks[key] : 1000;
  };
  return items.map(function (item, index) { return { item: item, index: index }; })
    .sort(function (a, b) { return (rank(a.item) - rank(b.item)) || (a.index - b.index); })
    .map(function (pair) { return pair.item; });
}

// The sheets in the order they are shown (grouped by category, in the saved
// order; Sefaria's order within a category), so Prev / Next follow the list.
function arrangeVoicesSheets(items) {
  return sortByVoicesTopic(items || [], function (item) { return getResultCorpusKey(item, 'Search results'); });
}

// The topic chips, in the same order (syncAvailableCorpusFilters).
function sortVoicesTopicCorpora(corpora) {
  return sortByVoicesTopic(corpora || [], function (corpus) { return corpus.key; });
}

function searchVoicesRun(run) {
  if (!run.query) {
    searchRunChanged(run);
    finishSearchRun(run);
    return;
  }
  google.script.run.withSuccessHandler(function (response) {
    if (!isCurrentSearchRun(run)) return;
    var items = (Array.isArray(response) ? response : []).map(fileVoicesSheet);
    run.queryState.rawLibraryMatches = [];
    run.queryState.rawSearchResults = items;
    searchRunChanged(run);
    if (!items.length) setSearchRunHint(run, 'No source sheets matched this search.');
    finishSearchRun(run);
    if (isShownSearchRun(run)) updateModeDependentSections();
  }).withFailureHandler(function (error) {
    if (!isCurrentSearchRun(run)) return;
    run.queryState.rawLibraryMatches = [];
    run.queryState.rawSearchResults = [];
    searchRunChanged(run);
    setSearchRunHint(run, (error && error.message) || 'Voices search is temporarily unavailable.');
    finishSearchRun(run, true);
  }).searchVoices(run.query, {});
}

/* ── Pins ───────────────────────────────────────────────────────────────── */

// What a pinned or inserted sheet keeps: enough to show it again if the
// search that found it no longer lists it (restorePinnedVoicesSheet).
function voicesSessionEntry(item, run) {
  return buildSessionEntry(item.ref, item.label || item.ref, 'Source Sheets', {
    mode: 'voices',
    url: item.url || '',
    query: (run && run.query) || item.label || '',
    sheet: {
      label: item.label || '',
      summary: String(item.summary || '').slice(0, 400),
      owner: item.owner || '',
      url: item.url || '',
      sheetId: item.sheetId || null,
      topics: (Array.isArray(item.topics) ? item.topics : []).slice(0, 5)
    }
  });
}

function restorePinnedVoicesSheet(entry) {
  var sheet = entry && entry.sheet;
  if (!sheet || !entry.ref) return null;
  var item = fileVoicesSheet({
    key: 'sheet-' + String(sheet.sheetId || entry.ref.replace(/^sheet:/, '')),
    ref: entry.ref,
    label: sheet.label || entry.label || entry.ref,
    subtitle: sheet.owner ? 'By ' + sheet.owner : 'Source Sheet',
    snippet: '',
    summary: sheet.summary || '',
    owner: sheet.owner || '',
    url: sheet.url || entry.url || '',
    sheetId: sheet.sheetId || null,
    topics: Array.isArray(sheet.topics) ? sheet.topics : [],
    typeLabel: 'Voices',
    kind: 'sheet',
    hasTranslation: true,
    availableLangs: ['en', 'he']
  });
  queryState.rawSearchResults = [item].concat(queryState.rawSearchResults);
  reprocessAndRenderResults();
  return findShownResult(item.ref);
}

/* ── The selected sheet ─────────────────────────────────────────────────── */

/**
 * Build the preview card HTML for a selected Voices / source sheet result.
 * The insertion mode summary is a separate persistent DOM element (.voices-insertion-summary)
 * and is NOT rendered here — it is updated in place by the insert mode click handler.
 */
function buildVoicesPreviewHtml(item) {
  if (!item) return '';

  var title   = escapeHTML(item.label || item.ref || 'Untitled sheet');
  var owner   = item.owner ? escapeHTML('By ' + item.owner) : '';
  var snippet = escapeHTML(normalizeOptionText(item.snippet || item.summary || ''));
  var accent  = voicesTopicCategoryOf(item).accent || '';
  var accentAttr = accent ? " data-accent='" + accent + "'" : '';

  var openBtn = item.url
    ? "<a class='voice-preview-open-btn' href='" + escapeHTML(item.url) + "' target='_blank' rel='noopener' aria-label='Open " + title + " on Sefaria'><span class='open-sefaria-icon' aria-hidden='true'></span></a>"
    : '';
  var copyBtn = "<button type='button' class='voice-preview-copy-btn' aria-label='Copy citation to clipboard'>📋</button>";

  var html = "<div class='voice-preview voice-preview-card'" + accentAttr + " role='region' aria-label='Selected sheet preview'>";
  html += "<div class='voice-preview-header'>";
  html += "<div class='voice-preview-title'>" + title + "</div>";
  html += "<div class='voice-preview-header-actions'>" + copyBtn + (openBtn || '') + "</div>";
  html += "</div>";
  if (owner) html += "<div class='voice-preview-byline preview-meta'>" + owner + "</div>";

  if (snippet) {
    html += "<hr class='voice-preview-divider'>";
    html += "<div class='voice-preview-excerpt' dir='auto'>" + snippet + "</div>";
    html += "<button type='button' class='voice-preview-excerpt-toggle' aria-expanded='false'>See more ▾</button>";
  }

  if (Array.isArray(item.topics) && item.topics.length) {
    html += "<hr class='voice-preview-divider'>";
    html += "<div class='voice-preview-topics'>";
    item.topics.slice(0, 5).forEach(function(t) {
      html += "<span class='voice-preview-tag'>" + escapeHTML(t) + "</span>";
    });
    html += "</div>";
  }
  html += "</div>";
  return html;
}

function renderVoicesCard(item) {
  if (!item) return;
  var $target = appMode === 'voices' ? $('.voices-suggestions') : $('.suggestions');
  $target.html(buildVoicesPreviewHtml(item));
  // Show excerpt toggle if text is clamped
  setTimeout(function() {
    var el = document.querySelector('.voice-preview-excerpt');
    if (el && el.scrollHeight > el.offsetHeight) {
      var toggle = document.querySelector('.voice-preview-excerpt-toggle');
      if (toggle) toggle.style.display = 'block';
    }
  }, 0);
  // Sync nav button states
  updateVoiceNavButtons();
}

// Insert mode card: update summary line only; do not re-render the card.
var VOICE_MODE_SUMMARY_LABELS = { reference: 'Citation only', contents: 'Full text', both: 'Citation + text' };
$(document).on('click', '#voices-insert-mode .icon-mode-card', function () {
  var $group = $(this).closest('[role="radiogroup"]');
  $group.find('.icon-mode-card').removeClass('is-active').attr('aria-checked', 'false');
  $(this).addClass('is-active').attr('aria-checked', 'true');
  syncVoicesTransliterationUi(selectedVoicesTransliteration());
});

function selectedVoicesTransliteration() {
  return $('#voices-translit-menu .voices-translit-option.is-selected').attr('data-value') || 'none';
}

/**
 * Draw the Voices transliteration choice: the menu's selection, the button,
 * a sample in the form the insert uses (the Hebrew, then its transliteration
 * in parentheses: server/sheets.gs), and the "Will insert" line. A citation
 * alone has no Hebrew to transliterate, so the line says when it applies.
 */
function syncVoicesTransliterationUi(value) {
  var scheme = value && value !== 'none' ? value : 'none';
  var $options = $('#voices-translit-menu .voices-translit-option');
  $options.each(function () {
    var selected = $(this).attr('data-value') === scheme;
    $(this).toggleClass('is-selected', selected).attr('aria-selected', selected ? 'true' : 'false');
  });
  var label = $options.filter('[data-value="' + scheme + '"]').text() || 'None';
  $('#voices-translit-trigger').text(label + ' \u25BE').toggleClass('is-none', scheme === 'none');

  // The card's samples (shared/composition-card/shared, loaded after this file).
  var samples = typeof CC_TRANSLIT_LABELS === 'object' ? CC_TRANSLIT_LABELS : {};
  var sample = scheme === 'none' ? '' : (samples[scheme] || samples.simple_english || label);
  if (sample && typeof ccTranslitSample === 'function') sample = ccTranslitSample(sample, true);
  $('#voices-translit-sample-latin').text(sample ? '(' + sample + ')' : '');
  $('#voices-translit-sample').prop('hidden', !sample);

  var mode = $('#voices-insert-mode .icon-mode-card[aria-checked="true"]').data('value') || 'reference';
  var summary = 'Will insert: ' + (VOICE_MODE_SUMMARY_LABELS[mode] || 'Citation only');
  if (sample) {
    summary += mode === 'reference'
      ? '. Transliteration (' + label + ') applies to the sheet\u2019s text: choose Text or Both.'
      : ', each Hebrew passage followed by its transliteration (' + label + ') in parentheses.';
  }
  $('.voices-insertion-summary').text(summary);
}

// Transliteration dropdown: open/close trigger.
$(document).on('click', '#voices-translit-trigger', function (e) {
  e.stopPropagation();
  var $menu = $('#voices-translit-menu');
  var opening = $menu.hasClass('hidden');
  $menu.toggleClass('hidden', !opening);
  $(this).attr('aria-expanded', opening ? 'true' : 'false');
});

// Transliteration dropdown: an option chosen. It is the Voices default
// (voices_translit_default), so it is saved; the sample and the summary show
// the choice at once. Saved without redrawing the sidebar from the answer
// (saveAccountPreference does): that put "What to insert" back to its saved
// default, so Both turned into Citation as a transliteration was chosen.
$(document).on('click', '#voices-translit-menu .voices-translit-option', function () {
  var value = $(this).attr('data-value') || 'none';
  syncVoicesTransliterationUi(value);
  $('#voices-translit-menu').addClass('hidden');
  $('#voices-translit-trigger').attr('aria-expanded', 'false').trigger('focus');
  accountPreferences.voices_translit_default = value;
  effectivePreferences.voices_translit_default = value;
  google.script.run
    .withFailureHandler(function () {
      showSidebarToast('Your transliteration choice could not be saved; it applies to this insert only.');
    })
    .setAccountPreferences({ voices_translit_default: value });
});

// Dismiss voices translit menu when clicking outside the wrap.
$(document).on('click.voicesTranslitDismiss', function (e) {
  if ($(e.target).closest('#voices-translit-trigger, #voices-translit-menu').length) return;
  $('#voices-translit-menu').addClass('hidden');
  $('#voices-translit-trigger').attr('aria-expanded', 'false');
});

// Excerpt expand/collapse toggle.
$(document).on('click', '.voice-preview-excerpt-toggle', function () {
  var $btn = $(this);
  var expanded = $btn.attr('aria-expanded') === 'true';
  $btn.attr('aria-expanded', String(!expanded));
  $btn.text(expanded ? 'See more ▾' : 'See less ▴');
  $btn.prev('.voice-preview-excerpt').toggleClass('voice-preview-excerpt--expanded', !expanded);
});

// Copy citation to clipboard (Enhancement 9.5).
$(document).on('click', '.voice-preview-copy-btn', function () {
  if (!selectedVoiceItem) return;
  var title = selectedVoiceItem.label || selectedVoiceItem.ref || '';
  var url   = selectedVoiceItem.url || '';
  var text  = title + (url ? ' — ' + url : '');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function () { if (typeof showSidebarToast === 'function') showSidebarToast('Citation copied to clipboard.'); })
      .catch(function () { if (typeof showSidebarToast === 'function') showSidebarToast('Could not copy to clipboard.'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (typeof showSidebarToast === 'function') showSidebarToast('Citation copied to clipboard.');
  }
});

// Prev/next result navigation (Enhancement 9.2).
function updateVoiceNavButtons() {
  if (!selectedVoiceItem) { $('.voice-nav-btn').prop('disabled', true); return; }
  var all = (typeof getAllProcessedResults === 'function') ? getAllProcessedResults() : [];
  var idx = -1;
  for (var i = 0; i < all.length; i++) { if (all[i].ref === selectedVoiceItem.ref) { idx = i; break; } }
  $('.voice-nav-prev').prop('disabled', idx <= 0);
  $('.voice-nav-next').prop('disabled', idx < 0 || idx >= all.length - 1);
}

function navigateVoiceResult(delta) {
  var all = (typeof getAllProcessedResults === 'function') ? getAllProcessedResults() : [];
  if (!all.length || !selectedVoiceItem) return;
  var idx = -1;
  for (var i = 0; i < all.length; i++) { if (all[i].ref === selectedVoiceItem.ref) { idx = i; break; } }
  var next = idx + delta;
  if (next < 0 || next >= all.length) return;
  // As a click on its row: the row is marked and the card shows it.
  selectResultItem(all[next]);
}

$(document).on('click', '.voice-nav-prev', function () { navigateVoiceResult(-1); });
$(document).on('click', '.voice-nav-next', function () { navigateVoiceResult(1); });
</script>
