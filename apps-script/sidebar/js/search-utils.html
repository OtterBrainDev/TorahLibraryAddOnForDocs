<script>
var corpusColorClassMap = {
  tanakh: 'corpus-accent-tanakh',
  mishnah: 'corpus-accent-mishnah',
  talmud: 'corpus-accent-talmud',
  midrash: 'corpus-accent-midrash',
  halakhah: 'corpus-accent-halakhah',
  liturgy: 'corpus-accent-liturgy',
  kabbalah: 'corpus-accent-kabbalah',
  philosophy: 'corpus-accent-philosophy',
  chasidut: 'corpus-accent-chasidut',
  musar: 'corpus-accent-musar',
  commentary: 'corpus-accent-commentary',
  reference: 'corpus-accent-reference',
  'modern-works': 'corpus-accent-modernworks',
  apocrypha: 'corpus-accent-apocrypha',
  tanaitic: 'corpus-accent-tanaitic'
};

function saveLastUsedSearchSettings() {
  saveSidebarPreference({
    last_translation_languages: JSON.stringify(getCheckedValues('.translation-language-option')),
    last_translation_only_filter: $('.translation-only-filter').is(':checked'),
    last_search_sort_mode: $('.search-sort-select').val() || 'relevance',
    last_search_relevance_sort: $('.wants-relevance').length ? $('.wants-relevance').is(':checked') : true
  });
}

function buildPreviewLoadingHTML(message) {
  var text = String(message || 'Loading preview…').trim();
  return "<div class='preview-loading' role='status' aria-live='polite'><span class='preview-loading-spinner' aria-hidden='true'></span><span>" + escapeHTML(text) + "</span></div>";
}

function normalizeOptionText(value) {
  return String(value || '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/<[^>]*>/g, '')
    .replace(/[\u200B-\u200D\uFEFF\u200E\u200F\u202A-\u202E]/g, '')
    .replace(/^[\s\-–—:•·]+/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// The sidebar's busy overlay (aside.busy-overlay in sidebar.html). `kind`
// picks the label and the small animation under the logo, so the user can
// tell what the wait is for.
var BUSY_OVERLAY_LABELS = {
  insert: 'Inserting into your document…',
  fetch: 'Fetching the sheet…',
  selection: 'Looking up your selection…',
  transform: 'Updating divine names…'
};

function showBusyOverlay(kind) {
  var key = Object.prototype.hasOwnProperty.call(BUSY_OVERLAY_LABELS, kind) ? kind : 'insert';
  var $overlay = $('.busy-overlay');
  $overlay.attr('data-kind', key);
  $overlay.find('.busy-label').text(BUSY_OVERLAY_LABELS[key]);
  $overlay.stop(true, true).fadeIn(150);
}

function hideBusyOverlay() {
  $('.busy-overlay').stop(true, true).fadeOut(250);
}

function showInsertWarning(message) {
  var warningText = String(message || 'Could not insert at the current selection. Place the cursor where you want the source inserted, then try again.').trim();
  $('.insert-warning').remove();
  $('.suggestions').prepend("<div class='insert-warning' role='alert' aria-live='assertive'>" + escapeHTML(warningText) + "</div>");
}

function buildSefariaOpenUrl() {
  if (!data || !data.ref) {
    return '';
  }
  var refSlug = encodeURIComponent(data.ref).replace(/%20/g, '_');
  var params = new URLSearchParams();
  var outputMode = $('.output-mode-selection').val();
  if (outputMode === 'he') params.set('lang', 'he');
  else if (outputMode === 'en') params.set('lang', 'en');
  else params.set('lang', 'bi');

  var selectedTranslationVersion = $('.translation-version-select').val() || data.versionTitle || '';
  var selectedSourceVersion = $('.he-version-selection').val() || data.heVersionTitle || '';
  if (outputMode !== 'he' && selectedTranslationVersion) params.set('ven', selectedTranslationVersion);
  if (outputMode !== 'en' && selectedSourceVersion) params.set('vhe', selectedSourceVersion);

  var query = params.toString();
  return query ? "https://www.sefaria.org/" + refSlug + "?" + query : "https://www.sefaria.org/" + refSlug;
}

function normalizeUnifiedReferenceInput(value) {
  var normalized = String(value || '').trim();
  if (!normalized) return '';
  normalized = normalized
    .replace(/[־‐-―]/g, '-')
    .replace(/[“”„‟″״]/g, '"')
    .replace(/[‘’‚‛′׳]/g, "'")
    .replace(/[‎‏‪-‮]/g, '')
    .replace(/׃/g, ':')
    .replace(/\s*[:：]\s*/g, ':')
    .replace(/\s*[-–—]\s*/g, '-')
    .replace(/([֐-׿])["'׳״]+(?=[\s:.-]|$)/g, '$1')
    .replace(/([֐-׿])["'׳״]+(?=[֐-׿])/g, '$1')
    .replace(/\s+/g, ' ')
    .trim();
  return normalized;
}

function expandShevaApostrophe(str) {
  // Converts sheva-apostrophe transliteration to vocalized form: P'sukei → Pesukei, D'Zimra → Dezimra.
  //
  // The apostrophe must follow a WORD-INITIAL run of 1-2 consonants, which is the
  // only shape a transliterated sheva takes (P', B', D', K', L', M', Sh', Ch', Tz').
  // Without that anchor the rule also fired on English possessives and
  // contractions — "A Woman's Commentary" became "A Womanes Commentary" and
  // "don't" became "donet" — which poisoned every downstream search path,
  // because `inputExpanded` feeds the name API, the direct-ref lookup and the
  // content search alike. See docs/regression-log.md.
  return String(str || '').replace(
    /(^|[\s"'“”‘’([{\-])([bcdfghjklmnpqrstvwxyz]{1,2})'(?=[A-Za-z])/gi,
    function (match, boundary, consonants) {
      return boundary + consonants + 'e';
    }
  );
}

function applyConsonantClusterVoweling(str) {
  // For dropped-sheva Hebrew transliteration: Psukei → Pesukei, Dvar → Devar, Tfilin → Tefilin
  // Skips digraphs (sh, ch, kh, tz, ts, ph, th, gh, wh) so Shema/Chanukah are unchanged.
  // Skips when second consonant is 'r' or 'l' to avoid expanding standard English clusters:
  //   Pr (Prayer), Br (Bread), Bl (Blend), Cl (Club), Fl (Float), Gl (Glow), Pl (Play), Tr (Train), etc.
  var s = String(str || '');
  if (/^(sh|ch|kh|tz|ts|ph|th|gh|wh)/i.test(s)) return s;
  return s.replace(/^([bcdfgjklmnpqrstvwxyzBCDFGJKLMNPQRSTVWXYZ])([bcdfgjkmnpqstvwxyzBCDFGJKMNPQSTVWXYZ])/, '$1e$2');
}

function isLikelyTitleQuery(input) {
  var str = String(input || '').trim();
  if (!str || str.length < 2 || str.length > 70) return false;
  if (isLikelyHebrewScriptInput(str)) return false;
  if (/["""'']{2}/.test(str)) return false;
  return str.split(/\s+/).filter(Boolean).length <= 6;
}

// Guard for multi-word queries: reject name-API candidates that only share the
// first token with the query.  Single-word queries pass unconditionally so the
// existing name-API behaviour (e.g. Psukei expansion) is fully preserved.
function nameCandidatePassesFullQueryGuard(candidate, queryExpanded) {
  var tokens = String(queryExpanded || '').trim().split(/\s+/).filter(Boolean);
  if (tokens.length <= 1) return true;

  function norm(s) {
    return String(s || '')
      .replace(/['\u2018\u2019\u02BC\u05F3]/g, '')
      .replace(/[-\u05BE]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .toUpperCase();
  }

  var candidateNorm = norm(candidate);
  var queryNorm = norm(queryExpanded);

  // Allow if candidate starts with the full normalized query
  if (candidateNorm.indexOf(queryNorm) === 0) return true;

  // Allow if every query token appears in the candidate in left-to-right order
  var tokenNorms = queryNorm.split(/\s+/).filter(Boolean);
  var pos = 0;
  for (var i = 0; i < tokenNorms.length; i++) {
    var idx = candidateNorm.indexOf(tokenNorms[i], pos);
    if (idx < 0) return false;
    pos = idx + tokenNorms[i].length;
  }
  return true;
}

function isLikelyHebrewScriptInput(value) {
  var normalized = String(value || '').trim();
  return /[\u0590-\u05FF]/.test(normalized) && !/[A-Za-z]/.test(normalized);
}

// Title punctuation is not something a reader can be expected to reproduce.
// Sefaria's title is "The Torah; A Women's Commentary" \u2014 with a SEMICOLON \u2014 and
// the exact-match lookup used to require exactly that, so "The Torah, A Women's
// Commentary", "The Torah: ..." and "The Torah A Womens ..." all found nothing.
// A loose key compares titles by their words alone: case folded, apostrophes
// and niqqud dropped (Women's = Womens), every other run of punctuation or
// space collapsed to one space.
var LOOSE_KEY_DROP_RE_ = /['"`\u2018\u2019\u201C\u201D\u02BC\u05F3\u05F4\u0591-\u05C7]/;
var LOOSE_KEY_WORD_RE_ = /[0-9a-z\u00C0-\u024F\u05D0-\u05EA]/;

/**
 * @returns {{key: string, ends: number[]}} the loose key, and for each key
 *   character the index in `value` just past the character that produced it,
 *   so a match on the key can be mapped back onto what the reader typed.
 */
function buildLooseTitleKey_(value) {
  var raw = String(value || '');
  var key = '';
  var ends = [];
  for (var i = 0; i < raw.length; i++) {
    var ch = raw.charAt(i).toLowerCase();
    if (LOOSE_KEY_DROP_RE_.test(ch)) continue;
    if (LOOSE_KEY_WORD_RE_.test(ch)) {
      key += ch;
      ends.push(i + 1);
    } else if (key && key.charAt(key.length - 1) !== ' ') {
      key += ' ';
      ends.push(i + 1);
    }
  }
  if (key.charAt(key.length - 1) === ' ') {
    key = key.slice(0, -1);
    ends.pop();
  }
  return { key: key, ends: ends };
}

// buildLooseTitleKey_ without the offset map, for keying the whole title list:
// the same key, several times faster. search-input-normalization.test.js pins
// that the two agree.
var LOOSE_KEY_DROP_ALL_RE_ = /['"`\u2018\u2019\u201C\u201D\u02BC\u05F3\u05F4\u0591-\u05C7]/g;
var LOOSE_KEY_BREAK_ALL_RE_ = /[^0-9a-z\u00C0-\u024F\u05D0-\u05EA]+/g;

function looseTitleKey_(value) {
  return String(value || '').toLowerCase()
    .replace(LOOSE_KEY_DROP_ALL_RE_, '')
    .replace(LOOSE_KEY_BREAK_ALL_RE_, ' ')
    .trim();
}

// The title list is loaded once per sidebar; key it once, not per keystroke.
var looseTitleIndexCache_ = { source: null, length: -1, entries: [] };

function getLooseTitleIndex_() {
  var list = Array.isArray(titles) ? titles : [];
  if (looseTitleIndexCache_.source === list && looseTitleIndexCache_.length === list.length) {
    return looseTitleIndexCache_.entries;
  }
  var entries = [];
  for (var i = 0; i < list.length; i++) {
    var title = String(list[i] || '').trim();
    if (!title) continue;
    // Keyed on the sheva-expanded form because every query is expanded before
    // it gets here (see runUnifiedQuery).
    var key = looseTitleKey_(title.indexOf("'") >= 0 ? expandShevaApostrophe(title) : title);
    if (key) entries.push({ title: title, key: key });
  }
  looseTitleIndexCache_ = { source: list, length: list.length, entries: entries };
  return entries;
}

/**
 * Titles whose loose key starts with the query's \u2014 the as-you-type title list.
 * Punctuation-blind, so "The Torah A Wom" still finds "The Torah; A Women's ...".
 */
function getLoosePrefixTitleMatches(queries, limit) {
  var keys = (Array.isArray(queries) ? queries : [queries]).map(function (query) {
    return buildLooseTitleKey_(query).key;
  }).filter(Boolean);
  if (!keys.length) return [];
  var out = [];
  var entries = getLooseTitleIndex_();
  for (var i = 0; i < entries.length && out.length < limit; i++) {
    for (var k = 0; k < keys.length; k++) {
      if (entries[i].key.indexOf(keys[k]) === 0) {
        out.push(entries[i].title);
        break;
      }
    }
  }
  return out;
}

/**
 * Rewrite the title part of a reference to the catalogue's own spelling, so the
 * direct lookup sends Sefaria a title it recognizes. The longest catalogue title
 * whose words are a leading run of the query's words wins; what follows it
 * (chapter, verse, a sub-section) is kept exactly as typed.
 *
 *   "the torah, a womens commentary, deuteronomy 29 9-14"
 *     \u2192 "The Torah; A Women's Commentary, Deuteronomy 29 9-14"
 */
function normalizeLatinLookupTitleCase(value) {
  var input = String(value || '').trim();
  if (!input || !/[A-Za-z]/.test(input) || /[\u0590-\u05FF]/.test(input) || !Array.isArray(titles)) {
    return input;
  }

  var query = buildLooseTitleKey_(input);
  if (!query.key) return input;
  var lowerInput = input.toLowerCase();

  var best = null;
  var bestIsLiteral = false;
  getLooseTitleIndex_().forEach(function (entry) {
    if (!/[A-Za-z]/.test(entry.title)) return;
    if (query.key !== entry.key && query.key.indexOf(entry.key + ' ') !== 0) return;
    // Several catalogue spellings can share one loose key. Prefer the one the
    // reader typed literally, so a query that already matched is left alone.
    var isLiteral = lowerInput.indexOf(entry.title.toLowerCase()) === 0;
    if (!best || entry.key.length > best.key.length ||
        (entry.key.length === best.key.length && isLiteral && !bestIsLiteral)) {
      best = entry;
      bestIsLiteral = isLiteral;
    }
  });

  if (!best) return input;
  return best.title + input.slice(query.ends[best.key.length - 1]);
}

function mapSefariaRefSlugToLookupRef(slug) {
  var decoded = String(slug || '').trim();
  if (!decoded) return '';
  try {
    decoded = decodeURIComponent(decoded);
  } catch (error) {}
  decoded = decoded.replace(/^\/+/, '').replace(/\/+?/g, '/').replace(/_/g, ' ');
  decoded = decoded.replace(/\/+$/g, '').replace(/\/+/g, '/');
  var parts = decoded.split('/').filter(Boolean);
  if (!parts.length) return '';
  var titlePart = parts[0];
  var sectionPart = parts.slice(1).join(':');
  return sectionPart ? titlePart + " " + sectionPart : titlePart;
}

function parseSefariaUrlInput(inputValue) {
  var raw = String(inputValue || '').trim();
  if (!raw) return null;

  var parsedUrl;
  try {
    parsedUrl = new URL(raw);
  } catch (error) {
    return null;
  }

  // Substring matching here would accept sefaria.org.evil.example and
  // notsefaria.org.attacker.net. Require the host to BE sefaria.org or a
  // genuine subdomain of it.
  var host = (parsedUrl.hostname || '').toLowerCase().replace(/\.$/, '');
  if (host !== 'sefaria.org' && host.slice(-12) !== '.sefaria.org') return null;
  if (parsedUrl.protocol !== 'https:' && parsedUrl.protocol !== 'http:') return null;

  var path = (parsedUrl.pathname || '').replace(/^\/+/, '');
  if (!path) return null;

  var blockedRoots = { api: true, texts: true, sheets: true, topics: true, collections: true, account: true, profile: true, help: true };
  var slug = path.split('/')[0] || '';
  if (!slug || blockedRoots[slug.toLowerCase()]) return null;

  var ref = mapSefariaRefSlugToLookupRef(path);
  if (!ref) return null;

  var lang = (parsedUrl.searchParams.get('lang') || '').toLowerCase().trim();
  var outputMode = 'both';
  if (lang === 'en') outputMode = 'en';
  else if (lang === 'he') outputMode = 'he';

  return {
    ref: ref,
    outputMode: outputMode,
    preferredVersions: {
      en: parsedUrl.searchParams.get('ven') || '',
      he: parsedUrl.searchParams.get('vhe') || ''
    }
  };
}

function formatBreadcrumb(refValue) {
  var ref = String(refValue || '').trim();
  if (!ref) return '';
  var commaParts = ref.split(',').map(function (part) { return part.trim(); }).filter(Boolean);
  if (commaParts.length <= 1) return ref;
  var title = commaParts[0];
  var pathPart = commaParts.slice(1).join(', ');
  var pathPieces = pathPart.split(':').map(function (part) { return part.trim(); }).filter(Boolean);
  if (!pathPieces.length) return ref;
  return [title].concat(pathPieces).join(' › ');
}

function buildPreviewMeta(primaryRef, fallbackRef) {
  var breadcrumb = formatBreadcrumb(primaryRef);
  if (!breadcrumb && fallbackRef && fallbackRef.indexTitle && Array.isArray(fallbackRef.sections)) {
    breadcrumb = [fallbackRef.indexTitle].concat(fallbackRef.sections).join(' › ');
  }
  var fallback = '';
  if (typeof fallbackRef === 'string') fallback = fallbackRef.trim();
  else if (fallbackRef && typeof fallbackRef === 'object') fallback = String(fallbackRef.ref || fallbackRef.heRef || primaryRef || '').trim();
  else fallback = String(primaryRef || '').trim();
  var display = breadcrumb || fallback;
  return "<div class='preview-meta'>" + escapeHTML(display) + "</div>";
}

// returningToResults: the sidebar is about to go back to the result list on
// its own (see returnToResultsFromDeadEnd), so say so instead of leaving the
// reader to wonder what to do next.
function buildNonInsertableMessage(response, returningToResults) {
  var state = getResolvedNodeState(response);
  return buildPreviewMeta(response && (response.ref || response.heRef), response || '') +
    "<div class='noninsertable-warning'><h4 class='preview-state-title'>This is a section, not a directly insertable text.</h4><p class='preview-state-message'>Choose a subsection or more specific reference to preview and insert.</p><p class='preview-state-message'>" +
    escapeHTML(state.prompt) + "</p>" +
    (returningToResults ? "<p class='preview-state-message noninsertable-returning' role='status'>Returning to your results…</p>" : '') +
    "</div>";
}

function clearVersionSelectors() {
  $('.translation-version-control').empty();
  $('.hebrew-version-control').empty();
}

function setResultsHint(message, allowHtml) {
  var text = String(message || '').trim();
  var $hint = $('.results-hint');
  if (!text) {
    $hint.hide().empty();
    return;
  }
  if (allowHtml) {
    $hint.html(message).show();
  } else {
    $hint.text(text).show();
  }
}

function normalizeFuzzyText(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/[֑-ׇ]/g, '')
    .replace(/[_.,/#!$%^&*;:{}=\\\-`~()\[\]"'׳״]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function splitReferenceForFuzzy(query) {
  var raw = String(query || '').trim();
  if (!raw) return { titlePart: '', suffixPart: '' };
  var match = raw.match(/^(.*?)(\s+[\d\u05D0-\u05EA].*)$/);
  if (!match) return { titlePart: raw, suffixPart: '' };
  return { titlePart: String(match[1] || '').trim(), suffixPart: String(match[2] || '') };
}

function levenshteinDistance(a, b) {
  a = String(a || '');
  b = String(b || '');
  if (!a) return b.length;
  if (!b) return a.length;
  var matrix = [];
  for (var i = 0; i <= b.length; i++) matrix[i] = [i];
  for (var j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (i = 1; i <= b.length; i++) {
    for (j = 1; j <= a.length; j++) {
      var cost = a.charAt(j - 1) === b.charAt(i - 1) ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + cost
      );
    }
  }
  return matrix[b.length][a.length];
}

/**
 * levenshteinDistance(a, b) when it is at most `max`; otherwise any value
 * greater than `max` (the computation stops as soon as that is certain).
 */
function levenshteinWithin_(a, b, max) {
  a = String(a || '');
  b = String(b || '');
  if (Math.abs(a.length - b.length) > max) return max + 1;
  if (!a) return b.length;
  if (!b) return a.length;
  // Runs over much of the title list on every search, so: typed arrays, char
  // codes read once, and two rows instead of the full matrix.
  var aLength = a.length;
  var aCodes = new Uint16Array(aLength);
  for (var c = 0; c < aLength; c++) aCodes[c] = a.charCodeAt(c);
  var previous = new Uint16Array(aLength + 1);
  var current = new Uint16Array(aLength + 1);
  for (var j = 0; j <= aLength; j++) previous[j] = j;
  for (var i = 1; i <= b.length; i++) {
    var bCode = b.charCodeAt(i - 1);
    current[0] = i;
    var rowMin = i;
    for (j = 1; j <= aLength; j++) {
      var value = previous[j - 1] + (aCodes[j - 1] === bCode ? 0 : 1);
      var deletion = previous[j] + 1;
      var insertion = current[j - 1] + 1;
      if (deletion < value) value = deletion;
      if (insertion < value) value = insertion;
      current[j] = value;
      if (value < rowMin) rowMin = value;
    }
    if (rowMin > max) return max + 1;
    var swap = previous;
    previous = current;
    current = swap;
  }
  return previous[aLength];
}

/**
 * Character counts of a normalized string: a-z, 0-9, the Hebrew letters, and
 * one bucket for anything else.
 */
function fuzzyCharHistogram_(text) {
  var counts = [];
  for (var k = 0; k < 64; k++) counts[k] = 0;
  for (var i = 0; i < text.length; i++) {
    var code = text.charCodeAt(i);
    var bucket = 63;
    if (code >= 97 && code <= 122) bucket = code - 97;
    else if (code >= 48 && code <= 57) bucket = 26 + code - 48;
    else if (code >= 0x05D0 && code <= 0x05EA) bucket = 36 + code - 0x05D0;
    counts[bucket]++;
  }
  return counts;
}

/**
 * A lower bound on the edit distance from two histograms: one edit changes the
 * summed count difference by at most two. Much cheaper than the matrix, and
 * enough to reject most of the title list outright.
 */
function fuzzyHistogramLowerBound_(left, right) {
  var total = 0;
  for (var k = 0; k < 64; k++) total += Math.abs(left[k] - right[k]);
  return Math.ceil(total / 2);
}

// Tokens that carry no discriminating power in a Sefaria title. Dropping them
// stops "A ... Commentary" from matching on "a" alone.
var FUZZY_STOPWORDS_ = { a: true, an: true, the: true, of: true, on: true, to: true, in: true, and: true };

function fuzzyTokens_(normalizedText) {
  return String(normalizedText || '')
    .split(/[^0-9a-zא-ת]+/)
    .filter(function (token) {
      return token && token.length >= 2 && !FUZZY_STOPWORDS_[token];
    });
}

/**
 * Does `titleTokens` contain something close enough to `queryToken`?
 * Exact match, a prefix of at least 4 characters, or a single-character typo.
 */
function fuzzyTokenMatches_(queryToken, titleTokens) {
  for (var i = 0; i < titleTokens.length; i++) {
    var titleToken = titleTokens[i];
    if (titleToken === queryToken) return true;
    if (queryToken.length >= 4 && titleToken.indexOf(queryToken) === 0) return true;
    if (titleToken.length >= 4 && queryToken.indexOf(titleToken) === 0) return true;
    // "woman" vs "women" — a single substitution, which is exactly the kind of
    // near-miss that used to produce a dead end.
    if (Math.abs(titleToken.length - queryToken.length) <= 1 &&
        queryToken.length >= 4 &&
        levenshteinWithin_(queryToken, titleToken, 1) <= 1) {
      return true;
    }
  }
  return false;
}

/**
 * Second pass over the title list: titles that contain EVERY significant token
 * of the query, in any position and any order.
 *
 * The original pass only considered titles starting with the same letter as the
 * query, which is right for typos ("Bereshit" → "Bereshit") but leaves a dead
 * end whenever the user types a fragment from the middle of a title. Searching
 * "A Woman's Commentary" found nothing, because the catalogue entry is
 * "The Torah: A Women's Commentary" — different first letter, and one letter
 * different in the one token that matters.
 */
// Collapse a leading Hilchot abbreviation so it can be compared against the
// title list. The AUTHORITATIVE expansion map (including the work prefixes used
// for actual reference resolution) lives in server/citation-abbreviations.gs;
// this is only the spelling normalization the client needs for MATCHING, and is
// deliberately kept to that one job so the two cannot meaningfully drift.
var HILCHOT_ABBREVIATIONS_CLIENT_ = [
  'hil', 'hil.', 'hilc', 'hilch', 'hilch.', 'hilchos', 'hilchot',
  'hilkhot', 'hilkhos', 'hilchoth', 'hilchote'
];

function canonicalizeCitationAbbreviation(value) {
  var input = String(value || '').trim();
  if (!input) return '';
  return input.replace(/(^|,\s*)([A-Za-z.]+)(\s+)/, function (match, boundary, word, space) {
    if (HILCHOT_ABBREVIATIONS_CLIENT_.indexOf(word.toLowerCase()) < 0) return match;
    return boundary + 'Hilchot' + space;
  });
}

// The suggester now runs on every search, not only on zero results, so the
// per-title work that does not depend on the query (normalizing, tokenizing,
// script detection) is done once per title list rather than per keystroke.
var fuzzyTitleIndexCache_ = { source: null, length: -1, entries: [], vocabulary: [] };

function getFuzzyTitleIndex_() {
  var list = Array.isArray(titles) ? titles : [];
  if (fuzzyTitleIndexCache_.source === list && fuzzyTitleIndexCache_.length === list.length) {
    return fuzzyTitleIndexCache_;
  }
  var entries = [];
  var seenToken = Object.create(null);
  var vocabulary = [];
  for (var i = 0; i < list.length; i++) {
    var rawTitle = String(list[i] || '').trim();
    if (!rawTitle) continue;
    var normalized = normalizeFuzzyText(rawTitle);
    if (!normalized) continue;
    var tokens = fuzzyTokens_(normalized);
    for (var t = 0; t < tokens.length; t++) {
      if (!seenToken[tokens[t]]) {
        seenToken[tokens[t]] = true;
        vocabulary.push(tokens[t]);
      }
    }
    entries.push({
      rawTitle: rawTitle,
      normalized: normalized,
      histogram: fuzzyCharHistogram_(normalized),
      tokens: tokens,
      isHebrew: isLikelyHebrewScriptInput(rawTitle)
    });
  }
  fuzzyTitleIndexCache_ = { source: list, length: list.length, entries: entries, vocabulary: vocabulary };
  return fuzzyTitleIndexCache_;
}

/**
 * For each query token, the set of title-list words it fuzzily matches
 * (fuzzyTokenMatches_). Titles share a small vocabulary, so matching each word
 * once and then testing titles by set lookup replaces a Levenshtein call per
 * title per token.
 */
function buildQueryTokenMatchSets_(queryTokens, vocabulary) {
  return queryTokens.map(function (queryToken) {
    var set = Object.create(null);
    for (var v = 0; v < vocabulary.length; v++) {
      if (fuzzyTokenMatches_(queryToken, [vocabulary[v]])) set[vocabulary[v]] = true;
    }
    return set;
  });
}

function titleHasTokenIn_(titleTokens, matchSet) {
  for (var i = 0; i < titleTokens.length; i++) {
    if (matchSet[titleTokens[i]]) return true;
  }
  return false;
}

/**
 * Last-resort pass: titles sharing SOME of the query's distinctive tokens.
 *
 * Runs only when the exact and all-tokens passes found nothing, because it is
 * the loosest of the three and the point is to avoid a dead end, not to guess.
 * The bar is at least two matching distinctive tokens AND half the query
 * covered — one shared token would surface every "Mishneh Torah, Hilchot ..."
 * section for any Rambam query, which is noise dressed up as help.
 *
 * This is what rescues "Hil. Avodah Zarah 12:11": Sefaria indexes that section
 * as "Mishneh Torah, Hilchot Avodah Kochavim", so "zarah" never matches, but
 * "hilchot" and "avodah" do — enough to offer it and let the reader decide.
 */
function getPartialOverlapSuggestions_(titlePart, queryLooksHebrew) {
  var queryTokens = fuzzyTokens_(titlePart);
  if (queryTokens.length < 2) return [];

  var index = getFuzzyTitleIndex_();
  var matchSets = buildQueryTokenMatchSets_(queryTokens, index.vocabulary);
  var results = [];

  for (var i = 0; i < index.entries.length; i++) {
    var entry = index.entries[i];
    if (entry.isHebrew !== queryLooksHebrew) continue;
    var rawTitle = entry.rawTitle;
    var normalizedTitle = entry.normalized;
    var titleTokens = entry.tokens;
    if (!titleTokens.length) continue;

    var matched = 0;
    var matchedChars = 0;
    var totalChars = 0;
    for (var t = 0; t < queryTokens.length; t++) {
      totalChars += queryTokens[t].length;
      if (titleHasTokenIn_(titleTokens, matchSets[t])) {
        matched++;
        matchedChars += queryTokens[t].length;
      }
    }

    if (matched < 2 || (matched / queryTokens.length) < 0.5) continue;

    // Score by matched CHARACTERS, not matched token count. Longer tokens are
    // more distinctive, and counting tokens equally ranks badly in exactly the
    // case this pass exists for: "Hilchot Avodah Zarah" matches two tokens
    // against both "Avodah Zarah" (the Talmud tractate) and "Mishneh Torah,
    // Hilchot Avodah Kochavim" (what the reader actually wants). Weighting by
    // length lets "hilchot" — the word that says which work this is — outweigh
    // the shorter "zarah", and the Rambam section ranks first.
    results.push({
      rawTitle: rawTitle,
      coverage: totalChars > 0 ? (matchedChars / totalChars) : 0,
      length: normalizedTitle.length
    });
  }

  return results.sort(function (a, b) {
    if (a.coverage !== b.coverage) return b.coverage - a.coverage;
    if (a.length !== b.length) return a.length - b.length;
    return a.rawTitle.localeCompare(b.rawTitle);
  });
}

function getTokenOverlapSuggestions_(titlePart, queryLooksHebrew) {
  var queryTokens = fuzzyTokens_(titlePart);
  if (!queryTokens.length) return [];

  var index = getFuzzyTitleIndex_();
  var matchSets = buildQueryTokenMatchSets_(queryTokens, index.vocabulary);
  var results = [];

  for (var i = 0; i < index.entries.length; i++) {
    var entry = index.entries[i];
    if (entry.isHebrew !== queryLooksHebrew) continue;
    var rawTitle = entry.rawTitle;
    var normalizedTitle = entry.normalized;
    var titleTokens = entry.tokens;
    if (!titleTokens.length) continue;

    var allMatched = true;
    for (var t = 0; t < queryTokens.length; t++) {
      if (!titleHasTokenIn_(titleTokens, matchSets[t])) {
        allMatched = false;
        break;
      }
    }
    if (!allMatched) continue;

    // Prefer the tightest title that still covers the query: "The Torah: A
    // Women's Commentary" beats a 200-character sub-reference of it.
    results.push({ rawTitle: rawTitle, score: normalizedTitle.length - titlePart.length });
  }

  return results.sort(function (a, b) {
    if (a.score !== b.score) return a.score - b.score;
    return a.rawTitle.localeCompare(b.rawTitle);
  });
}

function getFuzzyReferenceSuggestions(query) {
  var split = splitReferenceForFuzzy(query);
  var titlePart = normalizeFuzzyText(split.titlePart);
  if (!titlePart || titlePart.length < 2 || !Array.isArray(titles) || !titles.length) return [];
  var queryLooksHebrew = isLikelyHebrewScriptInput(split.titlePart);
  var firstChar;
  // Compare against the canonical spelling: "Hil. Shabbat" has to look like
  // "Hilchot Shabbat" before any token can match a Sefaria title.
  titlePart = normalizeFuzzyText(canonicalizeCitationAbbreviation(split.titlePart)) || titlePart;
  firstChar = titlePart.charAt(0);
  var queryHistogram = fuzzyCharHistogram_(titlePart);

  var scored = getFuzzyTitleIndex_().entries.map(function (entry) {
    var rawTitle = entry.rawTitle;
    var normalizedTitle = entry.normalized;
    if (queryLooksHebrew !== entry.isHebrew) return null;
    var titleContainsQuery = normalizedTitle.indexOf(titlePart) >= 0;
    var queryStartsWithTitle = titlePart.indexOf(normalizedTitle) === 0;
    if (firstChar && normalizedTitle.charAt(0) !== firstChar && normalizedTitle.indexOf(titlePart) !== 0 && !queryStartsWithTitle) return null;
    var maxLen = Math.max(titlePart.length, normalizedTitle.length, 1);
    var distance;
    if (titleContainsQuery || queryStartsWithTitle) {
      // One string contains the other, so the edit distance is exactly the
      // difference in length: no need to run the matrix.
      distance = Math.abs(normalizedTitle.length - titlePart.length);
    } else {
      // Only a ratio of 0.55 or better survives; stop the matrix as soon as it
      // is out of reach. Most of the title list is rejected here in a few rows.
      var maxDistance = Math.floor(0.55 * maxLen);
      if (Math.abs(normalizedTitle.length - titlePart.length) > maxDistance) return null;
      if (fuzzyHistogramLowerBound_(queryHistogram, entry.histogram) > maxDistance) return null;
      distance = levenshteinWithin_(titlePart, normalizedTitle, maxDistance);
    }
    var ratio = distance / maxLen;
    var startsBonus = normalizedTitle.indexOf(titlePart) === 0 ? -0.25 : 0;
    var containsBonus = titleContainsQuery ? -0.15 : 0;
    var score = ratio + startsBonus + containsBonus;
    if (ratio > 0.55 && !titleContainsQuery && !queryStartsWithTitle) return null;
    return { rawTitle: rawTitle, score: score };
  }).filter(Boolean).sort(function (a, b) {
    if (a.score !== b.score) return a.score - b.score;
    return a.rawTitle.localeCompare(b.rawTitle);
  });

  // The same-first-letter pass above handles typos. Append the token-overlap
  // pass so a fragment from the middle of a title is not a dead end. Order
  // matters: near-spellings of what the user typed stay first.
  scored = scored.concat(getTokenOverlapSuggestions_(titlePart, queryLooksHebrew));

  // Only if both tighter passes came back empty. See getPartialOverlapSuggestions_.
  if (!scored.length) {
    scored = getPartialOverlapSuggestions_(titlePart, queryLooksHebrew);
  }

  // Sefaria registers the same section under several work names — "Mishneh
  // Torah, Hilchot Shabbat" and "Rambam, Hilchot Shabbat" are one passage. Pick
  // ONE spelling per section before deduping, preferring the name Sefaria shows
  // when the passage is opened, so the suggestion matches what the reader lands
  // on. Ranking alone would keep whichever happened to be shorter.
  var PREFERRED_WORK_NAMES_ = ['mishneh torah', 'shulchan arukh'];
  var bodyOf = function (rawTitle) {
    var commaIndex = rawTitle.indexOf(',');
    return commaIndex > 0 ? rawTitle.slice(commaIndex + 1).trim().toLowerCase() : '';
  };
  var workRankOf = function (rawTitle) {
    var commaIndex = rawTitle.indexOf(',');
    if (commaIndex <= 0) return PREFERRED_WORK_NAMES_.length;
    var work = rawTitle.slice(0, commaIndex).trim().toLowerCase();
    var rank = PREFERRED_WORK_NAMES_.indexOf(work);
    return rank < 0 ? PREFERRED_WORK_NAMES_.length : rank;
  };

  var preferredForBody = {};
  scored.forEach(function (entry) {
    var body = bodyOf(entry.rawTitle);
    if (!body) return;
    var current = preferredForBody[body];
    if (!current || workRankOf(entry.rawTitle) < workRankOf(current)) {
      preferredForBody[body] = entry.rawTitle;
    }
  });

  var seen = {};
  var seenBody = {};
  return scored.filter(function (entry) {
    var suggestion = entry.rawTitle + split.suffixPart;
    if (seen[suggestion]) return false;
    seen[suggestion] = true;
    if (suggestion.toLowerCase() === String(query || '').trim().toLowerCase()) return false;

    var bodyKey = bodyOf(entry.rawTitle);
    if (bodyKey) {
      if (seenBody[bodyKey]) return false;
      if (preferredForBody[bodyKey] !== entry.rawTitle) return false;
      seenBody[bodyKey] = true;
    }
    return true;
  }).slice(0, MAX_FUZZY_SUGGESTIONS).map(function (entry) {
    return entry.rawTitle + split.suffixPart;
  });
}

function renderFuzzySuggestions(query) {
  var suggestions = getFuzzyReferenceSuggestions(query);
  if (!suggestions.length) return false;
  // Every value is escaped with escapeHTML before it reaches setResultsHint,
  // which renders HTML; suggestions come from the Sefaria title list, and the
  // query is user input.
  var html = "<div class='results-suggestion-wrap'><div class='results-suggestion-title'>No exact match. Related entries in the library:</div><div class='results-suggestion-buttons'>" + suggestions.map(function (suggestion) {
    return "<button type='button' class='results-suggestion-button' data-suggested-query='" + escapeHTML(suggestion) + "'>" + escapeHTML(suggestion) + "</button>";
  }).join('') + "</div></div>";
  setResultsHint(html, true);
  return true;
}

/**
 * Near matches from the title list, as result rows shown alongside the exact
 * ones on EVERY search — not only when nothing else came back. The content
 * search nearly always returns something, so a zero-results-only suggester was
 * a suggester that never ran: "The Torah A Women's Commentary, Deuteronomy
 * 29:9" produced a list of unrelated content hits and no way to the text.
 *
 * Rows are marked isFuzzy and grouped under "Close matches". They are never
 * auto-selected (see maybeAutoSelectSingleResult): a close match is a guess
 * about intent, and one click from the reader is cheaper than a wrong preview.
 */
function buildFuzzyLibraryMatches(query) {
  if (String(query || '').trim().length < 3) return [];
  return getFuzzyReferenceSuggestions(query).map(function (suggestion, index) {
    return {
      key: 'fuzzy-' + index + '-' + suggestion,
      ref: suggestion,
      label: suggestion,
      subtitle: 'Close match',
      typeLabel: 'Library',
      clusterLabel: 'Close matches',
      hasTranslation: true,
      availableLangs: [],
      isFuzzy: true
    };
  });
}

/**
 * The library list with close matches kept at the end: at most `limit` exact
 * rows first, then every close match that is not already one of them. Without
 * this the prepend-and-truncate that each async result group does would push
 * the close matches off the list, or the close matches would crowd out real
 * results.
 */
function mergeLibraryMatchesWithFuzzy(matches, fuzzyMatches, limit) {
  var exact = (matches || []).filter(function (item) { return item && !item.isFuzzy; }).slice(0, limit);
  var seen = {};
  exact.forEach(function (item) { if (item.ref) seen[String(item.ref).trim().toLowerCase()] = true; });
  var fuzzy = (fuzzyMatches || []).filter(function (item) {
    var key = String((item && item.ref) || '').trim().toLowerCase();
    if (!key || seen[key]) return false;
    seen[key] = true;
    return true;
  });
  return exact.concat(fuzzy);
}

function maybeShowZeroResultsSuggestions(input) {
  var hasRawResults = getAllRawResults().length > 0;
  var currentHint = $.trim($('.results-hint').text());
  if (hasRawResults || currentHint) return;

  // Offer near matches from the title list rather than leaving a blank panel.
  // These are real catalogue entries, so each one resolves — but they are
  // presented as suggestions to click, never auto-selected, because a fuzzy
  // match is a guess about intent and the user is the one who knows.
  if (renderFuzzySuggestions(input)) return;

  // Nothing close enough to suggest. Say so, and say what tends to work,
  // instead of rendering an empty results area.
  setResultsHint(
    "<div class='results-suggestion-wrap'><div class='results-suggestion-title'>No results for &ldquo;" +
    escapeHTML(String(input || '')) +
    "&rdquo;</div><div class='results-suggestion-note'>Try a book name on its own (Berakhot), a reference (Genesis 1:1), or a phrase from the text itself.</div></div>",
    true
  );
}

function describeResultLanguages(item) {
  var available = Array.isArray(item && item.availableLangs) ? item.availableLangs : [];
  var unique = [];
  available.forEach(function (lang) {
    var normalized = String(lang || '').toLowerCase().trim();
    if (normalized && unique.indexOf(normalized) < 0) unique.push(normalized);
  });
  if (unique.length === 1) {
    var singleMap = { en: 'EN', he: 'HE', es: 'ES', fr: 'FR', de: 'DE', ru: 'RU', ar: 'AR', pt: 'PT', it: 'IT' };
    return singleMap[unique[0]] || unique[0].toUpperCase();
  }
  if (!unique.length) return 'Single version';
  var labelMap = { en: 'EN', he: 'HE', es: 'ES', fr: 'FR', de: 'DE', ru: 'RU', ar: 'AR', pt: 'PT', it: 'IT' };
  return unique.map(function (lang) { return labelMap[lang] || lang.toUpperCase(); }).join(', ');
}

function getCorpusAccentClass(corpusKey) {
  return corpusColorClassMap[String(corpusKey || '').toLowerCase()] || 'corpus-accent-default';
}


function getCheckedValues(selector) {
  return $(selector).map(function () {
    return $(this).is(':checked') ? $(this).val() : null;
  }).get().filter(Boolean);
}

function updateMultiSelectButtonLabel(dropdownSelector, values, fallbackText, labelMap) {
  labelMap = labelMap || null;
  var labels = values.map(function (value) {
    return labelMap && labelMap[value] ? labelMap[value] : value;
  });
  var text = labels.length ? labels.join(', ') : fallbackText;
  $(dropdownSelector + ' .multi-select-button-text').text(text);
}


function syncCompactTranslationLanguageUI() {
  var selected = getCheckedValues('.translation-language-option');
  var anySelected = !selected.length || $('.translation-language-any').is(':checked');
  var labelMap = { en: 'EN', he: 'HE', es: 'ES', fr: 'FR', de: 'DE', pt: 'PT', ru: 'RU', ar: 'AR', it: 'IT' };
  var label = 'Any';
  if (!anySelected && selected.length) {
    label = selected.slice(0, 2).map(function(lang){ return labelMap[lang] || String(lang || '').toUpperCase(); }).join(', ');
    if (selected.length > 2) label += ' +' + (selected.length - 2);
  }
  // Static spans plus the language label, which goes through escapeHTML.
  $('#translation-language-toggle').html(
    '<span class="latin-part" aria-hidden="true">A</span>' +
    '<span class="alef-part" aria-hidden="true">א</span>' +
    '<span class="translation-language-button-label">' + escapeHTML(label) + '</span>'
  );
}

function updateTranslationLanguageVisibility() {
  var selectedValues = getCheckedValues('.translation-language-option');
  var useAny = $('.translation-language-any').is(':checked') || !selectedValues.length;

  if (useAny) {
    $('.translation-language-any').prop('checked', true);
    $('.translation-language-option').prop('checked', false);
    $('.translation-only-filter').prop('checked', false);
  } else {
    $('.translation-language-any').prop('checked', false);
    $('.translation-only-filter').prop('checked', true);
  }

  syncCompactTranslationLanguageUI();
}

function getSearchParameters() {
  var sortMode = $('#search-sort-mode').length ? ($('#search-sort-mode').val() || 'relevance') : 'relevance';
  var selectedLanguages = getCheckedValues('.translation-language-option');
  var anySelected = $('.translation-language-any').is(':checked') || !selectedLanguages.length;
  return {
    filters: [],
    relevanceSort: sortMode === 'relevance',
    sortMode: sortMode,
    translationOnly: !anySelected,
    translationLanguages: anySelected ? [] : selectedLanguages
  };
}

function normalizeLanguage(version) {
  var suffixLanguageLUT = {
    en: 'English', he: 'Hebrew', ro: 'Romanian', yi: 'Yiddish', fr: 'French', de: 'German',
    es: 'Spanish', pt: 'Portuguese', ru: 'Russian', it: 'Italian', ar: 'Arabic', nl: 'Dutch',
    pl: 'Polish', hu: 'Hungarian', cs: 'Czech', uk: 'Ukrainian', tr: 'Turkish', lad: 'Ladino', su: 'Sundanese'
  };
  var lang = ((version.actualLanguage || version.language || "") + "").toLowerCase().trim();
  var family = (version.languageFamilyName || "").toString().trim();
  var normalizedFamily = family ? family.charAt(0).toUpperCase() + family.slice(1) : "";
  var title = (version.versionTitle || version.shortVersionTitle || '').toString().trim();
  var suffixMatch = title.match(/\[([a-z]{2,3})\]\s*$/i);
  var suffix = suffixMatch ? suffixMatch[1].toLowerCase() : '';
  var suffixLabel = suffixLanguageLUT[suffix] || '';
  var metadataLooksEnglish = ["en", "eng", "english"].indexOf(lang) >= 0 || /english/i.test(family);

  if (["he", "heb", "hebrew"].indexOf(lang) >= 0 || /hebrew/i.test(family)) return { key: "he", label: "HE" };
  if (metadataLooksEnglish) {
    if (suffix && suffix !== 'en' && suffixLabel) return { key: "other:" + suffix, label: suffix.toUpperCase() };
    return { key: "en", label: "EN" };
  }
  if (suffixLabel && normalizedFamily && /english/i.test(normalizedFamily) && suffix !== 'en') return { key: "other:" + suffix, label: suffix.toUpperCase() };
  if (!lang && normalizedFamily) return { key: "other:" + normalizedFamily.toLowerCase(), label: normalizedFamily.slice(0,2).toUpperCase() };
  if (!lang && suffixLabel) return { key: "other:" + suffix, label: suffix.toUpperCase() };
  if (!lang) return { key: "en", label: "EN" };
  return { key: "other:" + lang, label: String(lang).slice(0,2).toUpperCase() };
}

function extractYear(version) {
  var currentYear = (new Date()).getFullYear() + 1;
  var fields = [version.shortVersionTitle, version.versionTitle, version.versionNotes].filter(function (value) { return value; }).map(function (value) { return value.toString(); });
  var candidates = [];
  for (var i = 0; i < fields.length; i++) {
    var matches = fields[i].match(/\b(1\d{3}|20\d{2}|2100)\b/g);
    if (!matches) continue;
    for (var j = 0; j < matches.length; j++) {
      var numeric = parseInt(matches[j], 10);
      if (numeric >= 1000 && numeric <= currentYear) candidates.push(numeric);
    }
  }
  if (!candidates.length) return null;
  return Math.max.apply(null, candidates);
}

</script>
