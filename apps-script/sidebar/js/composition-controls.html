<script>
// Sidebar adapter for the shared composition card component.
// Bridges sidebar hidden-checkbox state and saveSidebarPreference() persistence
// to the generic composition card controller.

function _sidebarCompositionGetState() {
  var transliterationOn = $('.include-transliteration').is(':checked');
  var scheme = transliterationOn ? getSidebarTransliterationScheme() : 'none';
  return {
    vowelsMode: ccVowelsMode($('.wants-vowels').is(':checked'), effectivePreferences.nekudot_filter),
    cantillationMode: ccCantillationMode($('.wants-cantillation').is(':checked'), effectivePreferences.teamim_filter),
    hebrewPunctuationOn: $('.wants-hebrew-punctuation').is(':checked'),
    translationPunctuationOn: $('.wants-translation-punctuation').is(':checked'),
    transliterationOn: transliterationOn,
    scheme: scheme,
    linkOn: $('.insert-sefaria-link').is(':checked'),
    hebrewLinkOn: $('.insert-hebrew-sefaria-link').is(':checked'),
    linesOn: $('.wants-pesukim').is(':checked'),
    detailsOn: $('.include-translation-source-info').is(':checked'),
    emphasisMode: ccNormalizeEmphasisMode($('.source-emphasis-mode').val()),
    fonts: ccFontStateFrom(function (key) { return effectivePreferences[key]; })
  };
}

// The font buttons (text and title fonts): like the switches, a session
// override in the Texts tab (insertReference reads the session's fonts), saved
// to the account elsewhere. `prefix` is the preference's (hebrew, source_title…).
function _sidebarCompositionOnFontChange(prefix, field, value) {
  var key = prefix + (field === 'size' ? '_font_size' : '_font');
  var payload = {};
  payload[key] = value;
  // Shown at once; the save's answer confirms it.
  effectivePreferences[key] = value;
  saveSidebarPreference(payload, function () { updateCompositionCard(); });
}

function _sidebarCompositionOnToggle(key) {
  if (key === 'hebrewPunctuation') {
    var $el = $('.wants-hebrew-punctuation');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      hebrew_punctuation: $el.is(':checked')
    }, function () {
      updateCompositionCard();
      if (hasResolvedReference && data && data.ref) refreshSelectedResult();
    });
  } else if (key === 'translationPunctuation') {
    var $el = $('.wants-translation-punctuation');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      translation_punctuation: $el.is(':checked')
    }, function () {
      updateCompositionCard();
      if (hasResolvedReference && data && data.ref) refreshSelectedResult();
    });
  } else if (key === 'translit') {
    var $el = $('.include-transliteration');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      include_transliteration_default: $el.is(':checked')
    }, function () {
      updateCompositionCard();
      if (hasResolvedReference && data && data.ref) refreshSelectedResult();
    });
  } else if (key === 'link') {
    var $el = $('.insert-sefaria-link');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      insert_sefaria_link_default: $el.is(':checked')
    }, function () {
      updateCompositionCard();
    });
  } else if (key === 'hebrewLink') {
    var $el = $('.insert-hebrew-sefaria-link');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      insert_hebrew_sefaria_link_default: $el.is(':checked')
    }, function () {
      updateCompositionCard();
    });
  } else if (key === 'lines') {
    var $el = $('.wants-pesukim');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      show_line_markers_default: $el.is(':checked')
    });
  } else if (key === 'details') {
    var $el = $('.include-translation-source-info');
    $el.prop('checked', !$el.is(':checked'));
    saveSidebarPreference({
      include_translation_source_info: $el.is(':checked')
    });
  }
  if (typeof refreshSidebarLivePreview === 'function') refreshSidebarLivePreview();
}

// The three-way choices. Vowels and Cantillation are fetch-time filters, so
// the selected text is fetched again; B&I is applied at insert.
function _sidebarCompositionOnChoice(key, value) {
  var payload;
  if (key === 'vowels') {
    payload = ccVowelsPrefs(value);
    $('.wants-vowels').prop('checked', payload.nekudot === 'true');
  } else if (key === 'cantillation') {
    payload = ccCantillationPrefs(value);
    $('.wants-cantillation').prop('checked', payload.teamim === 'true');
  } else if (key === 'emphasis') {
    $('.source-emphasis-mode').val(ccNormalizeEmphasisMode(value));
    saveSidebarPreference({ source_emphasis_mode: $('.source-emphasis-mode').val() });
    if (typeof refreshSidebarLivePreview === 'function') refreshSidebarLivePreview();
    return;
  } else {
    return;
  }
  // Shown at once; the save's answer confirms it.
  Object.keys(payload).forEach(function (k) { effectivePreferences[k] = payload[k]; });
  saveSidebarPreference(payload, function () {
    updateCompositionCard();
    if (hasResolvedReference && data && data.ref) refreshSelectedResult();
  });
  if (typeof refreshSidebarLivePreview === 'function') refreshSidebarLivePreview();
}

function _sidebarCompositionOnSchemeSelect(value) {
  if (value === 'none') {
    $('.include-transliteration').prop('checked', false);
    effectivePreferences.transliteration_scheme = getSidebarTransliterationScheme();
    saveSidebarPreference({ include_transliteration_default: false }, function () {
      effectivePreferences.transliteration_scheme = getSidebarTransliterationScheme();
      updateCompositionCard();
      if (hasResolvedReference && data && data.ref) refreshSelectedResult();
    });
  } else {
    $('.include-transliteration').prop('checked', true);
    effectivePreferences.transliteration_scheme = value;
    saveSidebarPreference({ include_transliteration_default: true, transliteration_scheme: value }, function () {
      effectivePreferences.transliteration_scheme = value;
      updateCompositionCard();
      if (hasResolvedReference && data && data.ref) refreshSelectedResult();
    });
  }
  if (typeof refreshSidebarLivePreview === 'function') refreshSidebarLivePreview();
}

// Thin wrappers so sidebar_bootstrap.html and other callers don't need to change.
function updateSidebarCompositionCard() {
  updateCompositionCard();
}

function refreshCompositionAndPreview() {
  updateCompositionCard();
  if (typeof refreshSidebarLivePreview === 'function') refreshSidebarLivePreview();
}

function bindSidebarCompositionCard() {
  initCompositionCard({
    containerId: 'composition-card-container',
    getState: _sidebarCompositionGetState,
    onToggle: _sidebarCompositionOnToggle,
    onSchemeSelect: _sidebarCompositionOnSchemeSelect,
    onChoice: _sidebarCompositionOnChoice,
    onFontChange: _sidebarCompositionOnFontChange,
    onMoreFontSettings: function () { google.script.run.preferencesPopup(); }
  });
}
</script>
