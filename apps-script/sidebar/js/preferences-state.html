<script>
// Sidebar global state declarations
// no need for $(document).ready() since this script is loaded at the end of the page
// Input stays enabled; legacy disabling removed.
var data = {};
var titles = [];
var latestResolveRequestId = 0;
var latestQueryRequestId = 0;
var latestDirectRefValidationRequestId = 0;
var selectedResultKey = null;
var selectedResultSummary = null;
var selectedRefValue = null;
var queryState = { rawLibraryMatches: [], rawSearchResults: [], libraryMatches: [], searchResults: [] };
var resultPostProcessState = { availableCorpora: [], removedCorpora: [], restoredExcluded: [] };
var resultsCollapsed = false;
var pendingPreferredVersions = null;
var translationAvailabilityByRef = {};
// Set by updateSuggestion for the version list it built, so an availability
// answer arriving later (or a preference change) can re-render that list.
var activeTranslationOptions = null;
var translationAvailabilityRequested = {};
var hasResolvedReference = false;
var searchDebounceHandle = null;
var keyboardResultIndex = -1;
var resultsLoading = false;
// Enough to cover a near-miss plus a couple of genuine alternatives, few
// enough that the panel still reads as "did you mean" rather than a result set
// — the point is to avoid guessing the user's intent for them.
var MAX_FUZZY_SUGGESTIONS = 5;
var preferredTranslationLanguage = "en";
var sidebarSessionId = null;
var accountPreferences = {};
var sessionPreferences = {};
var effectivePreferences = {};

function isAdvancedSessionMode() {
  return appMode === 'texts';
}

function hasSessionOverrides() {
  return Object.keys(sessionPreferences || {}).length > 0;
}

function syncSessionOverrideButtons() {
  var isTexts = isAdvancedSessionMode();
  var hasSelectedTextResult = isTexts && !!selectedResultKey;
  $('.session-override-actions').toggle(isTexts);
  $('.reset-session-overrides-button, .save-session-defaults-button').prop('disabled', !isTexts || !hasSessionOverrides());
  $('.inline-session-settings').toggle(isTexts && hasSelectedTextResult);
  $('#open-session-library').prop('disabled', false).attr('aria-disabled', 'false');
}

function applyEffectivePreferencesToUI() {
  mergePreferenceDefaults(effectivePreferences);
  syncDisplayModeCards();
  syncLayoutCards();
  updateBilingualLayoutVisibility();
  updateTranslationDetailsVisibility();
  updateHebrewOptionsVisibility();
  updateVersionControlsVisibility();
  updateTransliterationVisibility();
  updateTranslationLanguageVisibility();
  syncSessionOverrideButtons();
  syncExperimentalAvailability();
  updateQuickActionsForMode();
  if (typeof updateCompositionCard === 'function') updateCompositionCard();
  // Hidden languages / "Show unavailable translations" shape the version list.
  if (activeTranslationOptions) activeTranslationOptions.refresh();
}

function saveAccountPreference(payload, onDone) {
  google.script.run.withSuccessHandler(function (updated) {
    accountPreferences = clonePlainObject(updated || accountPreferences);
    effectivePreferences = isAdvancedSessionMode()
      ? mergePreferenceLayers(accountPreferences, sessionPreferences)
      : mergePreferenceLayers(accountPreferences, {});
    applyEffectivePreferencesToUI();   // <-- add this
    if (typeof onDone === 'function') onDone(updated);
  }).setAccountPreferences(payload || {});
}

// Session saves go to the server one at a time. setSidebarSessionState reads,
// merges and writes the whole session, so two saves in flight at once (two
// quick clicks in Insertion Options) could each read the old session and the
// later write would drop the earlier change: a Vowels choice followed by any
// other click was lost. And each answer re-applied its own snapshot to the
// switches, flipping the second click back on screen until its answer came.
// Now a change shows at once, changes made while a save is in flight wait and
// go together in the next one, and the switches are re-read from the server's
// answer only when nothing is left to send.
var sessionSaveQueue = { pending: null, callbacks: [], inFlight: false };

function saveSessionPreference(payload, onDone) {
  var change = payload || {};
  sessionPreferences = Object.assign({}, sessionPreferences, change);
  effectivePreferences = mergePreferenceLayers(accountPreferences, sessionPreferences);
  sessionSaveQueue.pending = Object.assign(sessionSaveQueue.pending || {}, change);
  if (typeof onDone === 'function') sessionSaveQueue.callbacks.push(onDone);
  // Until the bootstrap gives this sidebar its session, a change waits here.
  if (sidebarSessionId) flushSessionSaves_();
}

// The session the bootstrap gives this sidebar, with any change made before it
// arrived kept on top; the caller re-draws the switches and sends those
// changes. A change made in those first moments used to be dropped, and the
// bootstrap then put the saved default back on screen: Stacked, picked as the
// sidebar opened, was inserted Right-Left and showed Right-Left (BUG-002).
function adoptSidebarSession(sessionId, sessionState) {
  sidebarSessionId = sessionId || null;
  sessionPreferences = Object.assign(clonePlainObject(sessionState || {}), sessionSaveQueue.pending || {});
  return !!sessionSaveQueue.pending;
}

function flushSessionSaves_() {
  var queue = sessionSaveQueue;
  if (queue.inFlight || !queue.pending) return;
  var batch = queue.pending;
  var callbacks = queue.callbacks;
  queue.pending = null;
  queue.callbacks = [];
  queue.inFlight = true;

  function finish(updated) {
    queue.inFlight = false;
    if (!queue.pending) {
      sessionPreferences = clonePlainObject(updated || sessionPreferences);
      effectivePreferences = mergePreferenceLayers(accountPreferences, sessionPreferences);
      applyEffectivePreferencesToUI();
    }
    callbacks.forEach(function (callback) { callback(updated); });
    flushSessionSaves_();
  }

  google.script.run
    .withSuccessHandler(finish)
    .withFailureHandler(function () {
      showSidebarToast('A setting could not be saved for this session. Try again.');
      finish(null);
    })
    .setSidebarSessionState(sidebarSessionId, batch);
}

function saveSidebarPreference(payload, onDone, forceAccountSave) {
  if (forceAccountSave || !isAdvancedSessionMode()) {
    saveAccountPreference(payload, onDone);
  } else {
    saveSessionPreference(payload, onDone);
  }
}

function resetSessionOverrides(onDone) {
  if (!sidebarSessionId) return;
  google.script.run.withSuccessHandler(function () {
    sessionPreferences = {};
    effectivePreferences = mergePreferenceLayers(accountPreferences, {});
    applyEffectivePreferencesToUI();
    if (hasResolvedReference && data && data.ref) refreshSelectedResult();
    updateModeDependentSections();
    if (typeof onDone === 'function') onDone();
  }).clearSidebarSessionState(sidebarSessionId);
}

function saveSessionAsDefaults(onDone) {
  if (!sidebarSessionId) return;
  google.script.run.withSuccessHandler(function (updated) {
    accountPreferences = clonePlainObject(updated || accountPreferences);
    sessionPreferences = {};
    effectivePreferences = mergePreferenceLayers(accountPreferences, {});
    applyEffectivePreferencesToUI();
    updateModeDependentSections();
    if (typeof onDone === 'function') onDone(updated);
  }).saveSidebarSessionAsAccountDefaults(sidebarSessionId);
}

function mergePreferenceDefaults(preferences) {
  preferences = preferences || {};
  // Stored values are strings; an unset key falls back to the boolean default.
  $('.include-translation-source-info').prop('checked', String(preferences.include_translation_source_info) === "true");
  $('.wants-vowels').prop('checked', String(preferences.nekudot) !== "false");
  $('.wants-cantillation').prop('checked', String(preferences.teamim) !== "false");
  $('.wants-hebrew-punctuation').prop('checked', String(preferences.hebrew_punctuation) !== "false");
  $('.wants-translation-punctuation').prop('checked', String(preferences.translation_punctuation) !== "false");
  $('.include-transliteration').prop('checked', String(preferences.include_transliteration_default) === "true");
  $('.insert-sefaria-link').prop('checked', String(preferences.insert_sefaria_link_default) !== "false");
  // The source title follows the translation title until it is set apart.
  var hebrewLink = preferences.insert_hebrew_sefaria_link_default;
  $('.insert-hebrew-sefaria-link').prop('checked', String(hebrewLink == null ? preferences.insert_sefaria_link_default : hebrewLink) !== "false");
  $('.wants-pesukim').prop('checked', String(preferences.show_line_markers_default) !== "false");
  $('.source-emphasis-mode').val(ccNormalizeEmphasisMode(preferences.source_emphasis_mode));
  $('.output-mode-selection').val(preferences.output_mode_default || 'both');
  $('.bilingual-layout-selection').val(preferences.bilingual_layout_default || 'he-right');
  $('.wants-aligned-rows').prop('checked', String(preferences.bilingual_aligned_rows) === "true");
  $('.translation-only-filter').prop('checked', preferences.last_translation_only_filter === "true");
  $('.search-sort-select').val(preferences.last_search_sort_mode || 'relevance');
  $('.wants-relevance').prop('checked', String(preferences.last_search_relevance_sort) !== "false");

  // Apply Voices workflow defaults
  var voicesInsertMode = preferences.voices_insert_mode_default || 'reference';
  $('#voices-insert-mode .icon-mode-card').each(function() {
    var active = $(this).data('value') === voicesInsertMode;
    $(this).toggleClass('is-active', active).attr('aria-checked', active ? 'true' : 'false');
  });

  // Apply Lexicon workflow default — sync to radio chip group
  var lexiconInsertMode = preferences.lexicon_insert_mode_default || 'entry';
  $('.lexicon-format-btn').each(function () {
    var active = $(this).data('value') === lexiconInsertMode;
    $(this).toggleClass('is-active', active).attr('aria-checked', active ? 'true' : 'false');
  });

  // Sync voices transliteration dropdown to saved preference
  var voicesTranslit = preferences.voices_translit_default || 'none';
  $('#voices-translit-menu').find('.cc-translit-option').each(function() {
    $(this).toggleClass('is-selected', $(this).attr('data-value') === voicesTranslit);
  });
  var translitLabel = voicesTranslit === 'none' ? 'None' : ($('#voices-translit-menu .cc-translit-option[data-value="' + voicesTranslit + '"]').text() || voicesTranslit);
  $('#voices-translit-trigger').text(translitLabel + ' ▾').toggleClass('is-none', voicesTranslit === 'none');

  preferredTranslationLanguage = String(preferences.preferred_translation_language || 'en').toLowerCase();
  var savedTranslationLanguages = parseStoredArrayPreference(preferences.last_translation_languages, ['en']);
  $('.translation-language-option').prop('checked', false);
  var useAnyTranslationLanguage = !savedTranslationLanguages.length || savedTranslationLanguages.indexOf('any') >= 0;
  $('.translation-language-any').prop('checked', useAnyTranslationLanguage);
  if (!useAnyTranslationLanguage) {
    savedTranslationLanguages.forEach(function (value) {
      $('.translation-language-option[value="' + value.replace(/([\"'])/g, '\$1') + '"]').prop('checked', true);
    });
  }
  applyHiddenTranslationLanguages(preferences.hidden_translation_languages);
}

// Leave the languages hidden in Preferences → Search out of the search
// language filter. A hidden language that was ticked is unticked, so it can't
// filter results from a row nobody can see; with none left ticked the filter
// goes back to Any (updateTranslationLanguageVisibility).
function applyHiddenTranslationLanguages(storedValue) {
  var hidden = normalizeHiddenTranslationLanguages(storedValue);
  $('.translation-language-option').each(function () {
    var isHidden = hidden.indexOf(String($(this).val() || '').toLowerCase()) >= 0;
    $(this).closest('.translation-language-row').toggleClass('is-pref-hidden', isHidden);
    if (isHidden) $(this).prop('checked', false);
  });
  if (!$('.translation-language-option:checked').length) $('.translation-language-any').prop('checked', true);
}

function getSidebarTransliterationScheme() {
  return String((effectivePreferences && effectivePreferences.transliteration_scheme) || 'simple_english');
}

// getSidebarTransliterationLabel() removed — label data is now in
// CC_TRANSLIT_LABELS in composition_card_shared.html.
</script>
