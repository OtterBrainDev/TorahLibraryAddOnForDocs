<script>
// Tracks which translation version titles the user has selected, in the order they clicked them.
// DOM order is the fallback (what $select.val() returns); this array gives selection-order insertion.
var orderedTranslationVersions = [];
// The ref orderedTranslationVersions belongs to. Re-rendering the same ref (a
// Layout tray change, another source edition) keeps a multi-selection; a new
// ref starts over.
var orderedTranslationVersionsRef = '';

// The translation version list. The source-edition list carries the
// .translation-version-select class too (for its styling), so a lookup by the
// class alone reaches both lists: that wrote translations into the source
// editions and made a source-edition click reset the translations.
function translationVersionSelect() {
  return $('.translation-version-select').not('.he-version-selection');
}

// Multi-select is only meaningful when the output will be stacked (he-top) or translation-only (en),
// because those are the two layouts where inserting several translations in sequence makes sense.
function translationMultiSelectAllowed() {
  var outputMode = $('.output-mode-selection').val();
  var layout = $('.bilingual-layout-selection').val();
  return outputMode === 'en' || (outputMode === 'both' && layout === 'he-top');
}

// updateSuggestion builds the translation list for the current Display and
// Layout. When they change without a rebuild, rebuild: that also collapses a
// multi-selection to its first pick and loads it.
function applyMultiSelectMode() {
  var allowMulti = translationMultiSelectAllowed();
  var $select = translationVersionSelect();
  if (!$select.length) return;

  if (allowMulti !== !!$select.prop('multiple')) {
    if (hasResolvedReference && data && data.ref && typeof refreshSidebarLivePreview === 'function') {
      refreshSidebarLivePreview();
      return;
    }
    $select.prop('multiple', allowMulti);
  }

  // Update the hint text below the select.
  var $hint = $('.translation-multi-hint');
  if (!$hint.length) {
    $hint = $('<p class="translation-multi-hint version-multi-hint"></p>');
    $select.after($hint);
  }
  if (allowMulti) {
    $hint.text('Click to add or remove a translation. Several are inserted in the order you pick them.').show();
  } else {
    $hint.hide();
  }
}

// What a multi-version insert will put in the document, in order, in place of
// the preview (which shows one translation).
function updateMultiSelectPreviewNotice() {
  var count = orderedTranslationVersions.length;
  if (count <= 1) return;
  var $notice = $("<div class='preview-state-message preview-multi-notice'></div>");
  $notice.append($('<strong></strong>').text(count + ' translations selected. They will be inserted in this order:'));
  var $list = $("<ol class='preview-multi-list'></ol>");
  orderedTranslationVersions.forEach(function (versionTitle) {
    // The list's label, even for a version the filter box hides.
    var label = activeTranslationOptions && activeTranslationOptions.label ? activeTranslationOptions.label(versionTitle) : '';
    $list.append($('<li></li>').text(normalizeOptionText(label || versionTitle)));
  });
  $notice.append($list);
  $notice.append($('<span></span>').text('The preview shows one translation at a time: remove the others to preview it.'));
  $('.suggestions').empty().append($notice);
}

// Called after a multi-version insert reports translations the server skipped
// for having no text on this ref: disable them in the list so they can't be
// picked again, and drop them from the current selection.
function markTranslationsUnavailable(ref, versionTitles) {
  var $select = translationVersionSelect();
  (versionTitles || []).forEach(function (vt) {
    translationAvailabilityByRef[ref + '::' + vt] = false;
    $select.find('option').filter(function () { return $(this).val() === vt; }).each(function () {
      if (!shouldShowUnavailableTranslations()) {
        $(this).remove();
        return;
      }
      var label = $(this).text() + ' – unavailable for this ref';
      $(this).prop('selected', false).prop('disabled', true).addClass('translation-unavailable').text(label).attr('title', label);
    });
  });
  orderedTranslationVersions = orderedTranslationVersions.filter(function (vt) {
    return (versionTitles || []).indexOf(vt) < 0;
  });
  // One translation (or none) left: select it, or the first one listed, and
  // preview it, so the list never ends with nothing selected.
  if (orderedTranslationVersions.length <= 1 && activeTranslationOptions && activeTranslationOptions.ref === ref) {
    activeTranslationOptions.select(orderedTranslationVersions[0] || $select.find('option:not(:disabled)').first().val() || '');
    return;
  }
  var displayText = orderedTranslationVersions.length + ' versions selected';
  $('.translation-selected-display').not('.he-selected-display').text(displayText).attr('title', displayText);
  updateMultiSelectPreviewNotice();
}

function updatePesukimAvailability(response) {
  var supportsLineMarkers = !!(response && (Array.isArray(response.he) || Array.isArray(response.text) || response.lineMarkersAvailable === true));
  $('.pesukim-wrapper').toggle(supportsLineMarkers);
  $('.wants-pesukim').prop('disabled', !supportsLineMarkers);
  if (!supportsLineMarkers) {
    $('.wants-pesukim').prop('checked', false);
    $('.pesukim-help').text('Line markers are unavailable for this selection (single-block text).');
  } else {
    if (!$('.wants-pesukim').prop('checked')) {
      $('.wants-pesukim').prop('checked', true);
    }
    $('.pesukim-help').text('Applies to segmented refs (e.g., verse/line ranges).');
  }
}

function isResolvedReference(response) {
  return !!(response && response.ref && response.indexTitle && !response.error);
}

function hasRenderableText(value) {
  if (Array.isArray(value)) return value.some(function (part) { return hasRenderableText(part); });
  if (value === null || value === undefined) return false;
  var stripped = String(value).replace(/<[^>]*>/g, '').replace(/&nbsp;/gi, ' ').trim();
  return stripped.length > 0;
}

function buildDepthPrompt(response) {
  var sectionNames = (response && Array.isArray(response.sectionNames)) ? response.sectionNames.filter(Boolean) : [];
  if (sectionNames.length >= 2) return "Enter " + sectionNames[0] + " and optionally a " + sectionNames[1] + ". Specify a range with '-'.";
  if (sectionNames.length === 1) return "Enter " + sectionNames[0] + ". Specify a range with '-'.";
  return "Enter a valid reference to insert.";
}

function getResolvedNodeState(response) {
  var resolved = isResolvedReference(response);
  var hasText = hasRenderableText(response && response.text);
  var hasHebrew = hasRenderableText(response && response.he);
  var isInsertable = resolved && (hasText || hasHebrew);
  var isStructural = resolved && !isInsertable;
  return {
    resolved: resolved,
    hasText: hasText,
    hasHebrew: hasHebrew,
    isInsertable: isInsertable,
    isStructural: isStructural,
    prompt: buildDepthPrompt(response)
  };
}

// A version entry's language as a TRANSLATION_LANGUAGE_CATALOG code ('en',
// 'yi', ...), or '' when it isn't one the catalog knows. normalizeLanguage
// keys a non-English translation as 'other:<code>' (or 'other:<family name>'
// when Sefaria gives no code).
function translationEntryLanguageCode(entry) {
  var key = String((entry && entry.languageKey) || '').toLowerCase();
  if (key === 'en' || key === 'he') return key;
  var raw = key.indexOf('other:') === 0 ? key.slice(6) : key;
  var match = TRANSLATION_LANGUAGE_CATALOG.filter(function (lang) {
    return lang.code === raw || lang.label.toLowerCase() === raw;
  })[0];
  return match ? match.code : '';
}

function shouldShowUnavailableTranslations() {
  return String((effectivePreferences || {}).show_unavailable_translations) === 'true';
}

// The translations the version list offers at all, before the filter box: not
// in a language hidden in Preferences → Search, and — unless "Show unavailable
// translations" is on — not known to have no text for this ref. If hiding
// languages would leave nothing, the language setting is set aside rather than
// offering an empty list. Refreshes each item's availableForRef from
// translationAvailabilityByRef, which fills in after the list is first built.
function listTranslationItems(items, ref, preferences) {
  items.forEach(function (item) {
    var key = ref + '::' + item.value;
    if (Object.prototype.hasOwnProperty.call(translationAvailabilityByRef, key)) item.availableForRef = translationAvailabilityByRef[key];
  });
  var showUnavailable = String((preferences || {}).show_unavailable_translations) === 'true';
  var hiddenLanguages = normalizeHiddenTranslationLanguages((preferences || {}).hidden_translation_languages);
  var byAvailability = items.filter(function (item) {
    return showUnavailable || item.availableForRef !== false;
  });
  var byLanguage = byAvailability.filter(function (item) {
    return !item.languageCode || hiddenLanguages.indexOf(item.languageCode) < 0;
  });
  return byLanguage.length ? byLanguage : byAvailability;
}

// Ask the server which translations have text for this exact ref; Sefaria's
// version list is the whole book's. A failed or unusable answer changes
// nothing: no translation is ever hidden on a lookup that didn't work.
function requestTranslationAvailability(ref) {
  if (!ref || translationAvailabilityRequested[ref]) return;
  translationAvailabilityRequested[ref] = true;
  google.script.run.withSuccessHandler(function (result) {
    var versions = result && result.versions;
    if (!versions || typeof versions !== 'object') return;
    Object.keys(versions).forEach(function (versionTitle) {
      var key = ref + '::' + versionTitle;
      // What a fetch of that version found (text, no text, another version
      // substituted) is first-hand; keep it over the summary.
      if (Object.prototype.hasOwnProperty.call(translationAvailabilityByRef, key)) return;
      translationAvailabilityByRef[key] = versions[versionTitle] === true;
    });
    if (activeTranslationOptions && activeTranslationOptions.ref === ref) activeTranslationOptions.refresh();
  }).withFailureHandler(function () {
    // Unknown availability: leave the list as it is, and allow a retry later.
    delete translationAvailabilityRequested[ref];
  }).getTranslationAvailability(ref);
}

function buildVersionModel(dataIn) {
  var versions = Array.isArray(dataIn.versions) ? dataIn.versions : [];
  var seen = {};
  var normalized = [];
  versions.forEach(function (version, index) {
    var safeVersion = version || {};
    var language = normalizeLanguage(safeVersion);
    var versionTitle = safeVersion.versionTitle || safeVersion.shortVersionTitle || ("Untitled version #" + (index + 1));
    var dedupeKey = language.key + "::" + versionTitle + "::" + (safeVersion.versionSource || "");
    if (seen[dedupeKey]) return;
    seen[dedupeKey] = true;
    normalized.push({
      index: index,
      versionTitle: versionTitle,
      label: safeVersion.shortVersionTitle || safeVersion.versionTitle || versionTitle,
      fullTitle: safeVersion.versionTitle || versionTitle,
      languageKey: language.key,
      languageLabel: language.label,
      direction: safeVersion.direction,
      priority: Number(safeVersion.priority) || 0,
      isPrimary: !!safeVersion.isPrimary,
      year: extractYear(safeVersion)
    });
  });
  return normalized;
}

function sortVersionEntries(entries) {
  return entries.slice().sort(function (a, b) {
    if (a.year !== null && b.year !== null && a.year !== b.year) return b.year - a.year;
    if (a.year !== null && b.year === null) return -1;
    if (a.year === null && b.year !== null) return 1;
    var left = normalizeOptionText(a.fullTitle || a.label || a.versionTitle).toLowerCase();
    var right = normalizeOptionText(b.fullTitle || b.label || b.versionTitle).toLowerCase();
    var alpha = left.localeCompare(right);
    if (alpha !== 0) return alpha;
    if (a.priority !== b.priority) return b.priority - a.priority;
    return a.index - b.index;
  });
}

function languagePriorityKey(label) {
  var value = String(label || '').trim().toLowerCase();
  if (!value) return 2;
  if (value === preferredTranslationLanguage || (preferredTranslationLanguage === 'en' && value === 'english')) return 0;
  if (value === 'english' || value === 'en') return 1;
  return 2;
}

// ---- Bold & italics in the preview ------------------------------------------
//
// Keep / Drop / Bold only are applied by the insert, to the translation only,
// once it is in the document (applyTypographyToParagraph, server/insertion.gs).
// The preview showed Sefaria's markup as fetched, so with "Bold only" it showed
// commentary that the insert then removed (BUG-001). For Drop and Bold only the
// preview's translation is now read the way the insert reads it (the segments
// joined as formatDataForPesukim joins them, then insertRichTextFromHTML's
// rules) and Bold only applies the insert's own plan. Each mirror below names
// the server function it follows; preview-emphasis.test.js runs both on the
// same input. Like the rest of the preview, it shows no line numbers or
// chapter headings. Keep still renders the sanitized markup as before.

var PREVIEW_HTML_ENTITIES = {
  amp: '&', lt: '<', gt: '>', quot: '"', apos: "'",
  nbsp: ' ', ensp: ' ', emsp: ' ', thinsp: ' ', hairsp: ' ',
  zwnj: '‌', zwj: '‍', lrm: '‎', rlm: '‏',
  ndash: '–', mdash: '—', hellip: '…', middot: '·', bull: '•',
  ldquo: '"', rdquo: '"', lsquo: "'", rsquo: "'", laquo: '«', raquo: '»',
  shy: ''
};

/** decodeHTMLEntities (server/utils.gs). */
function decodePreviewEntities(text) {
  if (!text || typeof text !== 'string') return text;
  var unDoubled = text.replace(/&amp;(nbsp|ensp|emsp|thinsp|hairsp|zwnj|zwj|lrm|rlm|shy);/gi, '&$1;');
  return unDoubled.replace(/&(#x[0-9a-fA-F]+|#\d+|[a-zA-Z][a-zA-Z0-9]*);/g, function (match, body) {
    if (body[0] === '#') {
      var code = body[1] === 'x' || body[1] === 'X' ? parseInt(body.slice(2), 16) : parseInt(body.slice(1), 10);
      if (!(code > 0) || code > 0x10FFFF) return match;
      if (code === 0xA0) return ' ';
      return String.fromCodePoint(code);
    }
    var name = body.toLowerCase();
    return Object.prototype.hasOwnProperty.call(PREVIEW_HTML_ENTITIES, name) ? PREVIEW_HTML_ENTITIES[name] : match;
  });
}

/**
 * The translation's segments as one string, joined the way formatDataForPesukim
 * (server/text-processing.gs) joins them: a line each with line numbers on,
 * run together with a space otherwise. The numbers themselves are left out.
 */
function joinPreviewTranslation(text, lineMarkers) {
  if (!Array.isArray(text)) return String(text == null ? '' : text);
  var verses = [];
  text.forEach(function (item) {
    if (Array.isArray(item)) item.forEach(function (verse) { verses.push(verse); });
    else verses.push(item);
  });
  var out = '';
  verses.forEach(function (verse) {
    var value = String(verse == null ? '' : verse);
    out = lineMarkers ? out + value + '\n' : out + (out ? ' ' : '') + value;
  });
  return out;
}

/**
 * The text and its per-character bold / italic, read as insertRichTextFromHTML
 * (server/insertion.gs) reads Sefaria's markup: each <b> tag toggles bold,
 * <strong> and <i> toggle too (with Extended Gemara on, only inside bold), <br>
 * is a line break, and a <sup> footnote marker is skipped up to the end of its
 * footnote.
 */
function readPreviewEmphasis(html, extendedGemara) {
  var parts = String(html || '').split(/(<\/?[a-zA-Z]+[^>]*>)/g);
  var out = { text: '', bold: [], italic: [] };
  var bolded = false, italicized = false, inFootnote = false, footnoteDepth = 0;
  function add(snippet) {
    var decoded = decodePreviewEntities(snippet);
    for (var c = 0; c < decoded.length; c++) {
      out.text += decoded[c];
      out.bold.push(bolded);
      out.italic.push(italicized);
    }
  }
  for (var i = 0; i < parts.length; i++) {
    var word = parts[i];
    if (inFootnote) {
      if (word === '<i class="footnote">' || word === '<i>') {
        footnoteDepth++;
      } else if (word === '</i>') {
        footnoteDepth--;
        if (footnoteDepth === 0) inFootnote = false;
      }
      continue;
    }
    if (i % 2 === 1) {
      var tagName = /^<\/?([a-zA-Z]+)/.exec(word)[1].toLowerCase();
      if (tagName === 'b') bolded = !bolded;
      else if (tagName === 'strong') { if (!extendedGemara || bolded) bolded = !bolded; }
      else if (tagName === 'i') { if (!extendedGemara || bolded) italicized = !italicized; }
      else if (tagName === 'br') add('\n');
      else if (tagName === 'sup') { inFootnote = true; footnoteDepth = 0; }
      continue;
    }
    add(word);
  }
  return out;
}

var PREVIEW_EMPHASIS_LINE_BREAK = /[\n\r\u000b]/;
var PREVIEW_EMPHASIS_LINE_MARKER = /^[ \t]*\([^)\n\r\u000b]*\)[ \t]*/;
var PREVIEW_EMPHASIS_WORD_CHAR = /[\p{L}\p{N}]/u;
var PREVIEW_EMPHASIS_SPACE = /[ \t ]/;

/** planEmphasisOnlyEdits_ (server/insertion.gs), rule for rule. */
function planPreviewEmphasisOnlyEdits(fullText, runs, keepLines) {
  var text = String(fullText || '');
  var n = text.length;
  if (!n || !Array.isArray(runs) || !runs.length) return [];

  var keep = new Array(n).fill(false);
  var kept = 0;
  runs.forEach(function (run) {
    var from = Math.max(0, run.start);
    var to = Math.min(n - 1, run.end);
    if (!text.slice(from, to + 1).trim()) return;
    for (var i = from; i <= to; i++) keep[i] = true;
    kept++;
  });
  if (!kept) return [];

  var edits = [];
  var hasWordChar = function (from, to) {
    return PREVIEW_EMPHASIS_WORD_CHAR.test(text.slice(from, to + 1));
  };

  var lines = [];
  var lineStart = 0;
  while (lineStart <= n) {
    var lineEnd = lineStart;
    while (lineEnd < n && !PREVIEW_EMPHASIS_LINE_BREAK.test(text[lineEnd])) lineEnd++;
    var emphasized = false;
    for (var i = lineStart; i < lineEnd; i++) {
      if (keep[i]) { emphasized = true; break; }
    }
    var whole = Array.isArray(keepLines) && keepLines.indexOf(text.slice(lineStart, lineEnd).trim()) >= 0;
    lines.push({
      start: lineStart,
      end: lineEnd,
      emphasized: emphasized && !whole,
      removed: !emphasized && !whole && text.slice(lineStart, lineEnd).trim() !== ''
    });
    lineStart = lineEnd + 1;
  }

  for (var l = 0; l < lines.length; l++) {
    if (!lines[l].removed) continue;
    var first = l;
    while (l + 1 < lines.length && lines[l + 1].removed) l++;
    if (l + 1 < lines.length) {
      edits.push({ start: lines[first].start, end: lines[l + 1].start - 1, insert: '' });
    } else {
      edits.push({ start: Math.max(0, lines[first].start - 1), end: lines[l].end - 1, insert: '' });
    }
  }

  lines.forEach(function (line) {
    if (!line.emphasized) return;
    var end = line.end;
    var marker = PREVIEW_EMPHASIS_LINE_MARKER.exec(text.slice(line.start, end));
    var contentStart = line.start + (marker ? marker[0].length : 0);
    var i = contentStart;
    while (i < end) {
      if (keep[i]) { i++; continue; }
      var gapStart = i;
      while (i < end && !keep[i]) i++;
      var gapEnd = i - 1;
      if (!hasWordChar(gapStart, gapEnd)) continue;

      var interior = gapStart > contentStart && gapEnd < end - 1;
      var spacedAlready = interior &&
        (PREVIEW_EMPHASIS_SPACE.test(text[gapStart - 1]) || PREVIEW_EMPHASIS_SPACE.test(text[gapEnd + 1]));
      if (!interior || spacedAlready) {
        edits.push({ start: gapStart, end: gapEnd, insert: '' });
        continue;
      }
      var space = -1;
      for (var k = gapStart; k <= gapEnd; k++) {
        if (PREVIEW_EMPHASIS_SPACE.test(text[k])) { space = k; break; }
      }
      if (space < 0) {
        edits.push({ start: gapStart, end: gapEnd, insert: ' ' });
      } else {
        if (space < gapEnd) edits.push({ start: space + 1, end: gapEnd, insert: '' });
        if (space > gapStart) edits.push({ start: gapStart, end: space - 1, insert: '' });
      }
    }
  });

  return edits.sort(function (a, b) { return b.start - a.start; });
}

/**
 * The preview's translation for Drop and Bold only, as escaped HTML with only
 * our own <b>, <i> and <br>; null for Keep (the caller renders the sanitized
 * markup). Bold only keeps the bold runs (bold italics included) and drops the
 * rest by the insert's plan; a translation with no bold is kept whole.
 */
function previewTranslationEmphasisHtml(text, mode, lineMarkers, extendedGemara) {
  if (mode !== 'discard' && mode !== 'only') return null;
  var read = readPreviewEmphasis(joinPreviewTranslation(text, lineMarkers), extendedGemara);
  var chars = [];
  for (var c = 0; c < read.text.length; c++) {
    chars.push({ ch: read.text[c], bold: mode === 'only' && read.bold[c], italic: mode === 'only' && read.italic[c] });
  }
  if (mode === 'only') {
    var runs = [];
    for (var s = 0; s < chars.length; s++) {
      if (!read.bold[s]) continue;
      var e = s;
      while (e + 1 < chars.length && read.bold[e + 1]) e++;
      runs.push({ start: s, end: e });
      s = e;
    }
    planPreviewEmphasisOnlyEdits(read.text, runs, []).forEach(function (edit) {
      if (edit.end >= edit.start) chars.splice(edit.start, edit.end - edit.start + 1);
      if (edit.insert) {
        chars.splice.apply(chars, [edit.start, 0].concat(edit.insert.split('').map(function (ch) {
          return { ch: ch, bold: false, italic: false };
        })));
      }
    });
  }
  var html = '';
  var bold = false, italic = false;
  chars.forEach(function (ch) {
    if (italic && (!ch.italic || ch.bold !== bold)) { html += '</i>'; italic = false; }
    if (bold && !ch.bold) { html += '</b>'; bold = false; }
    if (!bold && ch.bold) { html += '<b>'; bold = true; }
    if (!italic && ch.italic) { html += '<i>'; italic = true; }
    html += PREVIEW_EMPHASIS_LINE_BREAK.test(ch.ch) ? '<br>' : escapeHTML(ch.ch);
  });
  if (italic) html += '</i>';
  if (bold) html += '</b>';
  return html.replace(/(<br>)+$/, '');
}

function renderPreviewHTML(dataIn, inputTitle) {
  var mode = $('.output-mode-selection').val();
  var layout = $('.bilingual-layout-selection').val() || 'he-right';

  // Sefaria's markup is rendered, not escaped — footnotes and emphasis are the
  // point of the preview — but it is stripped of anything that would load a
  // subresource or execute first. See sanitizeSourceHtml in shared/ui/dom.
  var heHtml = sanitizeSourceHtml(dataIn.he) || '<p class="preview-state-message">No source text available.</p>';
  // Drop and Bold only are previewed as the insert will write them (above).
  var emphasisHtml = previewTranslationEmphasisHtml(
    dataIn.text,
    ccNormalizeEmphasisMode($('.source-emphasis-mode').val()),
    Boolean($('.wants-pesukim').prop('checked')),
    typeof effectivePreferences !== 'undefined' && effectivePreferences &&
      String(effectivePreferences.extended_gemara) === 'true'
  );
  var enHtml = emphasisHtml || sanitizeSourceHtml(dataIn.text) || '<p class="preview-state-message">No translation text available.</p>';

  if (mode === 'he') {
    return buildPreviewMeta(dataIn.heRef, dataIn) +
      "<div class='preview-he'>" + heHtml + "</div>";
  }

  if (mode === 'en') {
    return buildPreviewMeta(dataIn.ref, inputTitle) +
      "<div>" + enHtml + "</div>";
  }

  var englishCell = "<td>" + buildPreviewMeta(dataIn.ref, inputTitle) + enHtml + "</td>";
  var hebrewCell = "<td class='preview-he'>" + buildPreviewMeta(dataIn.heRef, dataIn) + heHtml + "</td>";

  if (layout === 'he-top') {
    return "<div class='preview-stack'>" +
      "<div class='preview-stack-block preview-he'>" + buildPreviewMeta(dataIn.heRef, dataIn) + heHtml + "</div>" +
      "<div class='preview-stack-block'>" + buildPreviewMeta(dataIn.ref, inputTitle) + enHtml + "</div>" +
      "</div>";
  }

  if (layout === 'he-left') {
    return "<table class='preview-table'><tr>" + hebrewCell + englishCell + "</tr></table>";
  }

  return "<table class='preview-table'><tr>" + englishCell + hebrewCell + "</tr></table>";
}


function updateSuggestion(dataIn, inputTitle) {
  var resolvedRef = dataIn && dataIn.ref ? dataIn.ref : inputTitle;
  // Selection-order tracking restarts with each rebuild, except that the same
  // ref keeps a multi-selection: a Layout tray change, another source edition
  // or the availability lookup used to drop every translation but one.
  var keptTranslationVersions = (!pendingPreferredVersions && orderedTranslationVersionsRef === resolvedRef && orderedTranslationVersions.length > 1)
    ? orderedTranslationVersions.slice()
    : [];
  orderedTranslationVersions = [];
  orderedTranslationVersionsRef = resolvedRef;
  var allowMulti = translationMultiSelectAllowed();
  // A layout that inserts one translation keeps the first one picked.
  var collapseToVersion = '';
  if (!allowMulti && keptTranslationVersions.length > 1) {
    collapseToVersion = keptTranslationVersions[0];
    keptTranslationVersions = [];
  }
  // A translation that resolves but has no text for this ref is not worth
  // offering: record it before the option list is built so it renders disabled.
  var resolvedTranslationIsEmpty = !!(dataIn && dataIn.versionTitle) && !hasRenderableText(dataIn.text);
  if (resolvedTranslationIsEmpty) translationAvailabilityByRef[resolvedRef + '::' + dataIn.versionTitle] = false;
  else if (dataIn && dataIn.versionTitle) translationAvailabilityByRef[resolvedRef + '::' + dataIn.versionTitle] = true;
  var versionEntries = buildVersionModel(dataIn);
  var enSelectedVersionTitle = dataIn.versionTitle || "";
  var heSelectedVersionTitle = dataIn.heVersionTitle || "";
  var hebrewEntries = sortVersionEntries(versionEntries.filter(function (entry) { return entry.languageKey === 'he'; }));
  var translationEntries = sortVersionEntries(versionEntries.filter(function (entry) { return entry.languageKey !== 'he'; }));

  var selectVersionHebrew = "<div class=\"version-control-header\"><label class=\"version-label\" for=\"he-version-filter\">Source editions</label><span class=\"version-count\">" + hebrewEntries.length + " available</span></div><input type=\"text\" id=\"he-version-filter\" class=\"translation-filter-input he-version-filter\" placeholder=\"Filter source editions\" aria-label=\"Filter source editions\"><select id=\"he-version-selection\" class=\"translation-version-select he-version-selection\" size=\"6\" aria-label=\"Source editions\"></select><div class=\"translation-selected-display he-selected-display\" aria-live=\"polite\"></div>";

  var translationInput = "<div class=\"version-control-header\"><label class=\"version-label\" for=\"translation-version-filter\">Translation versions</label><span class=\"version-count\">" + translationEntries.length + " available</span></div><input type=\"text\" id=\"translation-version-filter\" class=\"translation-filter-input\" placeholder=\"Filter by language or version name\" aria-label=\"Filter translation versions\"><select id=\"translation-version-selection\" class=\"translation-version-select\" size=\"6\"" + (allowMulti ? " multiple" : "") + " aria-label=\"Translation versions\"></select><div class=\"translation-selected-display\" aria-live=\"polite\"></div>";

  var languageGroups = {};
  translationEntries.forEach(function (entry) {
    if (!languageGroups[entry.languageLabel]) languageGroups[entry.languageLabel] = [];
    languageGroups[entry.languageLabel].push(entry);
  });

  var translationGroupLabels = Object.keys(languageGroups).sort(function (a, b) {
    var diff = languagePriorityKey(a) - languagePriorityKey(b);
    if (diff !== 0) return diff;
    if (String(a || '').toLowerCase() === String(b || '').toLowerCase()) return 0;
    return String(a || '').localeCompare(String(b || ''));
  });

  var translationItems = [];
  translationGroupLabels.forEach(function (groupLabel) {
    var cleanGroupLabel = (normalizeOptionText(groupLabel).slice(0,2).toUpperCase()) || 'OT';
    if (!languageGroups[groupLabel] || !languageGroups[groupLabel].length) return;
    languageGroups[groupLabel].forEach(function (entry) {
      var cleanLabel = normalizeOptionText(entry.fullTitle || entry.label || entry.versionTitle);
      var fallbackLabel = normalizeOptionText(entry.versionTitle);
      var normalizedLabel = cleanLabel || fallbackLabel || ("Translation " + (entry.index + 1));
      var optionLabel = normalizeOptionText(cleanGroupLabel + " – " + normalizedLabel);
      translationItems.push({
        label: normalizedLabel,
        optionLabel: optionLabel,
        value: entry.versionTitle,
        category: cleanGroupLabel,
        searchable: (normalizedLabel + " " + entry.versionTitle + " " + cleanGroupLabel).toLowerCase(),
        languageCode: translationEntryLanguageCode(entry),
        availableForRef: Object.prototype.hasOwnProperty.call(translationAvailabilityByRef, resolvedRef + "::" + entry.versionTitle)
          ? translationAvailabilityByRef[resolvedRef + "::" + entry.versionTitle]
          : true
      });
    });
  });

  var hebrewItems = hebrewEntries.map(function (entry) {
    var normalizedLabel = normalizeOptionText(entry.fullTitle || entry.label || entry.versionTitle) || normalizeOptionText(entry.versionTitle) || ("Source " + (entry.index + 1));
    return {
      label: normalizedLabel,
      optionLabel: normalizedLabel,
      value: entry.versionTitle,
      searchable: (normalizedLabel + " " + entry.versionTitle).toLowerCase()
    };
  });

  // Version-control shells interpolate only entry counts. The preview is
  // Sefaria HTML run through sanitizeSourceHtml (an allowlist; see
  // shared/ui/dom.html), with refs and titles escaped by buildPreviewMeta.
  $('.translation-version-control').html(translationInput);
  $('.hebrew-version-control').html(selectVersionHebrew);
  $('.suggestions').html(renderPreviewHTML(dataIn, inputTitle));

  if (pendingPreferredVersions) {
    var preferredEn = pendingPreferredVersions.en || '';
    var preferredHe = pendingPreferredVersions.he || '';
    if (preferredEn && translationEntries.some(function (entry) { return entry.versionTitle === preferredEn; })) enSelectedVersionTitle = preferredEn;
    if (preferredHe && hebrewEntries.some(function (entry) { return entry.versionTitle === preferredHe; })) heSelectedVersionTitle = preferredHe;
  }

  var currentEnVersion = enSelectedVersionTitle;
  var currentHeVersion = heSelectedVersionTitle;
  if (collapseToVersion && translationEntries.some(function (entry) { return entry.versionTitle === collapseToVersion; })) {
    currentEnVersion = collapseToVersion;
  }

  function translationLabel(versionTitle) {
    var item = translationItems.filter(function (entry) { return entry.value === versionTitle; })[0];
    return item ? item.optionLabel : '';
  }

  // Names the selection whether or not the filter box hides its option.
  function syncSelectedTranslationDisplay() {
    var displayText;
    if (orderedTranslationVersions.length > 1) {
      displayText = orderedTranslationVersions.length + ' versions selected';
    } else {
      var current = orderedTranslationVersions[0] || currentEnVersion;
      displayText = normalizeOptionText(translationLabel(current) || current || 'No translation selected.');
    }
    $('.translation-selected-display').not('.he-selected-display').removeClass('is-warning').text(displayText).attr('title', displayText);
  }

  function syncSelectedHebrewDisplay() {
    var item = hebrewItems.filter(function (entry) { return entry.value === currentHeVersion; })[0];
    var displayText = normalizeOptionText((item && item.optionLabel) || currentHeVersion || 'No source edition selected.');
    $('.he-selected-display').text(displayText).attr('title', displayText);
  }

  function markTranslationAvailability(resolvedVersionTitle, attemptedVersionTitle) {
    var resolved = String(resolvedVersionTitle || '').trim();
    var attempted = String(attemptedVersionTitle || '').trim();
    if (!attempted) return;
    var wasResolved = !!(resolved && resolved === attempted);
    translationAvailabilityByRef[resolvedRef + '::' + attempted] = wasResolved;
    translationItems.forEach(function (item) {
      if (item.value === attempted) item.availableForRef = wasResolved;
    });
  }

  function selectOptions($select, versionTitles) {
    $select.find('option').each(function () {
      this.selected = !this.disabled && versionTitles.indexOf($(this).val()) >= 0;
    });
  }

  function renderTranslationOptions(filterTerm) {
    var query = String(filterTerm || '').trim().toLowerCase();
    var listed = listTranslationItems(translationItems, resolvedRef, effectivePreferences);
    var filtered = listed.filter(function (item) { return !query || item.searchable.indexOf(query) >= 0; });
    var optionsHTML = '';
    var hasSelectableOption = false;
    var $select = translationVersionSelect();
    $('.translation-version-control .version-count').text(listed.length + ' available');

    if (!filtered.length) {
      optionsHTML = listed.length
        ? '<option value="" disabled>No matching translations</option>'
        : '<option value="" disabled>No translations with text for this passage</option>';
    } else {
      filtered.forEach(function (item) {
        var isUnavailable = item.availableForRef === false;
        var selected = item.value === currentEnVersion && !isUnavailable ? 'selected' : '';
        var disabled = isUnavailable ? 'disabled' : '';
        var unavailableClass = isUnavailable ? ' class="translation-unavailable"' : '';
        var label = isUnavailable ? (item.optionLabel + ' – unavailable for this ref') : item.optionLabel;
        if (!isUnavailable) hasSelectableOption = true;
        optionsHTML += '<option value="' + escapeHTML(item.value) + '"' + unavailableClass + ' ' + selected + ' ' + disabled + ' title="' + escapeHTML(label) + '">' + escapeHTML(label) + '</option>';
      });
    }

    if (!hasSelectableOption && filtered.length) {
      optionsHTML += '<option value="" disabled>No available translations for this ref</option>';
    }

    // Every option value and label goes through escapeHTML above.
    $select.html(optionsHTML);
    // Restore multi-selection order when the list is re-rendered (e.g., after filtering).
    if (orderedTranslationVersions.length > 1) {
      selectOptions($select, orderedTranslationVersions);
      if (!query) {
        // Only an unfiltered list shows every listed version, so only then can
        // a missing one be dropped: it was hidden or found to have no text.
        var restoredVals = $select.val() || [];
        orderedTranslationVersions = orderedTranslationVersions.filter(function (vt) {
          return restoredVals.indexOf(vt) >= 0;
        });
      }
    }

    // Filtering only narrows what is shown; it never changes the selection.
    // Without a filter, a single selection that is no longer listed (hidden,
    // or found to have no text) moves to the first listed translation.
    if (!query && orderedTranslationVersions.length <= 1) {
      var selectedVal = $select.val();
      if (!selectedVal || !selectedVal.length) {
        $select.find('option:not(:disabled)').first().prop('selected', true);
        selectedVal = $select.val();
      }
      currentEnVersion = (Array.isArray(selectedVal) ? selectedVal[0] : selectedVal) || '';
      orderedTranslationVersions = currentEnVersion ? [currentEnVersion] : [];
    }

    syncSelectedTranslationDisplay();
  }

  function renderHebrewOptions(filterTerm) {
    var query = String(filterTerm || '').trim().toLowerCase();
    var filtered = hebrewItems.filter(function (item) { return !query || item.searchable.indexOf(query) >= 0; });
    var optionsHTML = '';

    if (!filtered.length) {
      optionsHTML = '<option value="" disabled>No matching source editions</option>';
    } else {
      filtered.forEach(function (item) {
        var selected = item.value === currentHeVersion ? 'selected' : '';
        optionsHTML += '<option value="' + escapeHTML(item.value) + '" ' + selected + ' title="' + escapeHTML(item.optionLabel) + '">' + escapeHTML(item.optionLabel) + '</option>';
      });
    }

    // Every option value and label goes through escapeHTML above.
    $('.he-version-selection').html(optionsHTML);
    // As for translations: a filter never changes the selected edition.
    if (!query) {
      if (!$('.he-version-selection').val()) {
        var firstOption = $('.he-version-selection option:not(:disabled)').first();
        if (firstOption.length) {
          firstOption.prop('selected', true);
          currentHeVersion = firstOption.val();
        }
      }
      if (currentHeVersion && !$('.he-version-selection option:selected').length) currentHeVersion = '';
    }
    syncSelectedHebrewDisplay();
  }

  function getVersions(targetTranslationVersion) {
    var selectedVal = translationVersionSelect().val();
    var enVersion = targetTranslationVersion || currentEnVersion || (Array.isArray(selectedVal) ? selectedVal[0] : selectedVal) || enSelectedVersionTitle;
    var heVersion = currentHeVersion || $('.he-version-selection').val() || heSelectedVersionTitle;
    var versions = { en: enVersion, he: heVersion };
    var requestId = ++latestResolveRequestId;
    hasResolvedReference = false;
    setInsertButtonState(false);
    $('#open-on-sefaria').prop('disabled', true);
    // buildPreviewLoadingHTML escapes its message.
    $('.suggestions').html(buildPreviewLoadingHTML('Refreshing preview…'));

    google.script.run.withSuccessHandler(function (response) {
      if (requestId !== latestResolveRequestId) return;
      var nodeState = getResolvedNodeState(response);
      if (!nodeState.isInsertable) {
        hasResolvedReference = false;
        setInsertButtonState(false);
        $('#open-on-sefaria').prop('disabled', true);
        clearVersionSelectors();
        updatePesukimAvailability(null);
        updateActionabilityUI(nodeState);
        // buildNonInsertableMessage escapes the ref (buildPreviewMeta) and the prompt.
        $('.suggestions').html('<br>' + buildNonInsertableMessage(response));
        return;
      }

      var resolvedTranslation = String((response && response.versionTitle) || '').trim();
      markTranslationAvailability(resolvedTranslation, enVersion);
      if (enVersion && resolvedTranslation && resolvedTranslation !== enVersion) renderTranslationOptions($('#translation-version-filter').val());
      updateSuggestion(response, inputTitle);
      updatePesukimAvailability(response);
      updateActionabilityUI(nodeState);
      data = response;
      hasResolvedReference = true;
      setInsertButtonState(true);
      $('#open-on-sefaria').prop('disabled', false);
    }).withFailureHandler(function (error) {
      if (requestId !== latestResolveRequestId) return;
      if (error && error.message) showInsertWarning(error.message);
      markTranslationAvailability('', enVersion);
      renderTranslationOptions($('#translation-version-filter').val());
      hasResolvedReference = false;
      setInsertButtonState(false);
      $('#open-on-sefaria').prop('disabled', true);
      clearVersionSelectors();
      updatePesukimAvailability(null);
      updateActionabilityUI({ isInsertable: false });
    }).findReferenceForSidebar(resolvedRef, versions, sidebarSessionId);
  }

  // Seed selection-order tracking: the multi-selection kept from the last
  // render of this ref, else the single version the list selects.
  orderedTranslationVersions = keptTranslationVersions;
  renderTranslationOptions('');
  var optionsBuiltForRequestId = latestResolveRequestId;
  activeTranslationOptions = {
    ref: resolvedRef,
    label: translationLabel,
    refresh: function () {
      if (!translationVersionSelect().length) return;
      // Another lookup started since this list was built: it owns the preview.
      if (latestResolveRequestId !== optionsBuiltForRequestId) return;
      var wasMulti = orderedTranslationVersions.length > 1;
      renderTranslationOptions($('#translation-version-filter').val());
      if (orderedTranslationVersions.length > 1 || $('.output-mode-selection').val() === 'he') return;
      // The version in the preview is no longer listed: load the one the list
      // moved to, so a plain Insert doesn't carry text the list doesn't show.
      if (dataIn.versionTitle && currentEnVersion && currentEnVersion !== dataIn.versionTitle) {
        getVersions(currentEnVersion);
      } else if (wasMulti && typeof refreshSidebarLivePreview === 'function') {
        // A multi-selection lost all but the translation already loaded.
        refreshSidebarLivePreview();
      }
    },
    // Make one translation the whole selection and preview it.
    select: function (versionTitle) {
      if (latestResolveRequestId !== optionsBuiltForRequestId) return;
      orderedTranslationVersions = versionTitle ? [versionTitle] : [];
      if (versionTitle) currentEnVersion = versionTitle;
      selectOptions(translationVersionSelect(), orderedTranslationVersions);
      syncSelectedTranslationDisplay();
      if (versionTitle && versionTitle !== (dataIn.versionTitle || '') && $('.output-mode-selection').val() !== 'he') {
        getVersions(versionTitle);
      } else if (typeof refreshSidebarLivePreview === 'function') {
        refreshSidebarLivePreview();
      }
    }
  };
  renderHebrewOptions('');

  $('.translation-filter-input').off('input.translationFilter').on('input.translationFilter', function () {
    if ($(this).hasClass('he-version-filter')) renderHebrewOptions($(this).val());
    else renderTranslationOptions($(this).val());
  }).off('keydown.translationFilter').on('keydown.translationFilter', function (event) {
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      if ($(this).hasClass('he-version-filter')) $('.he-version-selection').focus();
      else translationVersionSelect().focus();
    }
  });

  // In a multi-select list a plain click replaced the whole selection (only
  // Ctrl / Cmd added to it), so picking a second translation dropped the
  // first. A click toggles the one option instead; the change handler below
  // decides what that means.
  translationVersionSelect().off('mousedown.translationToggle').on('mousedown.translationToggle', 'option', function (event) {
    var select = translationVersionSelect()[0];
    if (!select || !select.multiple || this.disabled || event.button !== 0) return;
    event.preventDefault();
    var scrollTop = select.scrollTop;
    this.selected = !this.selected;
    select.focus({ preventScroll: true });
    select.scrollTop = scrollTop;
    $(select).trigger('change');
  });

  translationVersionSelect().off('change.translationVersion').on('change.translationVersion', function () {
    var $select = $(this);
    var selected = $select.val();
    var selectedArr = Array.isArray(selected) ? selected : (selected ? [selected] : []);
    var shown = $select.find('option').map(function () { return $(this).val(); }).get();

    // Maintain selection order: drop deselected items, append newly selected
    // items. A version the filter box hides can't have been deselected: keep it.
    var next = orderedTranslationVersions.filter(function (vt) {
      return selectedArr.indexOf(vt) >= 0 || ($select.prop('multiple') && shown.indexOf(vt) < 0);
    });
    selectedArr.forEach(function (vt) {
      if (next.indexOf(vt) < 0) next.push(vt);
    });

    // Never end with nothing selected: Insert would quietly use whatever the
    // preview last loaded. Put the selection back and say why.
    if (!next.length) {
      selectOptions($select, orderedTranslationVersions);
      var keepText = 'At least one translation stays selected: it is the one inserted.';
      $('.translation-selected-display').not('.he-selected-display').addClass('is-warning').text(keepText).attr('title', keepText);
      return;
    }

    var wasMulti = orderedTranslationVersions.length > 1;
    orderedTranslationVersions = next;
    syncSelectedTranslationDisplay();

    if (orderedTranslationVersions.length > 1) {
      // Multiple translations selected: list them instead of re-fetching a single-version preview.
      updateMultiSelectPreviewNotice();
      return;
    }

    var primarySelected = orderedTranslationVersions[0];
    currentEnVersion = primarySelected;
    if (wasMulti && primarySelected === (dataIn.versionTitle || '') && typeof refreshSidebarLivePreview === 'function') {
      // Back to the one translation already loaded: show its preview again.
      refreshSidebarLivePreview();
      return;
    }
    getVersions(primarySelected);
  });

  $('.he-version-selection').off('change.heVersion').on('change.heVersion', function () {
    var selected = $(this).val();
    if (!selected) {
      // A Ctrl / Cmd click can clear the list; the edition loaded is still
      // the one inserted, so show it selected.
      selectOptions($(this), [currentHeVersion]);
      syncSelectedHebrewDisplay();
      return;
    }
    currentHeVersion = selected;
    syncSelectedHebrewDisplay();
    getVersions();
  });

  var refetchQueued = false;
  if (pendingPreferredVersions) {
    var prefEn = pendingPreferredVersions.en || '';
    var prefHe = pendingPreferredVersions.he || '';
    pendingPreferredVersions = null;
    if (prefEn || prefHe) {
      var currentEn = currentEnVersion || enSelectedVersionTitle;
      var currentHe = currentHeVersion || heSelectedVersionTitle;
      if (currentEn !== (dataIn.versionTitle || '') || currentHe !== (dataIn.heVersionTitle || '')) {
        getVersions();
        refetchQueued = true;
      }
    }
  }

  // The translation in the preview isn't the one selected — it has no text
  // for this ref, its language is hidden in Preferences, or a multi-selection
  // was cut to one whose text isn't loaded — so load the selected one; the
  // preview and a plain Insert then match the list. Terminates: each fetch
  // either resolves the version asked for or marks it unavailable, and an
  // unavailable version is never chosen.
  if (!refetchQueued && $('.output-mode-selection').val() !== 'he' && dataIn.versionTitle
      && orderedTranslationVersions.length <= 1
      && currentEnVersion && currentEnVersion !== dataIn.versionTitle) {
    getVersions(currentEnVersion);
  }
  requestTranslationAvailability(resolvedRef);

  updateVersionControlsVisibility();
  updateModeDependentSections();
  applyMultiSelectMode();
  if (orderedTranslationVersions.length > 1) {
    updateMultiSelectPreviewNotice();
  } else if (typeof renderPreviewTransliteration === 'function') {
    renderPreviewTransliteration(dataIn);
  }
}

</script>
