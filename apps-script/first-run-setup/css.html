<style>
  /* First-run setup dialog. Colours come from css/tokens; no copies here. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--panel);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .setup-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 16px 20px;
  }

  .setup-progress {
    margin: 0 0 4px;
    color: var(--muted);
    font-size: 12px;
  }

  .setup-step { flex: 1; }

  .setup-heading {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 600;
  }
  .setup-heading:focus { outline: none; }

  .setup-fieldset {
    border: 0;
    margin: 0 0 12px;
    padding: 0;
  }
  .setup-fieldset > legend {
    padding: 0;
    font-weight: 600;
  }

  .setup-row > label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 2px 14px 2px 0;
  }

  .setup-help {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12px;
  }

  .setup-cards {
    display: grid;
    gap: 10px;
  }
  .setup-cards--two { grid-template-columns: 1fr 1fr; }

  .setup-card {
    position: relative;
    display: block;
    padding: 12px 14px 12px 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    cursor: pointer;
  }
  .setup-card input {
    position: absolute;
    left: 14px;
    top: 15px;
    margin: 0;
  }
  .setup-card:has(input:checked) {
    border-color: var(--selected);
    background: var(--selected-soft);
  }
  .setup-card:has(input:focus-visible) {
    outline: 2px solid var(--selected);
    outline-offset: 2px;
  }
  .setup-card-title {
    display: block;
    font-weight: 600;
  }
  .setup-card-note {
    display: block;
    color: var(--muted);
    font-size: 13px;
  }

  .setup-preview {
    margin: 0 0 14px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
  }
  .setup-preview-ref {
    font-weight: 600;
    font-size: 13px;
  }
  .setup-preview-body {
    display: grid;
    gap: 4px 16px;
    align-items: start;
  }
  .setup-preview-body[data-arrangement="he-right"] { grid-template-columns: 1fr 1fr; }
  .setup-preview-body[data-arrangement="he-right"] .setup-preview-he { order: 2; }
  .setup-preview-body[data-arrangement="he-left"] { grid-template-columns: 1fr 1fr; }
  .setup-preview-he,
  .setup-preview-en { margin: 0; }
  .setup-preview-he {
    font-family: "Times New Roman", "SBL Hebrew", serif;
    font-size: 20px;
  }

  .setup-divine-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 4px 0;
  }
  .setup-divine-row select { min-width: 110px; }

  .setup-done-list { padding-left: 20px; }
  .setup-done-list li { margin: 6px 0; }

  .setup-error {
    margin: 8px 0 0;
    color: var(--halakhah-red);
  }

  .setup-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .setup-footer-spacer { flex: 1; }
  .setup-link {
    border: 0;
    background: none;
    padding: 0;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }
</style>
