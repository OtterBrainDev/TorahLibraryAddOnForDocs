<style>
/*
 * components/lexicon.css — Redesigned Lexicon sidebar styles
 *
 * Covers: tab badge, search history, word rows, a word's entries (chosen
 * like translations), insert format chips, the entry cards of the preview,
 * starred words. Markup: sidebar.html; behaviour: sidebar/js/lexicon.
 */

/* =============================================================
   TAB BADGE
   ============================================================= */

.mode-switch-button[data-sidebar-mode="lexicon"],
.mode-switch-button[data-sidebar-mode="texts"],
.mode-switch-button[data-sidebar-mode="voices"] {
  position: relative;
}

.lexicon-tab-badge,
.tab-result-badge {
  position: absolute;
  top: 1px;
  right: 1px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  background: var(--sefaria-blue);
  color: #fff;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 700;
  line-height: 15px;
  text-align: center;
  pointer-events: none;
}

/* =============================================================
   SR-ONLY LIVE REGION
   ============================================================= */

.lexicon-sr-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  pointer-events: none;
}

/* =============================================================
   SEARCH HISTORY CHIPS
   ============================================================= */

.lexicon-history-section {
  margin: -4px 0 6px;
}

.lexicon-history {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.lexicon-history-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--lighter-grey);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  line-height: 1.4;
  transition: background 0.12s, border-color 0.12s;
}

.lexicon-history-chip:hover,
.lexicon-history-chip:focus {
  background: var(--selected-soft);
  border-color: var(--sefaria-blue);
  color: var(--sefaria-blue);
  outline: none;
}

.lexicon-history-chip-text {
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  direction: rtl;
}

.lexicon-history-clear {
  background: none;
  border: none;
  font-size: 10px;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  margin-left: 2px;
  line-height: 1.4;
}

.lexicon-history-clear:hover {
  color: var(--text);
}

/* =============================================================
   RESULT COUNT STATUS LINE
   ============================================================= */

.lexicon-result-count {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.3px;
  margin: 0 0 6px;
  text-transform: uppercase;
  padding: 0 2px;
}

/* =============================================================
   LEXICON RESULT ROWS — override generic result-item in lexicon mode
   ============================================================= */

.mode-lexicon .search-results .result-item.result-row,
.mode-lexicon .library-results .result-item.result-row {
  padding: 7px 10px;
  border: 1px solid #e8e6e0;
  border-left: 3px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  background: #fff;
  transition: background 0.1s, border-color 0.1s;
  margin-bottom: 0;
}

.mode-lexicon .result-item.result-row:hover {
  background: var(--lighter-grey);
  border-color: #ccc;
  border-left-color: transparent;
}

.mode-lexicon .result-item.result-row.selected {
  background: var(--selected-soft);
  border-color: var(--sefaria-blue);
  border-left-color: var(--sefaria-blue);
  border-left-width: 3px;
}

.mode-lexicon .result-item.result-row:focus-visible {
  outline: 2px solid var(--sefaria-blue);
  outline-offset: 1px;
}

/* Suppress the generic result-row-main, result-meta, result-snippet
   in lexicon mode — we render our own layout inside the li */
.mode-lexicon .result-item .result-row-main,
.mode-lexicon .result-item .result-meta,
.mode-lexicon .result-item .result-snippet,
.mode-lexicon .result-item .result-subtitle,
.mode-lexicon .result-item .result-pin-button {
  display: none;
}

/* ---- Lexicon row anatomy ---- */

.lexicon-row-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 2px;
  min-width: 0;
}

.lexicon-row-headword {
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  font-size: 15px;
  font-weight: 600;
  direction: rtl;
  color: var(--text);
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
}

.result-item.selected .lexicon-row-headword {
  color: var(--sefaria-blue);
}

.lexicon-row-source {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

/* A word's glosses, one per entry: two lines at most. */
.lexicon-row-gloss {
  font-size: 12px;
  color: #3c3c3c;
  direction: ltr;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  max-width: 100%;
  line-height: 1.4;
}

.lexicon-row-gloss--unavailable {
  font-style: italic;
  color: var(--muted);
}

/* Chips: language, morphology, sense */
.lexicon-row-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 3px;
}

.lexicon-chip {
  display: inline-block;
  padding: 1px 5px;
  background: #f0eeea;
  border-radius: 3px;
  font-size: 10px;
  color: #666;
  line-height: 1.4;
}

/* ---- Bookmark star on result row ---- */

.lexicon-row-bookmark-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  padding: 0;
  opacity: 0.4;
  flex-shrink: 0;
  line-height: 1;
  transition: opacity 0.1s;
  color: var(--muted);
}

.lexicon-row-bookmark-btn:hover,
.lexicon-row-bookmark-btn.is-bookmarked {
  opacity: 1;
  color: #c8a000;
}

/* =============================================================
   SECTION LABELS (inline, compact)
   ============================================================= */

.lexicon-section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin: 10px 0 5px;
  padding: 0;
}

/* =============================================================
   LEXICON INSERT OPTIONS — flat, no accordion chrome
   ============================================================= */

/* Suppress the accordion decoration entirely in lexicon insert options */
.lexicon-insert-options {
  padding: 0;
  background: transparent;
  border: none;
  box-shadow: none;
}

/* =============================================================
   PREVIEW — footer (Copy)
   ============================================================= */

.lexicon-preview-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 7px;
  gap: 8px;
}

.lexicon-preview-copy-btn {
  background: none;
  border: none;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  padding: 0 2px;
  white-space: nowrap;
  transition: color 0.1s;
}

.lexicon-preview-copy-btn:hover {
  color: var(--sefaria-blue);
}

.lexicon-preview-copy-btn.copy-success {
  color: #1e7e34;
}

/* =============================================================
   WORD LIST — Matches / Related words
   ============================================================= */

.lexicon-word-group-label {
  list-style: none;
  margin: 8px 2px 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
}

.lexicon-word-group-label:first-child {
  margin-top: 0;
}

.mode-lexicon .search-results .lexicon-word-row + .lexicon-word-row {
  margin-top: 4px;
}

.lexicon-chip--dict {
  color: var(--sefaria-blue);
  background: var(--selected-soft);
}

/* =============================================================
   A WORD'S ENTRIES — picked like translations
   ============================================================= */

.lexicon-entries-section {
  margin-top: 8px;
}

.lexicon-entries-section .version-control-header {
  margin-bottom: 4px;
}

.lexicon-entries-section .lexicon-section-label {
  margin: 0;
}

.lexicon-entries-word {
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text);
}

.lexicon-entry-list {
  margin: 0;
  padding: 3px;
  list-style: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  max-height: 232px;
  overflow-y: auto;
}

.lexicon-entry-option {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 6px 7px;
  border-radius: 6px;
  cursor: pointer;
  line-height: 1.35;
}

.lexicon-entry-option + .lexicon-entry-option {
  margin-top: 1px;
}

.lexicon-entry-option:hover {
  background: var(--row-hover);
}

.lexicon-entry-option.is-selected {
  background: var(--selected-soft);
}

.lexicon-entry-option:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 0;
}

/* The tick (one entry) or its place in the insert order (several). */
.lexicon-entry-check {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  margin-top: 1px;
  border: 1.5px solid var(--switch-off);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  line-height: 13px;
  text-align: center;
  color: #fff;
  background: var(--panel);
}

.lexicon-entry-option.is-selected .lexicon-entry-check {
  border-color: var(--sefaria-blue);
  background: var(--sefaria-blue);
}

.lexicon-entry-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1 1 auto;
}

.lexicon-entry-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 5px;
}

.lexicon-entry-dict {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

.lexicon-entry-morph {
  font-size: 11px;
  font-style: italic;
  color: var(--muted);
}

.lexicon-entry-gloss {
  font-size: 12px;
  color: #3c3c3c;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lexicon-entries-tools {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.lexicon-select-all {
  flex: 0 0 auto;
  margin-top: 4px;
  padding: 0;
  background: none;
  border: none;
  color: var(--sefaria-blue);
  font-size: 11px;
  text-decoration: underline;
  cursor: pointer;
}

.lexicon-selected-display {
  font-size: 11px;
}

.lexicon-selected-display.is-warning {
  color: var(--halakhah-red);
  border-color: var(--halakhah-red);
}

.lexicon-insert-summary {
  margin: 6px 0 0;
  font-size: 11px;
  color: var(--muted);
}

/* =============================================================
   PREVIEW — the picked entries, an outline each
   ============================================================= */

.lexicon-preview-section {
  margin-top: 4px;
}

.lexicon-card {
  margin-bottom: 8px;
  padding: 9px 10px 8px;
  background: var(--preview-well-bg);
  border: 1px solid var(--preview-well-border);
  border-radius: 8px;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text);
  text-align: left;
}

.lexicon-card-head {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding-bottom: 5px;
  margin-bottom: 5px;
  border-bottom: 1px solid var(--row-divider);
}

.lexicon-card-order {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--sefaria-blue);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  align-self: center;
}

.lexicon-card-dict {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--sefaria-blue);
}

.lexicon-card-morph {
  font-size: 11px;
  font-style: italic;
  color: var(--muted);
}

.lexicon-card-headword {
  margin-left: auto;
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
}

.lexicon-card-alts {
  margin: -2px 0 4px;
  font-size: 11px;
  color: var(--muted);
}

.lexicon-card-alts bdi {
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  font-size: 13px;
  color: var(--text);
}

.lexicon-card-empty {
  margin: 2px 0;
  font-style: italic;
  color: var(--muted);
}

/* Senses: the dictionary's own numbering (1., a.), not a running count. */
.lexicon-senses {
  margin: 0;
  padding: 0;
  list-style: none;
}

.lexicon-sense {
  display: flex;
  gap: 5px;
  margin: 3px 0;
}

.lexicon-senses--depth-1,
.lexicon-senses--depth-2,
.lexicon-senses--depth-3 {
  margin-top: 2px;
}

/* Sub-senses under an unnumbered heading (BDB's "Qal") sit in from it. */
.lexicon-sense--unnumbered > .lexicon-sense-body > .lexicon-senses {
  padding-left: 10px;
}

.lexicon-sense-num {
  flex: 0 0 auto;
  min-width: 14px;
  font-weight: 600;
  color: var(--sefaria-blue);
}

.lexicon-sense-body {
  flex: 1 1 auto;
  min-width: 0;
}

.lexicon-sense-label {
  display: inline-block;
  padding: 0 4px;
  margin-right: 2px;
  border-radius: 3px;
  background: var(--card);
  font-size: 11px;
  font-weight: 600;
  color: var(--row-label);
}

.lexicon-sense-notes {
  color: var(--muted);
}

.lexicon-card [dir="rtl"] {
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  font-size: 1.08em;
}

/* Collapsed (the default for a long entry): each definition two lines, the
   first senses and their first sub-senses. "Show the whole entry" opens it. */
.lexicon-card.is-long:not(.is-expanded) .lexicon-sense-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.lexicon-card.is-long:not(.is-expanded) > .lexicon-senses > .lexicon-sense:nth-child(n+5),
.lexicon-card.is-long:not(.is-expanded) .lexicon-senses .lexicon-senses > .lexicon-sense:nth-child(n+3) {
  display: none;
}

.lexicon-card-expand {
  margin-top: 4px;
  padding: 0;
  background: none;
  border: none;
  color: var(--sefaria-blue);
  font-size: 11px;
  text-decoration: underline;
  cursor: pointer;
}

.lexicon-card-notes {
  margin-top: 6px;
  font-size: 12px;
}

.lexicon-card-notes > summary {
  cursor: pointer;
  font-size: 11px;
  color: var(--sefaria-blue);
}

.lexicon-card-note {
  margin-top: 4px;
  color: #3c3c3c;
}

.lexicon-card-note-label {
  font-weight: 600;
}

.lexicon-card-credit {
  margin-top: 6px;
  padding-top: 4px;
  border-top: 1px solid var(--row-divider);
  font-size: 10.5px;
  color: var(--muted);
}

/* =============================================================
   BOOKMARKS SECTION
   ============================================================= */

.lexicon-bookmarks-section {
  margin-top: 10px;
}

.lexicon-bookmarks-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: 4px 2px;
  user-select: none;
}

.lexicon-bookmarks-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
}

.lexicon-bookmarks-toggle {
  font-size: 10px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.lexicon-bookmarks-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.lexicon-bookmark-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 4px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.1s;
}

.lexicon-bookmark-row:hover {
  background: var(--lighter-grey);
}

.lexicon-bookmark-headword {
  font-family: 'Frank Ruhl Libre', 'David', Georgia, serif;
  font-size: 13px;
  direction: rtl;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
  color: var(--text);
}

.lexicon-bookmark-source {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.lexicon-bookmark-remove {
  background: none;
  border: none;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  padding: 0 2px;
  opacity: 0.5;
  line-height: 1;
  flex-shrink: 0;
  transition: opacity 0.1s, color 0.1s;
}

.lexicon-bookmark-remove:hover {
  opacity: 1;
  color: #c0392b;
}

/* =============================================================
   INSERT BUTTON — lexicon success feedback
   ============================================================= */

#insert-source.lexicon-insert-success {
  background: #1e7e34 !important;
  border-color: #1e7e34 !important;
}

</style>
