<style>
/*
 * utilities.css — typography helpers, brand header, badges, icons,
 *                 corpus colors, autocomplete, modals, toast, animations

/* =============================================================
   ACCESSIBILITY
   ============================================================= */

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  border: 0;
  clip: rect(0, 0, 0, 0);
}


/* =============================================================
   TYPOGRAPHY HELPERS
   ============================================================= */

.alef {
  font-size: 1.15em;
}

.branding-text {
  padding-top: 0.5em;
}

.helper-text,
.experience-copy,
.experience-note,
.advanced-version-note {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}

.helper-text {
  margin: 4px 0 0;
}

.section-label {
  margin: 14px 0 8px;
  color: #444;
  font-size: 13px;
  font-weight: 600;
}

.subsection-label,
.compact-section-label,
.session-library-title {
  color: #4d596d;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.subsection-label {
  margin: 12px 0 6px;
  color: #5d6878;
}

.section-muted {
  opacity: 0.55;
}

/* =============================================================
   BRAND HEADER
   ============================================================= */

.brand-header {
  margin-bottom: 10px;
  padding: 14px 14px 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.brand-eyebrow {
  margin-bottom: 4px;
  color: var(--sefaria-blue);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.brand-title {
  margin: 0;
  color: var(--sefaria-blue);
  font-family: "Frank Ruhl Libre", "Noto Serif Hebrew", serif;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.15;
}

.brand-subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

/* =============================================================
   QUERY INTEL
   ============================================================= */

.query-hint {
  color: var(--muted);
  font-size: 12px;
}

.query-intel-row {
  display: none;
}

.query-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  color: #35527d;
  background: var(--selected-soft);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

.query-badge.commentary { color: #6c4e94; background: #f4ecfb; }
.query-badge.direct     { color: #2c6d46; background: #e7f5ec; }
.query-badge.fulltext   { color: #946328; background: #fdf3e8; }
.query-badge.url        { color: #35527d; background: #eaf0f8; }

/* =============================================================
   ICONS / BADGES
   ============================================================= */

.samekh,
.samekh-sized {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
}

.sefaria-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  color: var(--selected);
  border-radius: 999px;
  font-family: "SBL Hebrew", "Ezra SIL", "Frank Ruhl Libre", serif;
  font-size: 16px;
  font-weight: 700;
}

.sefaria-badge.samekh {
  color: #28598c;
}

.tool-arrow,
.arrow-mini,
.external-link-icon {
  font-size: 12px;
  line-height: 1;
}

.arrow-mini,
.external-link-icon {
  transform: translateY(-1px);
}

.tool-icon-stack {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  line-height: 1;
}

/* Icon sizing normalisation (symbol/emoji icons in non-footer contexts) */
.footer-icon,
.footer-gear-icon,
.footer-running-icon,
.link-emoji {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.15em;
  height: 1.15em;
  font-size: 18px;
  line-height: 1;
  vertical-align: middle;
}

.link-emoji {
  font-size: 17px;
}

/* Vertical alignment helpers for mixed controls */
.results-tool.lang-tool-button,
.restore-corpus-select,
.section-label.accordion-summary,
.display-choice-summary,
.result-group-remove,
.result-pin-button,
.mode-card,
.layout-option,
.restore-corpus-button,
.translation-language-toggle,
.search-sort-select {
  vertical-align: middle;
}

.results-tool.lang-tool-button {
  font-size: 10px;
}

/* =============================================================
   WARNINGS / STATUS
   ============================================================= */

.insert-warning {
  margin-bottom: 8px;
  padding: 10px 12px;
  color: #8d1f1a;
  background: #fdecea;
  border: 1px solid #d93025;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.45;
}

/* =============================================================
   CORPUS BACKGROUND COLORS (option pills / filter chips)
   ============================================================= */

.corpus-option {
  color: #1f2b3a;
}

.corpus-apocrypha  { background: rgba(126,  63,  63, 0.1); }
.corpus-chasidut   { background: rgba(  0,  98, 124, 0.1); }
.corpus-halakhah   { background: rgba( 34, 102,  85, 0.1); }
.corpus-kabbalah   { background: rgba( 80,  70, 130, 0.1); }
.corpus-liturgy    { background: rgba(  0, 122, 122, 0.1); }
.corpus-midrash    { background: rgba(166,  77, 121, 0.1); }
.corpus-mishnah    { background: rgba(111,  76, 155, 0.1); }
.corpus-modernworks{ background: rgba( 36,  99,  61, 0.1); }
.corpus-musar      { background: rgba(123,  91,  38, 0.1); }
.corpus-other      { background: rgba(112, 112, 112, 0.1); }
.corpus-philosophy { background: rgba( 90,  90,  90, 0.1); }
.corpus-reference  { background: rgba( 82,  82,  82, 0.1); }
.corpus-talmud     { background: rgba(178, 102,   0, 0.1); }
.corpus-tanaitic   { background: rgba(168,  95,   0, 0.1); }
.corpus-tanakh     { background: rgba( 24,  94, 146, 0.1); }

/* =============================================================
   COMPONENT STATE HELPERS
   ============================================================= */

/* =============================================================
   AUTOCOMPLETE (jQuery UI override)
   ============================================================= */

.ui-autocomplete {
  display: none !important; /* Controlled by JS; hidden until JS activates */
  z-index: 10020 !important;
  max-height: 260px;
  overflow-x: hidden;
  overflow-y: auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
}

.ui-menu .ui-menu-item a {
  border: 0;
  font-size: 13px;
}

/* =============================================================
   TOAST NOTIFICATION
   ============================================================= */

.sidebar-toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  z-index: 9999;
  max-width: calc(100% - 32px);
  padding: 10px 14px;
  color: #fff;
  background: rgba(24, 52, 93, 0.94);
  /* Not a pill: notices wrap to several lines in a 300px sidebar. */
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
  line-height: 1.4;
  opacity: 0;
  transform: translateX(-50%);
  transition: opacity 0.18s ease;
}

.sidebar-toast.is-visible {
  opacity: 1;
}

/* =============================================================
   NOTICE BACKDROP + CARD (system alerts / confirmations)
   ============================================================= */

.sidebar-notice-backdrop {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.26);
}

.sidebar-notice-backdrop[hidden] {
  display: none !important;
}

/* Fixed width appropriate for sidebar context; was min(360px, calc(100vw-32px)) */
.sidebar-notice-card {
  width: 100%;
  max-width: 280px;
  padding: 16px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
}

.sidebar-notice-card h2 {
  margin: 0 0 8px;
  font-size: 16px;
}

.sidebar-notice-message {
  margin: 0 0 12px;
  line-height: 1.45;
}

.sidebar-notice-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* =============================================================
   BUSY OVERLAY (showBusyOverlay / hideBusyOverlay)
   A card over a dimmed sidebar while the document is being changed.
   The Sefarrow fills and empties clockwise inside a spinning ring;
   the glyph under the label says what kind of work it is
   ([data-kind] = insert | fetch | selection | transform).
   ============================================================= */

@property --busy-from {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

@property --busy-to {
  syntax: "<angle>";
  inherits: false;
  initial-value: 360deg;
}

aside.busy-overlay {
  position: fixed;
  inset: 0;
  z-index: 9000;
  width: auto;
  height: auto;
  background: var(--busy-scrim);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}

.busy-card {
  position: absolute;
  top: 50%;
  left: 50%;
  box-sizing: border-box;
  width: 220px;
  max-width: calc(100% - 32px);
  padding: 22px 16px 18px;
  text-align: center;
  background: var(--panel);
  border-radius: 16px;
  box-shadow: var(--busy-card-shadow);
  transform: translate(-50%, -50%);
  animation: busy-card-in 0.22s ease-out;
}

.busy-emblem {
  position: relative;
  width: 68px;
  height: 68px;
  margin: 0 auto;
}

.busy-ring {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  border: 3px solid var(--busy-accent-soft);
  border-top-color: var(--busy-accent);
  border-radius: 50%;
  animation: preview-spin 1.1s linear infinite;
}

/* Fully opaque between --busy-from and --busy-to, a faint ghost elsewhere. */
.busy-overlay .busy-logo {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 40px;
  height: 40px;
  --busy-from: 0deg;
  --busy-to: 360deg;
  -webkit-mask-image: conic-gradient(rgba(0, 0, 0, 0.16) var(--busy-from), #000 var(--busy-from) var(--busy-to), rgba(0, 0, 0, 0.16) var(--busy-to));
  mask-image: conic-gradient(rgba(0, 0, 0, 0.16) var(--busy-from), #000 var(--busy-from) var(--busy-to), rgba(0, 0, 0, 0.16) var(--busy-to));
  animation: busy-logo-sweep 2.6s ease-in-out infinite;
}

.busy-label {
  margin: 14px 0 12px;
  color: var(--sefaria-blue);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
}

/* Glyph: three "lines of text" by default (insert, selection). */
.busy-glyph {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  width: 76px;
  height: 22px;
  margin: 0 auto;
}

.busy-glyph > span {
  display: block;
  width: 100%;
  height: 4px;
  background-color: var(--busy-accent-soft);
  background-image: linear-gradient(var(--busy-accent), var(--busy-accent));
  background-repeat: no-repeat;
  background-size: 0% 100%;
  border-radius: 2px;
  animation: busy-line-write 2.1s ease-in-out infinite;
}

.busy-glyph > span:nth-child(2) { width: 84%; animation-delay: 0.35s; }
.busy-glyph > span:nth-child(3) { width: 58%; animation-delay: 0.7s; }

/* Selection: the first line is the selected citation, the rest is the source. */
.busy-overlay[data-kind="selection"] .busy-glyph > span:first-child {
  background-color: var(--busy-highlight);
  animation: none;
}

/* Transform: a highlighter sweeps across text that is already there. */
.busy-overlay[data-kind="transform"] .busy-glyph > span {
  background-color: var(--busy-text-line);
  background-image: linear-gradient(90deg, transparent, var(--busy-highlight), transparent);
  background-size: 60% 100%;
  background-position: -100% 0;
  animation-name: busy-line-sweep;
  animation-duration: 1.6s;
}

/* Fetch: three dots dropping in, like a download. */
.busy-overlay[data-kind="fetch"] .busy-glyph {
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.busy-overlay[data-kind="fetch"] .busy-glyph > span {
  width: 8px;
  height: 8px;
  background: var(--busy-accent);
  border-radius: 50%;
  animation: busy-dot-drop 1.2s ease-in infinite;
}

.busy-overlay[data-kind="fetch"] .busy-glyph > span:nth-child(2) { width: 8px; animation-delay: 0.2s; }
.busy-overlay[data-kind="fetch"] .busy-glyph > span:nth-child(3) { width: 8px; animation-delay: 0.4s; }

/* Search in progress: a magnifying glass scans above the skeleton results. */
.search-busy-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  padding: 2px 2px 0;
  color: var(--sefaria-blue);
  font-size: 12px;
  font-weight: 600;
  list-style: none;
}

.search-busy-lens {
  position: relative;
  flex: none;
  box-sizing: border-box;
  width: 11px;
  height: 11px;
  margin-right: 12px;
  border: 2px solid var(--busy-accent);
  border-radius: 50%;
  animation: busy-lens-scan 1.4s ease-in-out infinite alternate;
}

.search-busy-lens::after {
  position: absolute;
  top: 8px;
  left: 7px;
  width: 5px;
  height: 2px;
  background: var(--busy-accent);
  border-radius: 1px;
  transform: rotate(45deg);
  content: "";
}

@media (prefers-reduced-motion: reduce) {
  .busy-card { animation: none; }
  .busy-ring { animation-duration: 3s; }
  .busy-overlay .busy-logo { animation-duration: 6s; }
  .busy-glyph > span,
  .busy-overlay[data-kind="transform"] .busy-glyph > span,
  .busy-overlay[data-kind="fetch"] .busy-glyph > span {
    animation-duration: 5s;
  }
  .search-busy-lens { animation: none; }
}

/* =============================================================
   ANIMATIONS
   ============================================================= */

/* Fill clockwise, hold, then empty clockwise. */
@keyframes busy-logo-sweep {
  0%       { --busy-from: 0deg;   --busy-to: 0deg; }
  45%, 55% { --busy-from: 0deg;   --busy-to: 360deg; }
  100%     { --busy-from: 360deg; --busy-to: 360deg; }
}

@keyframes busy-card-in {
  from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

@keyframes busy-line-write {
  0%       { background-size: 0% 100%; }
  45%, 85% { background-size: 100% 100%; }
  100%     { background-size: 100% 100%; opacity: 0.35; }
}

@keyframes busy-line-sweep {
  from { background-position: -100% 0; }
  to   { background-position: 200% 0; }
}

@keyframes busy-dot-drop {
  0%   { opacity: 0; transform: translateY(-10px); }
  40%  { opacity: 1; transform: translateY(0); }
  75%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(6px); }
}

@keyframes busy-lens-scan {
  from { transform: translateX(0); }
  to   { transform: translateX(10px); }
}

@keyframes preview-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes sidebar-shimmer {
  100% { transform: translateX(100%); }
}

@keyframes skeleton-shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}

@keyframes restorePulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}
</style>
