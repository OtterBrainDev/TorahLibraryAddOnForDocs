<script>
  function uiById(id) {
    return document.getElementById(id);
  }

  function escapeHTML(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---- Sefaria HTML sanitizing --------------------------------------------
  //
  // Sefaria's library texts legitimately carry markup (<b>, <i>, footnote
  // <sup>/<i class="footnote">), and the preview is supposed to render it. But
  // that markup is untrusted input: search highlights and Voices snippets come
  // from user-published source sheets, and the sidebar that renders them holds
  // google.script.run — script running there can call any server function
  // against the user's live document. It also must not reference a third-party
  // host: the privacy policy (docs/PRIVACY.md §2.2) lists every host the
  // add-on's pages load from, and an <img src> would make the reader's
  // browser fetch from one it does not list.
  //
  // So this is an ALLOWLIST, not a strip. An earlier version removed a list of
  // known-bad elements and kept everything else, and was bypassed by mutation
  // XSS: <math>/<mglyph>/<xmp> markup that serializes to one string and
  // re-parses (when the caller hands the result to jQuery) into a different
  // tree containing an <img onerror> the sanitizer never saw. The defences:
  //
  //   1. Only the inline typography Sefaria uses survives, and only in the
  //      HTML namespace. SVG/MathML, raw-text elements (xmp, style,
  //      noembed, ...) and everything else are removed or unwrapped.
  //   2. Only class/dir/lang attributes survive. No handlers, no URLs, no ids
  //      (DOM clobbering), no data-* (the sidebar's delegated click handlers
  //      read data-ref).
  //   3. The output is re-parsed and must come back as the same string with
  //      the same allowlisted-only tree. If it does not, the parser mutated it,
  //      and the caller gets escaped plain text instead of markup.

  var SANITIZE_ALLOWED_ELEMENTS_ = [
    'b', 'i', 'em', 'strong', 'u', 's', 'sup', 'sub', 'small', 'big',
    'span', 'br', 'p', 'div', 'ul', 'ol', 'li'
  ];

  // Removed together with everything inside them. Their content is either
  // executable, not text at all, or parsed by rules (raw text, foreign
  // content) that differ between the first parse and the caller's re-parse.
  var SANITIZE_DROP_WITH_CONTENT_ = [
    'script', 'style', 'template', 'noscript', 'iframe', 'frame', 'frameset',
    'object', 'embed', 'applet', 'svg', 'math', 'xmp', 'noembed', 'noframes',
    'plaintext', 'textarea', 'title', 'select', 'option', 'head', 'link',
    'meta', 'base', 'video', 'audio', 'source', 'track', 'canvas', 'picture'
  ];

  var SANITIZE_ALLOWED_ATTRIBUTES_ = ['class', 'dir', 'lang'];

  var HTML_NAMESPACE_ = 'http://www.w3.org/1999/xhtml';

  /**
   * Parse HTML into an INERT document. DOMParser does not load subresources and
   * does not run scripts, which is the whole point — assigning to the innerHTML
   * of a detached <div> still causes the browser to fetch any <img src> it
   * finds, so that is not a safe way to inspect untrusted markup.
   */
  function parseInertHtml(html) {
    if (typeof DOMParser === 'undefined') return null;
    try {
      // Wrap explicitly rather than relying on the parser inserting an implicit
      // <body> around a bare fragment. Browsers do that per spec; not every
      // DOM implementation does, and a parser that skips it silently returns an
      // EMPTY document — which would make this function look like it sanitized
      // the content when it had in fact discarded all of it.
      return new DOMParser().parseFromString(
        '<html><body>' + String(html || '') + '</body></html>',
        'text/html'
      );
    } catch (error) {
      return null;
    }
  }

  function isHtmlNamespace_(element) {
    // linkedom (the test DOM) leaves namespaceURI unset for HTML elements.
    return !element.namespaceURI || element.namespaceURI === HTML_NAMESPACE_;
  }

  function sanitizeChildren_(doc, parent) {
    Array.prototype.slice.call(parent.childNodes).forEach(function (node) {
      if (node.nodeType === 3) return; // text is escaped on serialization
      if (node.nodeType !== 1) { // comments, processing instructions, CDATA
        parent.removeChild(node);
        return;
      }

      var tag = String(node.localName || node.tagName || '').toLowerCase();
      if (!isHtmlNamespace_(node) || SANITIZE_DROP_WITH_CONTENT_.indexOf(tag) >= 0) {
        parent.removeChild(node);
        return;
      }

      if (tag === 'img') {
        // Keep an image's alt text so a footnote or figure caption is not
        // silently lost.
        var alt = String(node.getAttribute('alt') || '').trim();
        if (alt) parent.replaceChild(doc.createTextNode(alt), node);
        else parent.removeChild(node);
        return;
      }

      sanitizeChildren_(doc, node);

      if (SANITIZE_ALLOWED_ELEMENTS_.indexOf(tag) < 0) {
        // Anything else (<a>, tables, <font>, unknown tags): keep what it
        // says, drop the element and wherever it pointed.
        while (node.firstChild) parent.insertBefore(node.firstChild, node);
        parent.removeChild(node);
        return;
      }

      Array.prototype.slice.call(node.attributes || []).forEach(function (attribute) {
        var name = String(attribute.name || '').toLowerCase();
        if (SANITIZE_ALLOWED_ATTRIBUTES_.indexOf(name) < 0) {
          node.removeAttribute(attribute.name);
        }
      });
    });
  }

  // True when every element under root is an allowlisted HTML element carrying
  // only allowlisted attributes, and there is nothing but elements and text.
  function isAllowlistedTree_(root) {
    return Array.prototype.every.call(root.childNodes, function (node) {
      if (node.nodeType === 3) return true;
      if (node.nodeType !== 1 || !isHtmlNamespace_(node)) return false;
      var tag = String(node.localName || node.tagName || '').toLowerCase();
      if (SANITIZE_ALLOWED_ELEMENTS_.indexOf(tag) < 0) return false;
      var attributesOk = Array.prototype.every.call(node.attributes || [], function (attribute) {
        return SANITIZE_ALLOWED_ATTRIBUTES_.indexOf(String(attribute.name || '').toLowerCase()) >= 0;
      });
      return attributesOk && isAllowlistedTree_(node);
    });
  }

  function sanitizeSourceHtml(html) {
    var raw = String(html || '');
    if (!raw) return '';

    // No DOMParser, or a parse that cannot be trusted: plain escaped text
    // rather than unchecked markup. Losing italics is a much smaller cost.
    var plainText = function () {
      return escapeHTML(raw.replace(/<[^>]*>/g, ''));
    };

    var doc = parseInertHtml(raw);
    if (!doc || !doc.body) return plainText();

    // Output is read from body alone, so anything a stray "</body>" hoisted
    // out of it is simply not emitted.
    sanitizeChildren_(doc, doc.body);
    var clean = doc.body.innerHTML;

    // Mutation check: the caller will hand this string to the HTML parser
    // again. It must come back as exactly the same allowlisted tree.
    var reparsed = parseInertHtml(clean);
    if (!reparsed || !reparsed.body ||
        reparsed.body.innerHTML !== clean ||
        !isAllowlistedTree_(reparsed.body)) {
      return escapeHTML(String(doc.body.textContent || ''));
    }
    return clean;
  }
</script>
