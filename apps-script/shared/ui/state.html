<script>
  window.UI_STATE = window.UI_STATE || {};

  function getAppConfig() {
    return window.APP_CONFIG || {};
  }

  function isTextsMode(mode) {
    return String(mode || '') === 'texts';
  }

  function isVoicesMode(mode) {
    return String(mode || '') === 'voices';
  }

  function isExperimentalMode(mode) {
    return String(mode || '') === 'experimental';
  }

  function mergeEffectivePreferences(accountPreferences, sessionPreferences, allowSessionOverrides) {
    return allowSessionOverrides
      ? mergePreferenceLayers(accountPreferences, sessionPreferences)
      : mergePreferenceLayers(accountPreferences, {});
  }

  function hasSessionPreferenceOverrides(sessionPreferences) {
    return Object.keys(sessionPreferences || {}).length > 0;
  }

  // ── Text-search corpus ordering ──────────────────────────────────────────
  // Shared by the sidebar (applies the order / exclusions to text-search
  // results) and the preferences dialog (edits them). Keys are the slugged
  // cluster labels produced by getResultCorpusKey() in results-render.html.
  // The "Library" group (direct reference lookups, title and name matches)
  // is not listed: it is always pinned first and can't be reordered or
  // excluded. "Close matches" (fuzzy title suggestions, built in
  // buildFuzzyLibraryMatches) is the near-match group: second by default,
  // reorderable like any corpus. Corpora missing from this catalog still
  // render, after every listed corpus, in the order the search returned them.
  var DIRECT_MATCH_CORPUS_KEY = 'library';
  var NEAR_MATCHES_CORPUS_KEY = 'close-matches';
  var SEARCH_CORPUS_CATALOG = [
    { key: NEAR_MATCHES_CORPUS_KEY, label: 'Close matches' },
    { key: 'tanakh', label: 'Tanakh' },
    { key: 'mishnah', label: 'Mishnah' },
    { key: 'talmud', label: 'Talmud' },
    { key: 'midrash', label: 'Midrash' },
    { key: 'halakhah', label: 'Halakhah' },
    { key: 'kabbalah', label: 'Kabbalah' },
    { key: 'liturgy', label: 'Liturgy' },
    { key: 'jewish-thought', label: 'Jewish Thought' },
    { key: 'tosefta', label: 'Tosefta' },
    { key: 'chasidut', label: 'Chasidut' },
    { key: 'musar', label: 'Musar' },
    { key: 'responsa', label: 'Responsa' },
    { key: 'second-temple', label: 'Second Temple' },
    { key: 'commentary', label: 'Commentary' },
    { key: 'targum', label: 'Targum' },
    { key: 'reference', label: 'Reference' }
  ];

  function isKnownSearchCorpusKey(key) {
    return SEARCH_CORPUS_CATALOG.some(function (entry) { return entry.key === key; });
  }

  // Stored order (JSON array) → full catalog order. Unknown keys are
  // dropped, duplicates collapsed, and catalog entries the stored value
  // doesn't mention are appended in catalog order. An empty / missing
  // value yields the built-in order.
  function normalizeSearchCorpusOrder(value) {
    var seen = {};
    var out = [];
    parseStoredArrayPreference(value, []).forEach(function (key) {
      key = String(key || '').trim();
      if (!isKnownSearchCorpusKey(key) || seen[key]) return;
      seen[key] = true;
      out.push(key);
    });
    SEARCH_CORPUS_CATALOG.forEach(function (entry) {
      if (!seen[entry.key]) out.push(entry.key);
    });
    return out;
  }

  // Stored exclusions (JSON array) → list of corpus keys hidden from text
  // search. The pinned Library group can never be excluded.
  function normalizeSearchCorpusExcluded(value) {
    var seen = {};
    return parseStoredArrayPreference(value, []).map(function (key) {
      return String(key || '').trim();
    }).filter(function (key) {
      if (!key || key === DIRECT_MATCH_CORPUS_KEY || seen[key]) return false;
      seen[key] = true;
      return true;
    });
  }

    return LEXICON_DICTIONARY_CATALOG.some(function (entry) { return entry.key === key; });

  // Stored order → the full catalog order, as normalizeSearchCorpusOrder.

    var seen = {};
    var out = [];
    parseStoredArrayPreference(value, []).forEach(function (key) {

      out.push(key);

      if (!seen[entry.key]) out.push(entry.key);
    });
    return out;
  }

    var seen = {};

  function voicesTopicMatchText_(value) {
    return ' ' + String(value || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  }

  // The catalog entry a sheet is filed under ({ key, label, accent }).
  function voicesTopicCategoryOf(sheet) {
    var candidates = (Array.isArray(sheet && sheet.topics) ? sheet.topics : [])
      .map(function (topic) { return topic && typeof topic === 'object' ? (topic.en || topic.title || '') : topic; })
      .concat([sheet && (sheet.label || sheet.title) || '']);
    for (var i = 0; i < candidates.length; i++) {
      var text = voicesTopicMatchText_(candidates[i]);
      if (text === '  ') continue;
      var best = null;
      var bestScore = 0;
      VOICES_TOPIC_CATALOG.forEach(function (category) {
        (category.keywords || []).forEach(function (keyword) {
          var word = voicesTopicMatchText_(keyword).trim();
          if (text.indexOf(' ' + word + ' ') < 0 && text.indexOf(' ' + word + 's ') < 0) return;
          var score = word.split(' ').length * 100 + word.length;
          if (score > bestScore) { best = category; bestScore = score; }
        });
      });
      if (best) return best;
    }
    return VOICES_TOPIC_CATALOG[VOICES_TOPIC_CATALOG.length - 1];
  }

  function isKnownVoicesTopicKey(key) {
    return VOICES_TOPIC_CATALOG.some(function (entry) { return entry.key === key; });
  }

    });
    return out;
  }

  // Stored value → list of hidden language codes (unknown codes dropped).
  function normalizeHiddenTranslationLanguages(value) {
    var seen = {};
    return parseStoredArrayPreference(value, []).map(function (code) {
      return String(code || '').trim().toLowerCase();
    }).filter(function (code) {
      var known = TRANSLATION_LANGUAGE_CATALOG.some(function (entry) { return entry.code === code; });
      if (!known || seen[code]) return false;
      seen[code] = true;
      return true;
    });
  }

  // A language name as the filter box compares it: case, accents, vowel points
  // and apostrophes aside (francais = français, יידיש = ייִדיש, צ'כית = צ׳כית),
  // any other punctuation a space (judeo spanish = Judeo-Spanish).
  function foldTranslationLanguageName(value) {
    return String(value || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase()
      .replace(/ł/g, 'l').replace(/ײ/g, 'יי').replace(/װ/g, 'וו').replace(/ױ/g, 'וי')
      .replace(/['‘’ʼ`׳"״\u200c\u200d]/g, '')
      .replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }

  var translationLanguageNameIndex_ = null;

  // Every catalog name, folded: [{ name, code }]. Built once.
  function translationLanguageNameIndex() {
    if (translationLanguageNameIndex_) return translationLanguageNameIndex_;
    var index = [];
    TRANSLATION_LANGUAGE_CATALOG.forEach(function (lang) {
      // 'Farsi (Persian)' is two names.
      lang.label.split(/[()]/).concat(lang.names || []).forEach(function (name) {
        var folded = foldTranslationLanguageName(name);
        if (!folded) return;
        index.push({ name: folded, code: lang.code });
        // An Arabic name carries the article: العربية is also typed عربية.
        if (/^ال./.test(folded)) index.push({ name: folded.slice(2), code: lang.code });
      });
    });
    translationLanguageNameIndex_ = index;
    return index;
  }

  // The catalog languages a filter-box query names, as codes. A code typed
  // exactly is that language alone, as it always was ('es' is not Esperanto
  // too); anything else is every language with a name that starts with it, in
  // English, in the language itself or in another catalog language ('fre',
  // 'français', 'Französisch', 'צרפתית' → ['fr']). [] when it names none.
  function translationLanguageCodesMatching(query) {
    var folded = foldTranslationLanguageName(query);
    if (!folded) return [];
    var exact = TRANSLATION_LANGUAGE_CATALOG.filter(function (lang) { return lang.code === folded; })[0];
    if (exact) return [exact.code];
    var codes = [];
    translationLanguageNameIndex().forEach(function (entry) {
      if (entry.name.indexOf(folded) === 0 && codes.indexOf(entry.code) < 0) codes.push(entry.code);
    });
    return codes;
  }
</script>
