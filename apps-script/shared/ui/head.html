<!--
  Content Security Policy — deliberately narrow.

  This restricts ONLY image loading, plugin embedding, and <base href>. It does
  NOT set default-src, script-src, style-src or connect-src, and that omission
  is intentional rather than an oversight: HtmlService injects its own bootstrap
  script and the google.script.run bridge into this page, and every one of the
  sidebar's own scripts is inline. A script-src that misses something Google
  injects would not fail loudly — it would silently break google.script.run,
  which is the entire server bridge, in a surface that is hard to test outside a
  real Google Doc.

  What it does buy: a text served by Sefaria cannot make this page fetch an
  image from an arbitrary host. Sefaria's own server-side allowlist permits
  <img src>, so that was reachable. sanitizeSourceHtml (shared/ui/dom.html)
  strips such markup before it is rendered; this is the backstop for any render
  path added later that forgets to call it, and it covers the source-sheet and
  lexicon surfaces too. docs/PRIVACY.md states the add-on contacts no host other
  than sefaria.org — between these two, that is enforced rather than promised.

  If you widen this, verify in a real Docs sidebar, not just in preview.
-->
<meta http-equiv="Content-Security-Policy" content="img-src 'self' data: https://www.sefaria.org https://the-merkaz.org https://ssl.gstatic.com https://*.googleusercontent.com https://*.gstatic.com; object-src 'none'; base-uri 'self'">
<base target="_top">
<link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons.css">
<!--
  jQuery 3.7.1, pinned with Subresource Integrity.

  Was 1.9.1 (2013), loaded protocol-relative and unpinned. That version carries
  known XSS-relevant advisories, and it is the code interpreting every
  $(...).html() call in this add-on — jQuery's .html() executes script elements
  in the markup it is given, which plain innerHTML does not, so the version that
  implements it matters more here than the raw call count suggests.

  (Deliberately no literal script tag written out in this comment: QC checks 2
  and 4 count tags textually and cannot tell a comment from real markup.)

  The integrity hash was computed from the bytes this CDN actually serves, not
  copied from a published list. It requires CORS, which ajax.googleapis.com
  provides (Access-Control-Allow-Origin: *). If the hash is ever wrong the
  script does not load at all and the sidebar is inert — so re-verify it, do not
  guess it, if the version is bumped.

  Kept on one line: pre_clasp_qc.sh check 4 matches the opening tag with a
  regex that has no dotall flag, so a tag split across lines is mis-read as a
  script body.

  Migration note: the codebase was audited for APIs removed between 1.9 and 3.x
  (.andSelf, .size, .live/.die, .load/.unload/.error shorthands, $.browser,
  two-argument .toggle) — none were in use. The single ':visible' selector is
  safe: jQuery 3 widened that test rather than narrowing it.
-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
