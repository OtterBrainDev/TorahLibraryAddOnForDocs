<style>
/*
 * shared/insertion-options/css — the Layout pickers
 * (shared/insertion-options/markup.html). Used by the sidebar's Layout tray,
 * Preferences and the Link Texts dialog's "Customize this insertion" panel;
 * colours come from css/tokens.html, which each host includes first.
 * Edit it here, not in a host.
 *
 * Each picker is a label over a segmented control (one track, the chosen
 * option raised on it), the pattern Google Docs and most settings panels use
 * for a choice of two to four. The pickers stack in a narrow host (the
 * sidebar) and sit side by side where there is room (Preferences). The line
 * options under them are switch rows: .cc-row in shared/composition-card/css.
 */

.display-layout-section {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px 16px;
  align-items: start;
}

.display-choice-detail {
  min-width: 0;
}

.display-choice-label {
  margin: 0 0 5px;
  color: var(--row-sublabel);
  font-size: 12px;
  font-weight: 600;
}

/* =============================================================
   SEGMENTED CONTROLS (Display and Arrangement)
   ============================================================= */

.mode-card-group,
.layout-option-group {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 2px;
  padding: 2px;
  background: var(--seg-track);
  border-radius: 9px;
}

.mode-card,
.layout-option {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: 36px;
  padding: 0 6px;
  overflow: hidden;
  cursor: pointer;
  background: transparent;
  border: 0;
  border-radius: 7px;
  color: var(--row-sublabel);
  text-align: center;
  transition: background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
}

.mode-card:hover,
.layout-option:hover {
  color: var(--sefaria-blue);
  background: rgba(255, 255, 255, 0.55);
}

.mode-card.selected,
.layout-option.selected {
  color: var(--seg-selected-text);
  background: var(--seg-selected-bg);
  box-shadow: var(--seg-shadow);
}

.mode-card:focus-visible,
.layout-option:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

/* =============================================================
   DISPLAY OPTION CONTENT (A, A+א, א)
   ============================================================= */

.mode-card-content,
.mode-card-content.both {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  line-height: 1;
  white-space: nowrap;
}

.mode-card-plus {
  color: currentColor;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.mode-card-symbol {
  display: inline-block;
  color: currentColor;
  font-family: "Frank Ruhl Libre", "Noto Serif Hebrew", serif;
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
}

.mode-card-symbol.latin {
  font-family: "EB Garamond", Georgia, serif;
  font-size: 18px;
}

/* =============================================================
   ARRANGEMENT ICONS (a schematic page per layout)

   Each icon follows the other settings (updateInsertionOptions sets
   data-translit = off / below / left / right and data-lines on the group):
   the transliteration (.tr) as a strip under the Hebrew or a column of its
   own beside it, and with Line by line, the lines: the columns cut into rows
   side by side, a second line (.layout-row--next) in Stacked.
   ============================================================= */

.layout-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 30px;
  height: 20px;
  box-sizing: border-box;
  padding: 2px;
  background: #fff;
  border: 1px solid #c9c4bb;
  border-radius: 3px;
}

.layout-icon.stacked {
  flex-direction: column;
  align-items: stretch;
}

.layout-col,
.layout-row {
  display: block;
  border-radius: 1px;
}

.layout-col {
  width: 9px;
  height: 100%;
}

.layout-row {
  /* Shrinks to fit when Line by line and the transliteration add rows. */
  flex: 0 1 5px;
  width: 100%;
  min-height: 1px;
}

/* The Hebrew dark, the translation light, the transliteration between,
   whichever side each is on. */
.layout-option {
  --io-he: #1f3f75;
  --io-en: #a9b8d1;
  --io-tr: #5b7fbd;
  --io-gap: #fff;
}

.layout-option:not(.selected) {
  --io-he: #7c8595;
  --io-en: #cfd3da;
  --io-tr: #a4adbb;
}

.layout-col.he,
.layout-row.he {
  background-color: var(--io-he);
}

.layout-col.en,
.layout-row.en {
  background-color: var(--io-en);
}

.layout-col.tr,
.layout-row.tr {
  background-color: var(--io-tr);
}

/* Side by side: the translation, then the Hebrew (Right–Left), or the
   reverse; the transliteration's column left or right of the Hebrew. */
.side-by-side .layout-col.en { order: 0; }
.side-by-side.reverse .layout-col.en { order: 4; }
.side-by-side .layout-col.he { order: 2; }
.side-by-side .layout-col.tr { order: 1; display: none; }
.layout-option-group[data-translit="right"] .side-by-side .layout-col.tr { order: 3; }

.layout-option-group[data-translit="left"] .side-by-side .layout-col.tr,
.layout-option-group[data-translit="right"] .side-by-side .layout-col.tr {
  display: block;
}

.layout-option-group[data-translit="left"] .side-by-side,
.layout-option-group[data-translit="right"] .side-by-side {
  gap: 2px;
}

.layout-option-group[data-translit="left"] .side-by-side .layout-col,
.layout-option-group[data-translit="right"] .side-by-side .layout-col {
  width: 6px;
}

/* Under the Hebrew, in its column. */
.layout-option-group[data-translit="below"] .side-by-side .layout-col.he {
  background-image: linear-gradient(to bottom, transparent 0 60%, var(--io-gap) 60% 70%, var(--io-tr) 70%);
}

/* Line by line, side by side: a row per line across the columns. */
.layout-option-group[data-lines="true"] .side-by-side .layout-col {
  background-image: repeating-linear-gradient(to bottom, transparent 0 4px, var(--io-gap) 4px 5px);
}

.layout-option-group[data-lines="true"][data-translit="below"] .side-by-side .layout-col.he {
  background-image: repeating-linear-gradient(to bottom, transparent 0 2.5px, var(--io-tr) 2.5px 4px, var(--io-gap) 4px 5px);
}

/* Stacked: the Hebrew, then the translation; the transliteration (always
   under the Hebrew) and the second line only when they apply. */
.stacked .layout-row.tr,
.stacked .layout-row--next {
  display: none;
}

.layout-option-group:not([data-translit="off"]) .stacked .layout-row.tr:not(.layout-row--next) {
  display: block;
}

.layout-option-group[data-lines="true"] .stacked .layout-row--next.he,
.layout-option-group[data-lines="true"] .stacked .layout-row--next.en {
  display: block;
}

.layout-option-group[data-lines="true"]:not([data-translit="off"]) .stacked .layout-row--next.tr {
  display: block;
}

.layout-option-group:not([data-translit="off"]) .stacked,
.layout-option-group[data-lines="true"] .stacked {
  gap: 1px;
}

.layout-option-group:not([data-translit="off"]) .stacked .layout-row.tr {
  flex-basis: 2px;
}

.layout-option-group[data-lines="true"] .stacked .layout-row {
  flex-basis: 2.5px;
}

.layout-option-group[data-lines="true"]:not([data-translit="off"]) .stacked .layout-row {
  flex-basis: 1.5px;
}

.layout-option-group[data-lines="true"] .stacked .layout-row--next.he {
  margin-top: 1px;
}

/* =============================================================
   The line options: "Line by line" (#layout-rows-toggle: a table row per line
   side by side, each line then its translation in Stacked), Line numbers and
   Citation. Switch rows (.cc-row / .cc-toggle in shared/composition-card/css)
   under the pickers.
   ============================================================= */

.layout-rows-row {
  margin-top: 8px;
}

/* The composition card's transliteration Position, which only the
   side-by-side arrangements use (updateInsertionOptions). */
.cc-translit-position-row.is-inapplicable {
  display: none;
}
</style>
