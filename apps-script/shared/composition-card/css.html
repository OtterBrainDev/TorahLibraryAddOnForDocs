<style>
/* ================================
   Shared Composition Card Component
   ================================ */

.cc-card {
  margin: 4px 0 10px;
  padding: 12px 10px 10px;
  background: #fcfcfb;
  border: 1px solid #ece7df;
  border-radius: 12px;
  text-align: center;
}

.cc-header {
  margin-bottom: 10px;
  text-align: left;
}

.cc-header-label {
  color: #333;
  font-size: 13px;
  font-weight: 700;
}

.cc-header-help {
  margin-top: 2px;
  color: #666;
  font-size: 13px;
  line-height: 1.35;
}

.cc-surface {
  position: relative;
  padding: 14px 10px 10px;
  background: rgba(255,255,255,0.72);
  border: 1px solid #e7e1d7;
  border-radius: 10px;
  text-align: center;
}

.cc-title-pill {
  display: inline-block;
  margin: 0 0 10px;
  padding: 2px 6px;
  cursor: pointer;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: var(--sefaria-blue);
  font-family: "EB Garamond", Georgia, serif;
  font-size: 18px;
  line-height: 1.2;
}

.cc-title-pill.is-linked {
  text-decoration: underline;
}

.cc-title-pill[aria-pressed='false'] {
  color: #4a586b;
}

.cc-hebrew-stage {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 84px;
  padding: 14px 8px;
}

.cc-hebrew {
  min-width: 250px;
  min-height: 48px;
  color: #222;
  font-family: "Frank Ruhl Libre", "Noto Sans Hebrew", serif;
  font-size: 28px;
  line-height: 1.55;
  user-select: none;
}

.cc-hebrew-text {
  display: block;
  white-space: nowrap;
}

.cc-hebrew-text[hidden] {
  display: none !important;
}

/* Pill base — static by default, positioned inside hebrew-stage */
.cc-pill {
  display: inline-block;
  height: 22px;
  padding: 0 9px;
  cursor: pointer;
  background: #fff;
  border: 1px solid #d8d2c8;
  border-radius: 999px;
  color: var(--footer-button-text);
  font-size: 11px;
  font-weight: 700;
  line-height: 20px;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* Stage-positioned pills (cantillation + vowels) */
.cc-hebrew-stage .cc-pill {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.cc-pill--top { top: 0; }
.cc-pill--bottom { bottom: 0; }

.cc-pill.is-off {
  color: #8b8b8b;
  background: #f3f3f3;
}

.cc-pill[aria-pressed='true'] {
  color: var(--sefaria-blue);
  background: #e4edf8;
  border-color: #b7c8e2;
}

.cc-pill[aria-pressed='false'] {
  color: #4a586b;
}

.cc-pill:focus-visible,
.cc-translit-button:focus-visible,
.cc-translit-option:focus-visible {
  outline: 2px solid rgba(31, 59, 104, 0.35);
  outline-offset: 2px;
}

/* Transliteration controls */
.cc-translit-wrap {
  position: relative;
  margin-top: 8px;
}

.cc-translit-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 26px;
  padding: 0 8px;
  cursor: pointer;
  background: transparent;
  border: 1px dashed transparent;
  border-radius: 8px;
  color: #4b5563;
  font-size: 13px;
  line-height: 1.35;
}

.cc-translit-button:hover {
  background: #f8f8f7;
  border-color: #d8d2c8;
}

.cc-translit-button.is-none {
  color: #999;
  font-style: italic;
}

.cc-translit-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  z-index: 50;
  display: grid;
  min-width: 210px;
  padding: 6px;
  background: #fff;
  border: 1px solid #d8d2c8;
  border-radius: 10px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.12);
  transform: translateX(-50%);
}

.cc-translit-menu.hidden {
  display: none;
}

.cc-translit-option {
  padding: 8px 10px;
  cursor: pointer;
  background: transparent;
  border: 0;
  border-radius: 8px;
  color: #243b67;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
}

.cc-translit-option:hover,
.cc-translit-option.is-selected {
  background: #e8eef7;
  color: #1f3b68;
}

/* A row of pills under a stage (Hebrew punctuation) or in a group */
.cc-pill-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 4px;
}

/* The Source and Translation sections: <details>, closed to one line that
   says what is set, opened to the sample and its pills. */
.cc-section {
  margin-top: 8px;
  border-top: 1px solid #ece7df;
}

.cc-section-summary {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 2px 5px;
  cursor: pointer;
  list-style: none;
  text-align: left;
}

.cc-section-summary::-webkit-details-marker {
  display: none;
}

/* A chevron that turns when the section opens. */
.cc-section-summary::before {
  flex: 0 0 auto;
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 5px solid #8b8b8b;
  content: "";
  transition: transform 0.15s ease;
}

.cc-section[open] > .cc-section-summary::before {
  transform: rotate(90deg);
}

.cc-section-summary:hover .cc-section-label {
  color: var(--sefaria-blue);
}

.cc-section-summary:focus-visible {
  border-radius: 6px;
  outline: 2px solid rgba(31, 59, 104, 0.35);
  outline-offset: 2px;
}

.cc-section-label {
  flex: 0 0 auto;
  color: #6b7280;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.cc-section-state {
  min-width: 0;
  color: #8b8b8b;
  font-size: 11px;
  line-height: 1.35;
}

/* Open, each setting shows on its own pill. */
.cc-section[open] .cc-section-state {
  display: none;
}

.cc-section-body {
  padding-bottom: 4px;
}

.cc-translation-text {
  margin-top: 4px;
  color: #222;
  font-family: "EB Garamond", Georgia, serif;
  font-size: 16px;
  line-height: 1.4;
}

/* Status line */
.cc-status {
  margin-top: 8px;
  color: #6b7280;
  font-size: 11px;
  line-height: 1.35;
}

/* Translation bold and italics: a three-state pill, so it is styled by mode rather
   than aria-pressed. Keep = active, Discard = faded, Keep only = inverted.
   The pill's own weight is reset so only the glyph's <b> is bold. */
.cc-emphasis-pill {
  font-weight: 400;
}

.cc-emphasis-pill b {
  font-weight: 700;
}

.cc-emphasis-pill[data-mode='keep'] {
  color: var(--sefaria-blue);
  background: #e4edf8;
  border-color: #b7c8e2;
}

.cc-emphasis-pill.is-off {
  opacity: 0.6;
}

.cc-emphasis-pill.is-inverted {
  color: #fff;
  background: var(--sefaria-blue);
  border-color: var(--sefaria-blue);
}

/* Stacked (.cc-card.cc-card--stacked): the title, vowel and cantillation pills
   and the Hebrew in one centred column, for narrow hosts (the sidebar's Layout
   tray, the Link Texts dialog). Preferences, which is wider, leaves it off. */
.cc-card--stacked .cc-hebrew-text {
  display: block;
  width: fit-content;
  max-width: 100%;
  margin-right: auto;
  margin-left: auto;
  text-align: center;
}

.cc-card--stacked .cc-hebrew-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.cc-card--stacked .cc-hebrew {
  min-width: 0;
}

/* Fonts: a quiet button under each sample naming the font it is drawn in,
   one panel for both, and a line when the font is not one Docs has. */
.cc-font-row {
  display: flex;
  justify-content: center;
  margin-top: 6px;
}

.cc-font-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  min-height: 24px;
  padding: 0 8px;
  cursor: pointer;
  background: transparent;
  border: 1px dashed #d8d2c8;
  border-radius: 8px;
  color: #4b5563;
  font-size: 12px;
  line-height: 1.3;
}

.cc-font-chip:hover,
.cc-font-chip[aria-expanded='true'] {
  background: #f8f8f7;
  border-style: solid;
  border-color: #b7c8e2;
}

.cc-font-chip:focus-visible,
.cc-font-more:focus-visible,
.cc-font-done:focus-visible {
  outline: 2px solid rgba(31, 59, 104, 0.35);
  outline-offset: 2px;
}

.cc-font-chip-glyph {
  color: var(--sefaria-blue);
  font-family: "Noto Serif Hebrew", "Frank Ruhl Libre", serif;
  font-size: 14px;
  font-weight: 700;
}

.cc-font-chip-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cc-font-chip-caret {
  color: #8b8b8b;
  font-size: 10px;
}

.cc-font-note {
  margin: 6px auto 0;
  max-width: 34em;
  padding: 4px 8px;
  background: #fdf3e1;
  border: 1px solid #f0d9a8;
  border-radius: 6px;
  color: #6b4a00;
  font-size: 11px;
  line-height: 1.4;
}

.cc-font-note[hidden] {
  display: none;
}

.cc-font-panel {
  position: absolute;
  left: 50%;
  z-index: 60;
  width: min(300px, calc(100% - 8px));
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #d8d2c8;
  border-radius: 10px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.12);
  text-align: left;
  transform: translateX(-50%);
}

.cc-font-panel[hidden] {
  display: none;
}

.cc-font-panel-title {
  margin-bottom: 8px;
  color: #333;
  font-size: 12px;
  font-weight: 700;
}

.cc-font-panel-fields {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.cc-font-field {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.cc-font-field--font {
  flex: 1 1 auto;
}

.cc-font-field--font select {
  width: 100%;
}

.cc-font-field--size {
  flex: 0 0 76px;
}

.cc-font-field--size input {
  width: 100%;
}

.cc-font-field-label {
  color: #6b7280;
  font-size: 11px;
  font-weight: 700;
}

.cc-font-panel-help {
  margin: 8px 0 0;
  color: #4b5563;
  font-size: 11px;
  line-height: 1.4;
}

.cc-font-panel-help[hidden],
.cc-font-more[hidden] {
  display: none;
}

.cc-font-panel-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  margin-top: 10px;
}

.cc-font-more {
  margin-right: auto;
  padding: 0;
  cursor: pointer;
  background: none;
  border: 0;
  color: var(--sefaria-blue);
  font-size: 12px;
  text-decoration: underline;
}

.cc-font-done {
  padding: 4px 12px;
  cursor: pointer;
  background: var(--sefaria-blue);
  border: 1px solid var(--sefaria-blue);
  border-radius: 999px;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}
</style>
