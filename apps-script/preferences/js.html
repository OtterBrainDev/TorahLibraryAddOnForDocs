<script>
  document.addEventListener('DOMContentLoaded', function () {
    const fontMeta = {
      "Ezra SIL": { stack: "'Ezra SIL', 'SBL Hebrew', 'Times New Roman', serif" },
      "SBL Hebrew": { stack: "'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif" },
      "Arial": { stack: "Arial, 'Noto Sans Hebrew', sans-serif" },
      "David": { stack: "David, 'Times New Roman', serif" },
      "Frank Ruhl Libre": { stack: "'Frank Ruhl Libre', 'Times New Roman', serif" },
      "Noto Rashi Hebrew": { stack: "'Noto Rashi Hebrew', 'Noto Serif Hebrew', serif" },
      "Noto Sans Hebrew": { stack: "'Noto Sans Hebrew', Arial, sans-serif" },
      "Noto Serif Hebrew": { stack: "'Noto Serif Hebrew', 'Times New Roman', serif" },
      "Times New Roman": { stack: "'Times New Roman', serif" },
      "Crimson Text": { stack: "'Crimson Text', Georgia, serif" },
      "EB Garamond": { stack: "'EB Garamond', Georgia, serif" },
      "Roboto": { stack: "Roboto, Arial, sans-serif" },
      "Calibri": { stack: "Calibri, Arial, sans-serif" },
      "Georgia": { stack: "Georgia, serif" },
      "Verdana": { stack: "Verdana, Arial, sans-serif" }
    };

    const transliterationExamples = {
      simple_english: "Ve-samtem et devarai eileh al levavchem",
      traditional: "Vəśamtem ʾet-dəvaray ʾēleh ʿal-ləvavḵem",
      modern_israeli: "Ve-samtem et devarai eleh al levavkhem",
      ashkenazi: "Ve-samtem es devarai eileh al levavchem",
      academic_full: "Wəśamtem ʾet-dəvaray ʾēlleh ʿal-ləvavḵem",
      ipa_modern: "ve-samtem et dvarai ele al levavχem",
      ipa_tiberian: "wəsamtem ʔet dəvaʁaj ʔele ʕal ləvavχem"
    };

    const FONT_SIZE_FIELDS = ['hebrew_font_size','translation_font_size','transliteration_font_size','source_title_font_size','sefaria_link_font_size'];

    const overrideChars = ["א","ב","ג","ד","ה","ו","ז","ח","ט","י","כ","ך","ל","מ","ם","נ","ן","ס","ע","פ","ף","צ","ץ","ק","ר","ש","ת"];
    const customReplacementFields = [
      'meforash_replacement',
      'yaw_replacement',
      'elodim_replacement',
      'god_replacement'
    ];

    let transliterationOverrides = {};
    let selectedOverrideChar = "";

    function byId(id) {
      return document.getElementById(id);
    }

    function encodeStyleState(flags) {
      return flags.length ? flags.sort().join(',') : 'normal';
    }

    function decodeStyleState(value) {
      if (!value || value === 'normal') return [];
      return String(value).split(',').filter(Boolean);
    }

    function applyPreviewStyles(previewId, styleInputId) {
      const preview = byId(previewId);
      const input = byId(styleInputId);
      if (!preview || !input) return;
      const flags = decodeStyleState(input.value);
      preview.style.fontWeight = flags.indexOf('bold') >= 0 ? '700' : '400';
      preview.style.fontStyle = flags.indexOf('italic') >= 0 ? 'italic' : 'normal';
      preview.style.textDecoration = flags.indexOf('underline') >= 0 ? 'underline' : 'none';
    }

    function applyStyleControlState(inputId) {
      const input = byId(inputId);
      const flags = decodeStyleState(input ? input.value : '');
      const container = document.querySelector('[data-style-control="' + inputId + '"]');
      if (!container) return;
      container.querySelectorAll('.style-btn').forEach(function(btn) {
        btn.classList.toggle('active', flags.indexOf(btn.getAttribute('data-style-flag')) >= 0);
      });
    }

    function bindStyleControl(inputId, previewId) {
      const input = byId(inputId);
      const container = document.querySelector('[data-style-control="' + inputId + '"]');
      if (!input || !container) return;
      container.querySelectorAll('.style-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const flags = decodeStyleState(input.value);
          const flag = btn.getAttribute('data-style-flag');
          const idx = flags.indexOf(flag);
          if (idx >= 0) flags.splice(idx, 1); else flags.push(flag);
          input.value = encodeStyleState(flags);
          applyStyleControlState(inputId);
          applyPreviewStyles(previewId, inputId);
        });
      });
    }

    function updateFontPreview(selectId, previewId) {
      const select = byId(selectId);
      const preview = byId(previewId);
      if (!select || !preview) return;
      const meta = fontMeta[select.value];
      // "Match the document" has no font of its own: show the dialog's.
      preview.style.fontFamily = meta ? meta.stack : '';
    }

    function updateStandardPreview(selectId, previewId, styleId) {
      const select = byId(selectId);
      const preview = byId(previewId);
      if (!select || !preview) return;
      updateFontPreview(selectId, previewId);
      const sizeInput = byId(selectId + '_size') || byId(selectId.replace('_font', '_font_size'));
      preview.style.fontSize = (sizeInput && sizeInput.value) ? Number(sizeInput.value) + 'px' : '';
      applyPreviewStyles(previewId, styleId);
    }

    function updateTransliterationPreview() {
      const scheme = byId('transliteration_scheme');
      const preview = byId('transliteration_preview');
      if (!scheme || !preview) return;
      // Both operands are local constants: the <span> literal is static, and
      // transliterationExamples is a hand-authored const lookup at the top of
      // this file. No user input is interpolated.
      preview.innerHTML = '<span class="label">Preview</span>' + (transliterationExamples[scheme.value] || transliterationExamples.simple_english);
      updateStandardPreview('transliteration_font', 'transliteration_preview', 'transliteration_font_style');
    }

    function normalizeFontSizeField(id) {
      const input = byId(id);
      if (!input || input.value === '') return;
      const value = Number(input.value);
      if (!Number.isFinite(value)) return;
      const bounded = Math.min(400, Math.max(1, value));
      input.value = bounded.toFixed(1);
    }

    function setSegmentedValue(type, value) {
      document.querySelectorAll('[data-segmented="' + type + '"] .segmented-option').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-value') === value);
      });

      if (type === 'vowels') {
        byId('nekudot').value = value === 'never' ? 'false' : 'true';
        byId('nekudot_filter').value = value === 'tanakh' ? 'tanakh' : (value === 'never' ? 'false' : 'always');
      } else if (type === 'cantillation') {
        byId('teamim').value = value === 'never' ? 'false' : 'true';
        byId('teamim_filter').value = value;
      }
    }

    function inferVowelsValue(preferences) {
      if (preferences.nekudot === 'false') return 'never';
      if (preferences.nekudot_filter === 'tanakh') return 'tanakh';
      return 'always';
    }

    function inferCantillationValue(preferences) {
      if (preferences.teamim === 'false') return 'never';
      return preferences.teamim_filter || 'available';
    }


    // Composition card state helpers — used by the shared composition card adapter below.
    function _prefSetCompositionVowels(on) {
      if (byId('nekudot')) byId('nekudot').value = on ? 'true' : 'false';
      if (byId('nekudot_filter')) byId('nekudot_filter').value = on ? 'always' : 'false';
    }

    function _prefSetCompositionCantillation(on) {
      if (byId('teamim')) byId('teamim').value = on ? 'true' : 'false';
      if (byId('teamim_filter')) byId('teamim_filter').value = on ? 'available' : 'false';
    }

    function _prefSetCompositionTransliteration(value) {
      const normalized = value || 'none';
      const include = normalized !== 'none';
      if (byId('include_transliteration_default')) byId('include_transliteration_default').checked = include;
      if (byId('transliteration_scheme') && include) {
        byId('transliteration_scheme').value = normalized;
        syncCustomSelect(byId('transliteration_scheme'));
      }
    }

    // Preferences adapter for the shared composition card component.
    function _initPreferencesCompositionCard() {
      initCompositionCard({
        containerId: 'composition-card-container',
        getState: function () {
          var vowelsOn = byId('nekudot') ? byId('nekudot').value !== 'false' : true;
          var cantillationOn = byId('teamim') ? byId('teamim').value !== 'false' : true;
          var translitCheck = byId('include_transliteration_default');
          var transliterationOn = translitCheck ? translitCheck.checked : false;
          var scheme = byId('transliteration_scheme') ? byId('transliteration_scheme').value : 'simple_english';
          var linkCheck = byId('insert_sefaria_link_default');
          var linesCheck = byId('show_line_markers_default');
          var detailsCheck = byId('include_translation_source_info');
          return {
            vowelsOn: vowelsOn,
            cantillationOn: cantillationOn,
            transliterationOn: transliterationOn,
            scheme: transliterationOn ? (scheme || 'simple_english') : 'none',
            linkOn: linkCheck ? linkCheck.checked : false,
            linesOn: linesCheck ? linesCheck.checked : false,
            detailsOn: detailsCheck ? detailsCheck.checked : false
          };
        },
        onToggle: function (key) {
          if (key === 'vowels') {
            var on = byId('nekudot') ? byId('nekudot').value !== 'false' : true;
            _prefSetCompositionVowels(!on);
          } else if (key === 'cantillation') {
            var on = byId('teamim') ? byId('teamim').value !== 'false' : true;
            _prefSetCompositionCantillation(!on);
          } else if (key === 'translit') {
            var check = byId('include_transliteration_default');
            if (check) check.checked = !check.checked;
          } else if (key === 'link') {
            var linkBox = byId('insert_sefaria_link_default');
            if (linkBox) linkBox.checked = !linkBox.checked;
          } else if (key === 'lines') {
            var linesBox = byId('show_line_markers_default');
            if (linesBox) linesBox.checked = !linesBox.checked;
          } else if (key === 'details') {
            var detailsBox = byId('include_translation_source_info');
            if (detailsBox) detailsBox.checked = !detailsBox.checked;
          }
        },
        onSchemeSelect: function (value) {
          _prefSetCompositionTransliteration(value);
          updateTransliterationPreview();
        },
        getTranslitLabel: function (on, scheme) {
          if (!on) return 'Transliteration off';
          return transliterationExamples[scheme] || transliterationExamples.simple_english;
        },
        afterUpdate: function () {
          // Apply font styling to transliteration button (preferences-specific)
          var translitBtn = byId('cc-translit-toggle');
          if (!translitBtn) return;
          var fontMetaEntry = fontMeta[(byId('transliteration_font') || {}).value || ''];
          translitBtn.style.fontFamily = fontMetaEntry ? fontMetaEntry.stack : '';
          var sizeInput = byId('transliteration_font_size');
          if (sizeInput && sizeInput.value) translitBtn.style.fontSize = Number(sizeInput.value) + 'px';
          else translitBtn.style.fontSize = '';
          applyPreviewStyles('cc-translit-toggle', 'transliteration_font_style');
        }
      });
    }

    function updateSheimotSummary() {
      const enabled = ['meforash_replace','yaw_replace','elodim_replace','god_replace']
        .map(byId)
        .filter(Boolean)
        .filter(function(el) { return el.checked; }).length;
      const node = byId('sheimot_summary_note');
      if (!node) return;
      node.textContent = enabled > 0 ? enabled + ' mapping' + (enabled === 1 ? '' : 's') + ' enabled' : 'None';
    }

    function getCustomField(selectId) {
      return byId(selectId + '_custom');
    }

    function getSelectStoredValue(selectId) {
      const select = byId(selectId);
      if (!select) return '';
      if (select.value === '__other__') {
        const custom = getCustomField(selectId);
        return custom ? custom.value.trim() : '';
      }
      return select.value;
    }

    function setReplacementSelectValue(selectId, storedValue) {
      const select = byId(selectId);
      if (!select) return;
      const value = String(storedValue == null ? '' : storedValue);
      const matches = Array.from(select.options).some(function(opt) { return opt.value === value; });
      if (matches) {
        select.value = value;
      } else {
        select.value = '__other__';
        const custom = getCustomField(selectId);
        if (custom) custom.value = value;
      }
      toggleCustomReplacementField(selectId);
    }

    function toggleCustomReplacementField(selectId) {
      const select = byId(selectId);
      const custom = getCustomField(selectId);
      if (!select || !custom) return;
      const show = select.value === '__other__';
      custom.hidden = !show;
      if (!show) custom.value = '';
    }

    function bindReplacementField(selectId, checkboxId) {
      const select = byId(selectId);
      const custom = getCustomField(selectId);
      const toggle = byId(checkboxId);
      if (!select) return;

      function handleChange() {
        toggleCustomReplacementField(selectId);
        if (toggle) toggle.checked = true;
        syncCustomSelect(select);
        updateSheimotSummary();
      }

      select.addEventListener('change', handleChange);
      if (custom) {
        custom.addEventListener('input', function() {
          if (toggle) toggle.checked = true;
          updateSheimotSummary();
        });
        custom.addEventListener('change', function() {
          if (toggle) toggle.checked = true;
          updateSheimotSummary();
        });
      }
    }

    function renderOverrideGrid() {
      const grid = byId('override_grid');
      if (!grid) return;
      // Clear: constant empty string; equivalent to replaceChildren().
      grid.innerHTML = '';
      overrideChars.forEach(function(ch) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'override-char-btn' + (selectedOverrideChar === ch ? ' active' : '');
        btn.textContent = ch;
        btn.setAttribute('data-char', ch);
        btn.addEventListener('click', function() {
          selectedOverrideChar = ch;
          byId('override_selected_char').value = ch;
          byId('override_value').value = transliterationOverrides[ch] || '';
          renderOverrideGrid();
        });
        grid.appendChild(btn);
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderOverrideList() {
      const list = byId('override_list');
      if (!list) return;
      const keys = Object.keys(transliterationOverrides).sort();
      if (!keys.length) {
        // Constant literal string.
        list.innerHTML = '<div class="mini-help">No transliteration overrides saved.</div>';
        return;
      }
      // Every user-sourced value is passed through `escapeHtml`. If you
      // change this builder, keep every interpolation escaped.
      list.innerHTML = keys.map(function(k) {
        return '<div class="override-item"><span><strong>' + escapeHtml(k) + '</strong> → ' + escapeHtml(transliterationOverrides[k]) + '</span></div>';
      }).join('');
    }

    function syncOverridesField() {
      const field = byId('transliteration_overrides');
      if (field) field.value = JSON.stringify(transliterationOverrides);
      renderOverrideList();
    }

    function buildCustomSelectMarkupFromSelect(select) {
      if (!select || select.dataset.enhancedCustomSelect === 'true') return null;
      select.dataset.enhancedCustomSelect = 'true';
      select.classList.add('enhanced-native-select');

      const wrapper = document.createElement('div');
      wrapper.className = 'custom-select';
      wrapper.setAttribute('data-custom-select', select.id || '');
      wrapper.setAttribute('data-custom-select-for', select.name || select.id || '');

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'custom-select-button';
      button.setAttribute('aria-haspopup', 'listbox');
      button.setAttribute('aria-expanded', 'false');
      // Constant literal; two empty <span>s for the select widget's scaffolding.
      button.innerHTML = '<span class="custom-select-value"></span><span class="custom-select-caret">▾</span>';

      const menu = document.createElement('div');
      menu.className = 'custom-select-menu';
      menu.setAttribute('role', 'listbox');

      Array.from(select.children).forEach(function(child) {
        if (child.tagName === 'OPTGROUP') {
          const label = document.createElement('div');
          label.className = 'custom-select-group-label';
          label.textContent = child.label || '';
          menu.appendChild(label);
          Array.from(child.children).forEach(function(opt) {
            const optBtn = document.createElement('button');
            optBtn.type = 'button';
            optBtn.className = 'custom-select-option';
            optBtn.setAttribute('data-value', opt.value);
            optBtn.textContent = opt.textContent;
            menu.appendChild(optBtn);
          });
        } else if (child.tagName === 'OPTION') {
          const optBtn = document.createElement('button');
          optBtn.type = 'button';
          optBtn.className = 'custom-select-option';
          optBtn.setAttribute('data-value', child.value);
          optBtn.textContent = child.textContent;
          menu.appendChild(optBtn);
        }
      });

      wrapper.appendChild(button);
      wrapper.appendChild(menu);
      select.parentNode.insertBefore(wrapper, select.nextSibling);

      button.addEventListener('click', function(e) {
        e.stopPropagation();
        document.querySelectorAll('.custom-select.open').forEach(function(other) {
          if (other !== wrapper) {
            other.classList.remove('open');
            const otherButton = other.querySelector('.custom-select-button');
            if (otherButton) otherButton.setAttribute('aria-expanded', 'false');
          }
        });
        const isOpen = wrapper.classList.toggle('open');
        button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      wrapper.querySelectorAll('.custom-select-option').forEach(function(optBtn) {
        optBtn.addEventListener('click', function(e) {
          e.preventDefault();
          select.value = optBtn.getAttribute('data-value');
          syncCustomSelect(select);
          wrapper.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
          select.dispatchEvent(new Event('change', { bubbles: true }));
        });
      });

      syncCustomSelect(select);
      return wrapper;
    }

    function syncCustomSelect(select) {
      if (!select) return;
      const wrapper = document.querySelector('[data-custom-select="' + select.id + '"]');
      if (!wrapper) return;
      const valueNode = wrapper.querySelector('.custom-select-value');
      const selectedOption = select.options[select.selectedIndex];
      if (valueNode) valueNode.textContent = selectedOption ? selectedOption.textContent : '';
      wrapper.querySelectorAll('.custom-select-option').forEach(function(optBtn) {
        optBtn.classList.toggle('is-selected', optBtn.getAttribute('data-value') === select.value);
      });
    }

    function enhanceNativeSelect(selector) {
      document.querySelectorAll(selector).forEach(function(select) {
        buildCustomSelectMarkupFromSelect(select);
      });
    }

    function collectPreferenceObject() {
      syncOverridesField();
      const preferenceObject = {};

      document.querySelectorAll('select').forEach(function(el) {
        if (customReplacementFields.indexOf(el.name) >= 0) {
          preferenceObject[el.name] = getSelectStoredValue(el.id);
        } else {
          preferenceObject[el.name] = el.value;
        }
      });

      document.querySelectorAll('input[type="checkbox"]').forEach(function(el) {
        preferenceObject[el.name] = el.checked;
      });

      // A native colour input cannot hold "no colour", but "" is exactly what
      // we need to store for "leave the document's own formatting alone".
      // `data-unset` carries that state alongside the picker's value.
      document.querySelectorAll('input[type="color"]').forEach(function(el) {
        if (!el.name) return;
        preferenceObject[el.name] = el.dataset.unset === 'true' ? '' : el.value;
      });

      document.querySelectorAll('input[type="text"], input[type="number"], input[type="hidden"]').forEach(function(el) {
        if (!el.name) return;
        if (el.dataset.customFor) return;
        preferenceObject[el.name] = el.value;
      });

      return preferenceObject;
    }

    /**
     * Set a colour field from a stored preference. An empty stored value means
     * "inherit the document's own colour", which a native <input type=color>
     * has no way to represent — so the state lives in data-unset and the field
     * is visually muted.
     */
    function setColorFieldValue(el, storedValue) {
      var value = String(storedValue == null ? '' : storedValue).trim();
      if (/^#[0-9a-fA-F]{6}$/.test(value)) {
        el.value = value.toLowerCase();
        el.dataset.unset = 'false';
      } else {
        el.dataset.unset = 'true';
      }
      el.closest('.color-control').classList.toggle('is-unset', el.dataset.unset === 'true');
    }

    function bindColorControls() {
      document.querySelectorAll('input[type="color"]').forEach(function(el) {
        if (!el.name) return;
        if (!el.dataset.unset) setColorFieldValue(el, '');
        el.addEventListener('input', function() {
          el.dataset.unset = 'false';
          el.closest('.color-control').classList.remove('is-unset');
        });
      });

      document.querySelectorAll('[data-color-clear]').forEach(function(button) {
        button.addEventListener('click', function() {
          var target = byId(button.dataset.colorClear);
          if (!target) return;
          setColorFieldValue(target, '');
        });
      });
    }

    function applyPreferencesToForm(preferences) {
      try {
              document.querySelectorAll('input[type="checkbox"]').forEach(function(el) {
                el.checked = preferences[el.name] == 'true' || preferences[el.name] === true;
              });

              document.querySelectorAll('input[type="color"]').forEach(function(el) {
                if (!el.name) return;
                var stored = preferences[el.name];
                setColorFieldValue(el, stored);
              });

              document.querySelectorAll('select').forEach(function(el) {
                if (preferences[el.name] !== undefined && preferences[el.name] !== null && customReplacementFields.indexOf(el.name) === -1) {
                  el.value = preferences[el.name];
                }
              });

              document.querySelectorAll('input[type="text"], input[type="number"], input[type="hidden"]').forEach(function(el) {
                if (!el.name) return;
                if (el.dataset.customFor) return;
                if (preferences[el.name] !== undefined && preferences[el.name] !== null && preferences[el.name] !== '') {
                  el.value = preferences[el.name];
                } else if (FONT_SIZE_FIELDS.indexOf(el.name) >= 0 && preferences[el.name] === '') {
                  el.value = ''; // blank size = match the document
                }
              });

              customReplacementFields.forEach(function(name) {
                setReplacementSelectValue(name, preferences[name]);
              });

              // Sync button-group controls (Display & Insertion Defaults)
              var btnGroupDefaults = {
                output_mode_default: 'both',
                bilingual_layout_default: 'he-right',
                voices_insert_mode_default: 'reference',
                lexicon_insert_mode_default: 'entry'
              };
              Object.keys(btnGroupDefaults).forEach(function(groupId) {
                var val = (preferences[groupId] !== undefined && preferences[groupId] !== null && preferences[groupId] !== '')
                  ? preferences[groupId]
                  : btnGroupDefaults[groupId];
                // Migrate legacy 'stacked' value to canonical 'he-top'
                if (groupId === 'bilingual_layout_default' && val === 'stacked') val = 'he-top';
                setPrefButtonGroup(groupId, val);
              });

              setPrefTranslitDropdown(preferences.voices_translit_default || 'none');

              try {
                transliterationOverrides = JSON.parse(preferences.transliteration_overrides || '{}') || {};
              } catch (e) {
                transliterationOverrides = {};
              }

              setSegmentedValue('vowels', inferVowelsValue(preferences));
              setSegmentedValue('cantillation', inferCantillationValue(preferences));

              ['hebrew_font','translation_font','transliteration_font','source_title_font','sefaria_link_font','source_title_heading','transliteration_scheme','preferred_translation_language']
                .forEach(function(id) {
                  const el = byId(id);
                  if (!el) return;
                  if (preferences[id] !== undefined && preferences[id] !== null && preferences[id] !== '') {
                    if (customReplacementFields.indexOf(id) === -1) el.value = preferences[id];
                  }
                  syncCustomSelect(el);
                });

              FONT_SIZE_FIELDS.forEach(normalizeFontSizeField);

              ['hebrew_font_style','translation_font_style','transliteration_font_style','source_title_font_style','sefaria_link_font_style','emphasis_bold_style','emphasis_italic_style'].forEach(function(id) {
                const input = byId(id);
                if (input && !input.value) input.value = 'normal';
                applyStyleControlState(id);
              });

              updateStandardPreview('hebrew_font', 'hebrew_font_preview', 'hebrew_font_style');
              updateStandardPreview('translation_font', 'translation_font_preview', 'translation_font_style');
              updateStandardPreview('source_title_font', 'source_title_preview', 'source_title_font_style');
              updateStandardPreview('sefaria_link_font', 'sefaria_link_preview', 'sefaria_link_font_style');
              updateTransliterationPreview();
              updateCompositionCard();
              updateSheimotSummary();
              renderOverrideGrid();
              renderOverrideList();
              syncExperimentalChildToggles();
              syncLinkerInsertToggle();
              loadMenuLayoutEditor(preferences.menu_layout);
      } catch (error) {
        console.error('Preferences modal apply failed:', error);

    // ── Menu Bar tab: order and nesting of the add-on menu ─────────────────
    //
    // Edits the `menu_layout` preference (shape documented in
    // server/menu-layout.gs). The server normalizes whatever is saved, so this
    // only needs to keep the working copy sane for display. When the layout is
    // the default, the hidden field is left EMPTY so the user keeps tracking the
    // code default instead of freezing today's menu into their preferences.

    var MENU_DIVIDER = '-';
    var MENU_SUBMENU_ID = 'quick_actions';
    var menuEditorConfig = (window.APP_CONFIG && window.APP_CONFIG.menuLayoutEditor) || null;
    var menuLayoutState = null;
    var menuDividerSeq = 0;

    function menuLayoutClone(layout) {
      return {
        top: layout.top.slice(),
        quick_actions: layout.quick_actions.slice(),
        hidden: (layout.hidden || []).slice()
      };
    }

    function menuLayoutNormalize(raw) {
      var fallback = menuLayoutClone(menuEditorConfig.defaultLayout);
      var parsed = raw;
      if (typeof raw === 'string') {
        try { parsed = raw ? JSON.parse(raw) : null; } catch (e) { parsed = null; }
      }
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.top)) return fallback;

      var seen = {};
      function clean(list, allowSubmenu) {
        return (Array.isArray(list) ? list : []).filter(function(id) {
          if (id === MENU_DIVIDER) return true;
          var known = menuEditorConfig.items.hasOwnProperty(id) || (allowSubmenu && id === MENU_SUBMENU_ID);
          if (!known || seen[id]) return false;
          seen[id] = true;
          return true;
        });
      }
      var layout = { top: clean(parsed.top, true), quick_actions: clean(parsed.quick_actions, false) };
      ['top', 'quick_actions'].forEach(function(listName) {
        fallback[listName].forEach(function(id) {
          if (id !== MENU_DIVIDER && !seen[id]) layout[listName].push(id);
        });
      });
      layout.hidden = (Array.isArray(parsed.hidden) ? parsed.hidden : []).filter(function(id, i, all) {
        return seen[id] && all.indexOf(id) === i;
      });
      return layout;
    }

    function menuLayoutIsDefault(layout) {
      var d = menuEditorConfig.defaultLayout;
      return !layout.hidden.length &&
        JSON.stringify(layout.top) === JSON.stringify(d.top) &&
        JSON.stringify(layout.quick_actions) === JSON.stringify(d.quick_actions);
    }

    // Surprise Me only reaches the real menu while its switch (Experimental
    // tab) is on, so the editor leaves it out otherwise. It keeps its place in
    // the layout, ready for when the feature is switched back on.
    function menuLayoutIsSuppressed(id) {
      if (id !== 'surprise_me') return false;
      var toggle = byId('surprise_me_enabled');
      return !(toggle && toggle.checked && !toggle.disabled);
    }

    // Neighbouring index among the rows actually drawn, so ↑/↓ never swap an
    // item with an invisible one.
    function menuLayoutVisibleNeighbour(list, index, step) {
      for (var i = index + step; i >= 0 && i < list.length; i += step) {
        if (!menuLayoutIsSuppressed(list[i])) return i;
      }
      return -1;
    }

    function menuLayoutLabel(id) {
      if (id === MENU_DIVIDER) return 'Divider';
      if (id === MENU_SUBMENU_ID) return menuEditorConfig.submenuLabel + ' ▸';
      return menuEditorConfig.items[id].label;
    }

    function menuLayoutButton(text, title, action, disabled) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'menu-layout-btn';
      btn.textContent = text;
      btn.title = title;
      btn.setAttribute('aria-label', title);
      btn.dataset.menuAction = action;
      btn.disabled = !!disabled;
      return btn;
    }

    function renderMenuLayoutList(listName, focus) {
      var listEl = document.querySelector('[data-menu-list="' + listName + '"]');
      if (!listEl) return;
      var items = menuLayoutState[listName];
      listEl.textContent = '';

      items.forEach(function(id, index) {
        if (menuLayoutIsSuppressed(id)) return;
        var isHidden = menuLayoutState.hidden.indexOf(id) !== -1;
        var li = document.createElement('li');
        li.className = 'menu-layout-row' +
          (id === MENU_DIVIDER ? ' menu-layout-row--divider' : '') +
          (id === MENU_SUBMENU_ID ? ' menu-layout-row--submenu' : '') +
          (isHidden ? ' menu-layout-row--hidden' : '');
        li.dataset.menuIndex = String(index);
        var name = menuLayoutLabel(id);

        if (id === MENU_DIVIDER) {
          var label = document.createElement('span');
          label.className = 'menu-layout-label';
          label.textContent = name;
          li.appendChild(label);
        } else {
          // A checkbox per item: unticked items stay in place here but are
          // left out of the add-on menu.
          var toggle = document.createElement('label');
          toggle.className = 'menu-layout-label menu-layout-toggle';
          toggle.title = isHidden ? 'Hidden from the menu. Tick to show it again.' : 'Untick to hide this from the menu.';
          var box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = !isHidden;
          box.dataset.menuToggle = id;
          box.setAttribute('aria-label', 'Show ' + name + ' in the menu');
          toggle.appendChild(box);
          var text = document.createElement('span');
          text.textContent = name;
          toggle.appendChild(text);
          if (isHidden) {
            var tag = document.createElement('span');
            tag.className = 'menu-layout-hidden-tag';
            tag.textContent = 'Hidden';
            toggle.appendChild(tag);
          }
          li.appendChild(toggle);
        }

        var actions = document.createElement('span');
        actions.className = 'menu-layout-actions';
        actions.appendChild(menuLayoutButton('↑', 'Move ' + name + ' up', 'up', menuLayoutVisibleNeighbour(items, index, -1) === -1));
        actions.appendChild(menuLayoutButton('↓', 'Move ' + name + ' down', 'down', menuLayoutVisibleNeighbour(items, index, 1) === -1));
        if (id === MENU_DIVIDER) {
          actions.appendChild(menuLayoutButton('✕', 'Remove divider', 'remove'));
        } else if (id !== MENU_SUBMENU_ID) {
          actions.appendChild(listName === 'top'
            ? menuLayoutButton('→', 'Move ' + name + ' into ' + menuEditorConfig.submenuLabel, 'move')
            : menuLayoutButton('←', 'Move ' + name + ' to the main menu', 'move'));
        }
        li.appendChild(actions);
        listEl.appendChild(li);
      });

      if (focus && focus.list === listName) {
        var row = listEl.querySelector('[data-menu-index="' + focus.index + '"]');
        var target = row && (focus.action === 'toggle'
          ? row.querySelector('[data-menu-toggle]')
          : (row.querySelector('[data-menu-action="' + focus.action + '"]:not([disabled])') ||
            row.querySelector('button:not([disabled])')));
        if (target) target.focus();
      }
    }

    function renderMenuLayoutEditor(focus) {
      renderMenuLayoutList('top', focus);
      renderMenuLayoutList('quick_actions', focus);
      var field = byId('menu_layout');
      if (field) field.value = menuLayoutIsDefault(menuLayoutState) ? '' : JSON.stringify(menuLayoutState);
    }

    function loadMenuLayoutEditor(storedLayout) {
      if (!menuEditorConfig) return;
      menuLayoutState = menuLayoutNormalize(storedLayout);
      renderMenuLayoutEditor();
    }

    function handleMenuLayoutAction(listName, index, action) {
      var list = menuLayoutState[listName];
      var otherName = listName === 'top' ? 'quick_actions' : 'top';
      var focus = { list: listName, index: index, action: action };
      var step = action === 'up' ? -1 : action === 'down' ? 1 : 0;
      var target = step ? menuLayoutVisibleNeighbour(list, index, step) : -1;
      if (step && target !== -1) {
        list.splice(target, 0, list.splice(index, 1)[0]);
        focus.index = target;
      } else if (action === 'remove') {
        list.splice(index, 1);
        focus.index = Math.min(index, list.length - 1);
      } else if (action === 'move') {
        var moved = list.splice(index, 1)[0];
        menuLayoutState[otherName].push(moved);
        // Moving into an empty submenu must also put the submenu back in the menu.
        if (otherName === 'quick_actions' && menuLayoutState.top.indexOf(MENU_SUBMENU_ID) === -1) {
          menuLayoutState.top.push(MENU_SUBMENU_ID);
        }
        focus = { list: otherName, index: menuLayoutState[otherName].indexOf(moved), action: 'move' };
      }
      renderMenuLayoutEditor(focus);
    }

    function initMenuLayoutEditor() {
      if (!menuEditorConfig) return;
      document.querySelectorAll('[data-menu-list]').forEach(function(listEl) {
        listEl.addEventListener('click', function(ev) {
          var btn = ev.target.closest('[data-menu-action]');
          if (!btn || btn.disabled) return;
          var row = btn.closest('[data-menu-index]');
          handleMenuLayoutAction(listEl.dataset.menuList, Number(row.dataset.menuIndex), btn.dataset.menuAction);
        });
        listEl.addEventListener('change', function(ev) {
          var box = ev.target.closest('[data-menu-toggle]');
          if (!box) return;
          var id = box.dataset.menuToggle;
          var hidden = menuLayoutState.hidden;
          var at = hidden.indexOf(id);
          if (box.checked && at !== -1) hidden.splice(at, 1);
          if (!box.checked && at === -1) hidden.push(id);
          var row = box.closest('[data-menu-index]');
          renderMenuLayoutEditor({ list: listEl.dataset.menuList, index: Number(row.dataset.menuIndex), action: 'toggle' });
        });
      });
      // Surprise Me appears in the editor only while its switch is on.
      $('#surprise_me_enabled, #experimental_features_enabled').on('change', function() {
        if (menuLayoutState) renderMenuLayoutEditor();
      });
      document.querySelectorAll('[data-menu-add-divider]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var listName = btn.dataset.menuAddDivider;
          menuLayoutState[listName].push(MENU_DIVIDER);
          renderMenuLayoutEditor({ list: listName, index: menuLayoutState[listName].length - 1, action: 'up' });
        });
      });
      var reset = document.querySelector('.menu-layout-reset');
      if (reset) {
        reset.addEventListener('click', function() {
          loadMenuLayoutEditor('');
        });
      }
      loadMenuLayoutEditor('');
    }

    function _initPreferencesTabs() {
      const tabs = Array.from(document.querySelectorAll('.pref-tab'));
      if (!tabs.length) return;
      const panels = tabs
        .map(function (t) { return document.getElementById(t.getAttribute('aria-controls')); })
        .filter(Boolean);
      if (!panels.length) return;

      function activate(tab, opts) {
        const focus = opts && opts.focus;
        const panelId = tab.getAttribute('aria-controls');
        tabs.forEach(function (t) {
          const selected = t === tab;
          t.setAttribute('aria-selected', selected ? 'true' : 'false');
          t.tabIndex = selected ? 0 : -1;
        });
        panels.forEach(function (p) {
          p.hidden = (p.id !== panelId);
        });
        if (focus) tab.focus();
      }

      // Check if we should navigate to a specific tab based on hint
      var preferredTab = window.PREF_NAVIGATE_TAB || sessionStorage.getItem('PREF_NAVIGATE_TAB');
      sessionStorage.removeItem('PREF_NAVIGATE_TAB');

      var initial = null;
      if (preferredTab) {
        initial = tabs.find(function (t) {
          return t.getAttribute('data-pref-tab') === preferredTab;
        });
      }
      if (!initial) {
        initial = tabs.find(function (t) {
          return t.getAttribute('aria-selected') === 'true';
        }) || tabs[0];
      }
      activate(initial);

      tabs.forEach(function (tab, idx) {
        tab.addEventListener('click', function () {
          activate(tab, { focus: true });
        });
        tab.addEventListener('keydown', function (ev) {
          switch (ev.key) {
            case 'ArrowRight':
              ev.preventDefault();
              tabs[(idx + 1) % tabs.length].focus();
              break;
            case 'ArrowLeft':
              ev.preventDefault();
              tabs[(idx - 1 + tabs.length) % tabs.length].focus();
              break;
            case 'Home':
              ev.preventDefault();
              tabs[0].focus();
              break;
            case 'End':
              ev.preventDefault();
              tabs[tabs.length - 1].focus();
              break;
            case 'Enter':
            case ' ':
              ev.preventDefault();
              activate(tab, { focus: true });
              break;
          }
        });
      });
    }

    _initPreferencesTabs();
    initPrefButtonGroups();
    initPrefTranslitDropdown();
    initWorkflowTabs();
    initMenuLayoutEditor();
    bindColorControls();
    _initPreferencesCompositionCard();
    loadPreferencesIntoForm();
  });
</script>
